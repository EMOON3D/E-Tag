function render(data,tagCode=""){name.textContent=clean(data.business_name)||clean(data.display_name)||"Business";category.textContent=clean(data.business_category);description.textContent=clean(data.business_description)||clean(data.bio);renderCover(data);renderAvatar(data);contacts.innerHTML="";if(data.phone)contact("Call Business","Call Business",`tel:${encodeURIComponent(data.phone)}`,`${ICON_BASE}call.png?raw=true`);if(data.whatsapp){const n=clean(data.whatsapp).replace(/\D/g,"");if(n)contact("WhatsApp","WhatsApp Me",`https://wa.me/${n}`,`${ICON_BASE}whatsapp.png?raw=true`)}if(data.email)contact("Email","Email Us",`mailto:${encodeURIComponent(data.email)}`,`${ICON_BASE}email.png?raw=true`);if(data.website)contact("Website","Visit Website",normalizeUrl(data.website),`${ICON_BASE}link.png?raw=true`);locationBox.textContent=clean(data.business_location)?`📍 ${clean(data.business_location)}`:"";hours.textContent=clean(data.opening_hours);hoursSection.classList.toggle("hidden",!clean(data.opening_hours));socialData.length=0;[["Facebook",data.facebook],["Instagram",data.instagram],["TikTok",data.tiktok],["YouTube",data.youtube],["Telegram",data.telegram],["LinkedIn",data.linkedin]].forEach(([p,v])=>{if(v)addSocial(p,v)});buildSocial();businessLinks.innerHTML="";linksSection.classList.add("hidden");[["Google Maps",data.google_maps],["Online Store",data.online_store],["Book Now",data.booking_url],["Menu / Catalogue",data.menu_url]].forEach(([l,v])=>{if(v)addBusinessLink(l,v)});if(tagCode)editButton.href=`/E-Tag/?tag=${encodeURIComponent(tagCode)}&edit=1`;loading.classList.add("hidden");errorBox.classList.add("hidden");profile.classList.remove("hidden")}
const params=new URLSearchParams(location.search),preview=params.get("preview")==="1";if(preview){window.addEventListener("message",e=>{if(e.origin!==location.origin||e.data?.type!=="etag-dashboard-preview")return;render(e.data.profile||"");editButton.classList.add("hidden")});window.parent.postMessage({type:"etag-business-preview-ready"},location.origin)}else{try{const tag=clean(params.get("tag"));if(!tag)throw new Error("Invalid E-Tag URL.");getProfile(tag.toUpperCase()).then(({tag,data})=>render(data,tag.tag_code)).catch(e=>{console.error("Business profile error:",e);loading.classList.add("hidden");errorBox.textContent=e.message||"Unable to load business profile.";errorBox.classList.remove("hidden")})}catch(e){loading.classList.add("hidden");errorBox.textContent=e.message||"Unable to load business profile.";errorBox.classList.remove("hidden")}}
</script>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";const themeClient=createClient("https://zuptxhcjzhqynrquyray.supabase.co","sb_publishable_1sa0MtE83MZXETR5JLakJA_fRVrjDJI");const def={background:"#D3DBC8",glow:"#FFFFFF"};function applyTheme(c){const x={...def,...(c&&typeof c==="object"?c:{})},bg=/^#[0-9A-F]{6}$/i.test(String(x.background||""))?String(x.background).toUpperCase():def.background,gl=/^#[0-9A-F]{6}$/i.test(String(x.glow||""))?String(x.glow).toUpperCase():def.glow;document.documentElement.style.setProperty("--theme-bg",bg);document.documentElement.style.setProperty("--theme-glow",gl)}window.addEventListener("message",e=>{if(e.origin===location.origin&&e.data?.type==="etag-theme-colors")applyTheme(e.data.colors)});const p=new URLSearchParams(location.search);if(p.get("preview")==="1")window.parent.postMessage({type:"etag-business-preview-ready"},location.origin);else(async()=>{try{const tag=p.get("tag")?.trim().toUpperCase();if(!tag)return;const{data:t}=await themeClient.from("nfc_tags").select("owner_id,active").eq("tag_code",tag).maybeSingle();if(!t?.active||!t.owner_id)return;const{data:pr}=await themeClient.from("profiles").select("theme_colors").eq("id",t.owner_id).maybeSingle();if(pr?.theme_colors)applyTheme(pr.theme_colors)}catch(e){console.error("Theme color load error:",e)}})();
