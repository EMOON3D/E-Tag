<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>E-Tag · Business</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            padding:
                24px 12px 40px;

            font-family:
                Inter,
                system-ui,
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #dbeafe,
                    #eff6ff 45%,
                    #f5f7fb 45%
                );

            color: #0f172a;
        }

        .page {
            width:
                min(100%, 560px);

            margin: 0 auto;
        }

        .profile {
            overflow: hidden;

            border-radius: 24px;

            background: #ffffff;

            box-shadow:
                0 20px 60px
                rgba(
                    15,
                    23,
                    42,
                    .12
                );
        }

        .hero {
            padding:
                32px 24px 28px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    #eff6ff,
                    #e0f2fe,
                    #f8fafc
                );
        }

        .avatar {
            width: 112px;
            height: 112px;

            margin:
                0 auto 18px;

            border-radius: 20px;

            overflow: hidden;

            background: #dbeafe;

            border:
                4px solid
                rgba(
                    15,
                    23,
                    42,
                    .08
                );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;
            font-weight: 800;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            margin: 0;

            font-size: 29px;
            line-height: 1.2;
        }

        .category {
            margin-top: 8px;

            color: #1d4ed8;

            font-size: 14px;
            font-weight: 800;
        }

        .description {
            max-width: 440px;

            margin:
                14px auto 0;

            color: #334155;

            line-height: 1.65;

            white-space: pre-wrap;
        }

        .section {
            padding: 20px;
        }

        .title {
            margin:
                0 0 12px;

            font-size: 16px;
        }

        .grid {
            display: grid;
            gap: 9px;
        }

        .button {
            display: block;

            padding:
                13px 14px;

            border-radius: 12px;

            background: #1d4ed8;

            color: #ffffff;

            text-decoration: none;

            text-align: center;

            font-size: 14px;
            font-weight: 800;
        }

        .soft {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .edit {
            background: #eef2f7;
            color: #111827;
        }

        .hours {
            padding:
                13px 14px;

            background: #f8fafc;

            border-radius: 12px;

            white-space: pre-wrap;

            line-height: 1.6;

            font-size: 13px;
        }

        .location {
            margin-top: 9px;

            color: #475569;

            line-height: 1.5;

            font-size: 13px;
        }

        .loading {
            padding: 24px;

            border-radius: 20px;

            background: #ffffff;

            text-align: center;
        }

        .hidden {
            display: none !important;
        }

    </style>
</head>


<body>

<div class="page">

    <div
        id="loading"
        class="loading"
    >
        Loading business profile...
    </div>


    <div
        id="profile"
        class="profile hidden"
    >

        <div class="hero">

            <div
                id="avatar"
                class="avatar"
            ></div>


            <h1
                id="name"
            >
                Business
            </h1>


            <div
                id="category"
                class="category"
            ></div>


            <p
                id="description"
                class="description"
            ></p>

        </div>


        <div
            id="contactSection"
            class="section"
        >

            <h2 class="title">
                Contact
            </h2>


            <div
                id="contacts"
                class="grid"
            ></div>


            <div
                id="location"
                class="location"
            ></div>

        </div>


        <div
            id="hoursSection"
            class="section hidden"
        >

            <h2 class="title">
                Opening Hours
            </h2>


            <div
                id="hours"
                class="hours"
            ></div>

        </div>


        <div
            id="socialSection"
            class="section hidden"
        >

            <h2 class="title">
                Social
            </h2>


            <div
                id="socials"
                class="grid"
            ></div>

        </div>


        <div
            id="linksSection"
            class="section hidden"
        >

            <h2 class="title">
                Business Links
            </h2>


            <div
                id="businessLinks"
                class="grid"
            ></div>

        </div>


        <div class="section">

            <a
                id="edit"
                class="button edit"
            >
                Edit My Profile
            </a>

        </div>

    </div>

</div>


<script type="module">

    import {
        createClient
    } from
        "https://esm.sh/@supabase/supabase-js@2";


    const SUPABASE_URL =
        "https://zuptxhcjzhqynrquyray.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_1sa0MtE83MZXETR5JLakJA_fRVrjDJI";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const profile =
        document.getElementById(
            "profile"
        );


    const avatar =
        document.getElementById(
            "avatar"
        );


    const name =
        document.getElementById(
            "name"
        );


    const category =
        document.getElementById(
            "category"
        );


    const description =
        document.getElementById(
            "description"
        );


    const contacts =
        document.getElementById(
            "contacts"
        );


    const locationBox =
        document.getElementById(
            "location"
        );


    const hoursSection =
        document.getElementById(
            "hoursSection"
        );


    const hours =
        document.getElementById(
            "hours"
        );


    const socialSection =
        document.getElementById(
            "socialSection"
        );


    const socials =
        document.getElementById(
            "socials"
        );


    const linksSection =
        document.getElementById(
            "linksSection"
        );


    const businessLinks =
        document.getElementById(
            "businessLinks"
        );


    const edit =
        document.getElementById(
            "edit"
        );


    function tag() {

        return new URL(
            location.href
        )
            .searchParams
            .get(
                "tag"
            );
    }


    function clean(
        value
    ) {

        return String(
            value || ""
        ).trim();
    }


    function user(
        value
    ) {

        return clean(
            value
        )
            .replace(
                /^@/,
                ""
            );
    }


    function add(
        parent,
        label,
        url,
        soft = false
    ) {

        const a =
            document.createElement(
                "a"
            );


        a.className =
            soft
                ? "button soft"
                : "button";


        a.textContent =
            label;


        a.href =
            url;


        if (
            url.startsWith(
                "http"
            )
        ) {

            a.target =
                "_blank";

            a.rel =
                "noopener";
        }


        parent.appendChild(
            a
        );
    }


    async function load() {

        const code =
            tag();


        if (
            !code
        ) {

            loading.textContent =
                "Invalid E-Tag URL.";

            return;
        }


        const {
            data: t
        } =
            await supabase
                .from(
                    "nfc_tags"
                )
                .select(
                    "owner_id,active,tag_code"
                )
                .eq(
                    "tag_code",
                    code
                )
                .maybeSingle();


        if (
            !t ||
            !t.active ||
            !t.owner_id
        ) {

            loading.textContent =
                "E-Tag not found or not activated.";

            return;
        }


        const {
            data: p
        } =
            await supabase
                .from(
                    "profiles"
                )
                .select(
                    "*"
                )
                .eq(
                    "id",
                    t.owner_id
                )
                .maybeSingle();


        if (
            !p
        ) {

            loading.textContent =
                "Business profile not found.";

            return;
        }


        const businessName =
            clean(
                p.business_name
            ) ||
            clean(
                p.display_name
            ) ||
            "Business";


        name.textContent =
            businessName;


        category.textContent =
            clean(
                p.business_category
            );


        description.textContent =
            clean(
                p.business_description
            ) ||
            clean(
                p.bio
            );


        if (
            p.avatar_url
        ) {

            avatar.innerHTML =
                `
                    <img
                        src="${p.avatar_url}"
                        alt="Business logo"
                    >
                `;

        } else {

            avatar.textContent =
                "🏢";
        }


        if (
            p.phone
        ) {

            add(
                contacts,
                "Call Business",
                `tel:${encodeURIComponent(
                    p.phone
                )}`
            );
        }


        if (
            p.whatsapp
        ) {

            const number =
                clean(
                    p.whatsapp
                )
                    .replace(
                        /\D/g,
                        ""
                    );


            if (
                number
            ) {

                add(
                    contacts,
                    "WhatsApp",
                    `https://wa.me/${number}`
                );
            }
        }


        if (
            p.email
        ) {

            add(
                contacts,
                "Email",
                `mailto:${encodeURIComponent(
                    p.email
                )}`
            );
        }


        if (
            p.website
        ) {

            add(
                contacts,
                "Website",
                /^https?:\/\//i.test(
                    p.website
                )
                    ? p.website
                    : `https://${p.website}`
            );
        }


        if (
            p.business_location
        ) {

            locationBox.textContent =
                `📍 ${p.business_location}`;
        }


        if (
            p.opening_hours
        ) {

            hours.textContent =
                p.opening_hours;

            hoursSection.classList.remove(
                "hidden"
            );
        }


        if (
            p.facebook
        ) {

            add(
                socials,
                "Facebook",
                `https://facebook.com/${user(
                    p.facebook
                )}`,
                true
            );

            socialSection.classList.remove(
                "hidden"
            );
        }


        if (
            p.instagram
        ) {

            add(
                socials,
                "Instagram",
                `https://instagram.com/${user(
                    p.instagram
                )}`,
                true
            );

            socialSection.classList.remove(
                "hidden"
            );
        }


        if (
            p.tiktok
        ) {

            add(
                socials,
                "TikTok",
                `https://www.tiktok.com/@${user(
                    p.tiktok
                )}`,
                true
            );

            socialSection.classList.remove(
                "hidden"
            );
        }


        if (
            p.youtube
        ) {

            add(
                socials,
                "YouTube",
                `https://youtube.com/@${user(
                    p.youtube
                )}`,
                true
            );

            socialSection.classList.remove(
                "hidden"
            );
        }


        if (
            p.telegram
        ) {

            add(
                socials,
                "Telegram",
                `https://t.me/${user(
                    p.telegram
                )}`,
                true
            );

            socialSection.classList.remove(
                "hidden"
            );
        }


        if (
            p.linkedin
        ) {

            add(
                socials,
                "LinkedIn",
                /^https?:\/\//i.test(
                    p.linkedin
                )
                    ? p.linkedin
                    : `https://${p.linkedin}`,
                true
            );

            socialSection.classList.remove(
                "hidden"
            );
        }


        if (
            p.google_maps
        ) {

            add(
                businessLinks,
                "Google Maps",
                p.google_maps,
                true
            );

            linksSection.classList.remove(
                "hidden"
            );
        }


        if (
            p.online_store
        ) {

            add(
                businessLinks,
                "Online Store",
                p.online_store,
                true
            );

            linksSection.classList.remove(
                "hidden"
            );
        }


        if (
            p.booking_url
        ) {

            add(
                businessLinks,
                "Book Now",
                p.booking_url,
                true
            );

            linksSection.classList.remove(
                "hidden"
            );
        }


        if (
            p.menu_url
        ) {

            add(
                businessLinks,
                "Menu / Catalogue",
                p.menu_url,
                true
            );

            linksSection.classList.remove(
                "hidden"
            );
        }


        edit.href =
            `/E-Tag/?tag=${encodeURIComponent(
                t.tag_code
            )}`;


        loading.classList.add(
            "hidden"
        );


        profile.classList.remove(
            "hidden"
        );
    }


    load();

</script>

</body>
</html>
