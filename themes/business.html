<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>E-Tag · Business</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            padding:
                24px 12px 40px;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #dbeafe 0%,
                    #eff6ff 45%,
                    #f5f7fb 45%
                );

            color:
                #0f172a;
        }

        .page {
            width:
                min(
                    100%,
                    560px
                );

            margin:
                0 auto;
        }

        .profile {
            overflow:
                hidden;

            border-radius:
                24px;

            background:
                #ffffff;

            box-shadow:
                0 20px 60px
                rgba(
                    15,
                    23,
                    42,
                    .12
                );
        }

        .hero {
            padding:
                32px 24px 28px;

            text-align:
                center;

            background:
                linear-gradient(
                    145deg,
                    #eff6ff,
                    #e0f2fe,
                    #f8fafc
                );
        }

        .avatar {
            width:
                112px;

            height:
                112px;

            margin:
                0 auto 18px;

            border-radius:
                20px;

            overflow:
                hidden;

            background:
                #dbeafe;

            border:
                4px solid
                rgba(
                    15,
                    23,
                    42,
                    .08
                );

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                32px;

            font-weight:
                800;
        }

        .avatar img {
            width:
                100%;

            height:
                100%;

            object-fit:
                cover;
        }

        .avatar.character img {
            object-fit:
                contain;

            padding:
                8px;
        }

        h1 {
            margin:
                0;

            font-size:
                29px;

            line-height:
                1.2;
        }

        .category {
            margin-top:
                8px;

            color:
                #1d4ed8;

            font-size:
                14px;

            font-weight:
                800;
        }

        .description {
            max-width:
                440px;

            margin:
                14px auto 0;

            color:
                #334155;

            line-height:
                1.65;

            white-space:
                pre-wrap;
        }

        .section {
            padding:
                20px;
        }

        .title {
            margin:
                0 0 12px;

            font-size:
                16px;
        }

        .grid {
            display:
                grid;

            gap:
                9px;
        }

        .button {
            display:
                block;

            padding:
                13px 14px;

            border-radius:
                12px;

            background:
                #1d4ed8;

            color:
                #ffffff;

            text-decoration:
                none;

            text-align:
                center;

            font-size:
                14px;

            font-weight:
                800;
        }

        .soft {
            background:
                #eff6ff;

            color:
                #1d4ed8;
        }

        .edit {
            background:
                #eef2f7;

            color:
                #111827;
        }

        .hours {
            padding:
                13px 14px;

            background:
                #f8fafc;

            border-radius:
                12px;

            white-space:
                pre-wrap;

            line-height:
                1.6;

            font-size:
                13px;
        }

        .location {
            margin-top:
                9px;

            color:
                #475569;

            line-height:
                1.5;

            font-size:
                13px;
        }

        .loading,
        .error {
            padding:
                24px;

            border-radius:
                20px;

            background:
                #ffffff;

            color:
                #0f172a;

            text-align:
                center;
        }

        .hidden {
            display:
                none !important;
        }

    </style>

</head>


<body>

<div class="page">


    <!-- LOADING -->

    <div
        id="loading"
        class="loading"
    >
        Loading business profile...
    </div>


    <!-- ERROR -->

    <div
        id="error"
        class="error hidden"
    ></div>


    <!-- PROFILE -->

    <div
        id="profile"
        class="profile hidden"
    >

        <div class="hero">

            <div
                id="avatar"
                class="avatar"
            ></div>


            <h1
                id="name"
            >
                Business
            </h1>


            <div
                id="category"
                class="category"
            ></div>


            <p
                id="description"
                class="description"
            ></p>

        </div>


        <!-- CONTACT -->

        <div class="section">

            <h2 class="title">
                Contact
            </h2>


            <div
                id="contacts"
                class="grid"
            ></div>


            <div
                id="location"
                class="location"
            ></div>

        </div>


        <!-- HOURS -->

        <div
            id="hoursSection"
            class="section hidden"
        >

            <h2 class="title">
                Opening Hours
            </h2>


            <div
                id="hours"
                class="hours"
            ></div>

        </div>


        <!-- SOCIAL -->

        <div
            id="socialSection"
            class="section hidden"
        >

            <h2 class="title">
                Social
            </h2>


            <div
                id="socials"
                class="grid"
            ></div>

        </div>


        <!-- BUSINESS LINKS -->

        <div
            id="linksSection"
            class="section hidden"
        >

            <h2 class="title">
                Business Links
            </h2>


            <div
                id="businessLinks"
                class="grid"
            ></div>

        </div>


        <!-- EDIT -->

        <div class="section">

            <a
                id="edit"
                class="button edit"
                href="#"
            >
                Edit My Profile
            </a>

        </div>

    </div>

</div>


<script type="module">

    import {
        createClient
    } from
        "https://esm.sh/@supabase/supabase-js@2";


    const SUPABASE_URL =
        "https://zuptxhcjzhqynrquyray.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_1sa0MtE83MZXETR5JLakJA_fRVrjDJI";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const errorBox =
        document.getElementById(
            "error"
        );


    const profile =
        document.getElementById(
            "profile"
        );


    const avatar =
        document.getElementById(
            "avatar"
        );


    const name =
        document.getElementById(
            "name"
        );


    const category =
        document.getElementById(
            "category"
        );


    const description =
        document.getElementById(
            "description"
        );


    const contacts =
        document.getElementById(
            "contacts"
        );


    const locationBox =
        document.getElementById(
            "location"
        );


    const hoursSection =
        document.getElementById(
            "hoursSection"
        );


    const hours =
        document.getElementById(
            "hours"
        );


    const socialSection =
        document.getElementById(
            "socialSection"
        );


    const socials =
        document.getElementById(
            "socials"
        );


    const linksSection =
        document.getElementById(
            "linksSection"
        );


    const businessLinks =
        document.getElementById(
            "businessLinks"
        );


    const edit =
        document.getElementById(
            "edit"
        );


    const CHARACTER_BASE =
        "/E-Tag/assets/characters/business/";


    function getTagCode() {

        return new URL(
            window.location.href
        )
            .searchParams
            .get(
                "tag"
            );
    }


    function clean(
        value
    ) {

        return String(
            value || ""
        ).trim();
    }


    function username(
        value
    ) {

        return clean(
            value
        ).replace(
            /^@/,
            ""
        );
    }


    function normalizeUrl(
        value
    ) {

        const url =
            clean(
                value
            );


        if (
            !url
        ) {

            return "";
        }


        if (
            /^https?:\/\//i.test(
                url
            )
        ) {

            return url;
        }


        return `https://${url}`;
    }


    function renderAvatar(
        element,
        data
    ) {

        element.innerHTML =
            "";

        element.classList.remove(
            "character"
        );


        /*
         * CHARACTER
         */

        if (
            data.avatar_type ===
                "character" &&
            data.character_id
        ) {

            const image =
                document.createElement(
                    "img"
                );


            image.src =
                `${CHARACTER_BASE}${encodeURIComponent(
                    data.character_id
                )}.svg`;


            image.alt =
                "Business character";


            image.onerror =
                () => {

                    element.innerHTML =
                        "";

                    element.classList.remove(
                        "character"
                    );

                    element.textContent =
                        "🏢";
                };


            element.classList.add(
                "character"
            );


            element.appendChild(
                image
            );


            return;
        }


        /*
         * UPLOADED LOGO
         */

        if (
            data.avatar_url
        ) {

            const image =
                document.createElement(
                    "img"
                );


            image.src =
                data.avatar_url;


            image.alt =
                "Business logo";


            image.onerror =
                () => {

                    element.innerHTML =
                        "";

                    element.textContent =
                        "🏢";
                };


            element.appendChild(
                image
            );


            return;
        }


        /*
         * FALLBACK
         */

        element.textContent =
            "🏢";
    }


    function add(
        parent,
        label,
        href,
        soft = false
    ) {

        const link =
            document.createElement(
                "a"
            );


        link.className =
            soft
                ? "button soft"
                : "button";


        link.textContent =
            label;


        link.href =
            href;


        if (
            href.startsWith(
                "http"
            )
        ) {

            link.target =
                "_blank";

            link.rel =
                "noopener";
        }


        parent.appendChild(
            link
        );
    }


    async function load() {

        const tagCode =
            getTagCode();


        if (
            !tagCode
        ) {

            loading.classList.add(
                "hidden"
            );

            errorBox.textContent =
                "Invalid E-Tag URL.";

            errorBox.classList.remove(
                "hidden"
            );

            return;
        }


        /*
         * LOAD TAG
         */

        const {
            data: tag,
            error: tagError
        } =
            await supabase
                .from(
                    "nfc_tags"
                )
                .select(
                    "owner_id,active,tag_code"
                )
                .eq(
                    "tag_code",
                    tagCode
                )
                .maybeSingle();


        if (
            tagError
        ) {

            loading.classList.add(
                "hidden"
            );

            errorBox.textContent =
                `Unable to load E-Tag: ${
                    tagError.message
                }`;

            errorBox.classList.remove(
                "hidden"
            );

            return;
        }


        if (
            !tag
        ) {

            loading.textContent =
                "E-Tag not found.";

            return;
        }


        if (
            !tag.active ||
            !tag.owner_id
        ) {

            loading.textContent =
                "This E-Tag has not been activated.";

            return;
        }


        /*
         * LOAD PROFILE
         */

        const {
            data,
            error: profileError
        } =
            await supabase
                .from(
                    "profiles"
                )
                .select(
                    "*"
                )
                .eq(
                    "id",
                    tag.owner_id
                )
                .maybeSingle();


        if (
            profileError
        ) {

            loading.classList.add(
                "hidden"
            );

            errorBox.textContent =
                `Unable to load business profile: ${
                    profileError.message
                }`;

            errorBox.classList.remove(
                "hidden"
            );

            return;
        }


        if (
            !data
        ) {

            loading.textContent =
                "Public business profile not found.";

            return;
        }


        /*
         * BASIC BUSINESS INFO
         */

        const businessName =
            clean(
                data.business_name
            ) ||
            clean(
                data.display_name
            ) ||
            "Business";


        name.textContent =
            businessName;


        category.textContent =
            clean(
                data.business_category
            );


        description.textContent =
            clean(
                data.business_description
            ) ||
            clean(
                data.bio
            );


        renderAvatar(
            avatar,
            data
        );


        /*
         * CONTACT
         */

        if (
            data.phone
        ) {

            add(
                contacts,
                "Call Business",
                `tel:${encodeURIComponent(
                    data.phone
                )}`
            );
        }


        if (
            data.whatsapp
        ) {

            const number =
                clean(
                    data.whatsapp
                )
                    .replace(
                        /\D/g,
                        ""
                    );


            if (
                number
            ) {

                add(
                    contacts,
                    "WhatsApp",
                    `https://wa.me/${number}`
                );
            }
        }


        if (
            data.email
        ) {

            add(
                contacts,
                "Email",
                `mailto:${encodeURIComponent(
                    data.email
                )}`
            );
        }


        if (
            data.website
        ) {

            add(
                contacts,
                "Website",
                normalizeUrl(
                    data.website
                )
            );
        }


        /*
         * LOCATION
         */

        if (
            data.business_location
        ) {

            locationBox.textContent =
                `📍 ${data.business_location}`;
        }


        /*
         * OPENING HOURS
         */

        if (
            data.opening_hours
        ) {

            hours.textContent =
                data.opening_hours;


            hoursSection.classList.remove(
                "hidden"
            );
        }


        /*
         * SOCIAL
         */

        if (
            data.facebook
        ) {

            add(
                socials,
                "Facebook",
                `https://facebook.com/${username(
                    data.facebook
                )}`,
                true
            );


            socialSection.classList.remove(
                "hidden"
            );
        }


        if (
            data.instagram
        ) {

            add(
                socials,
                "Instagram",
                `https://instagram.com/${username(
                    data.instagram
                )}`,
                true
            );


            socialSection.classList.remove(
                "hidden"
            );
        }


        if (
            data.tiktok
        ) {

            add(
                socials,
                "TikTok",
                `https://www.tiktok.com/@${username(
                    data.tiktok
                )}`,
                true
            );


            socialSection.classList.remove(
                "hidden"
            );
        }


        if (
            data.youtube
        ) {

            add(
                socials,
                "YouTube",
                `https://youtube.com/@${username(
                    data.youtube
                )}`,
                true
            );


            socialSection.classList.remove(
                "hidden"
            );
        }


        if (
            data.telegram
        ) {

            add(
                socials,
                "Telegram",
                `https://t.me/${username(
                    data.telegram
                )}`,
                true
            );


            socialSection.classList.remove(
                "hidden"
            );
        }


        if (
            data.linkedin
        ) {

            add(
                socials,
                "LinkedIn",
                normalizeUrl(
                    data.linkedin
                ),
                true
            );


            socialSection.classList.remove(
                "hidden"
            );
        }


        /*
         * BUSINESS LINKS
         */

        if (
            data.google_maps
        ) {

            add(
                businessLinks,
                "Google Maps",
                normalizeUrl(
                    data.google_maps
                ),
                true
            );


            linksSection.classList.remove(
                "hidden"
            );
        }


        if (
            data.online_store
        ) {

            add(
                businessLinks,
                "Online Store",
                normalizeUrl(
                    data.online_store
                ),
                true
            );


            linksSection.classList.remove(
                "hidden"
            );
        }


        if (
            data.booking_url
        ) {

            add(
                businessLinks,
                "Book Now",
                normalizeUrl(
                    data.booking_url
                ),
                true
            );


            linksSection.classList.remove(
                "hidden"
            );
        }


        if (
            data.menu_url
        ) {

            add(
                businessLinks,
                "Menu / Catalogue",
                normalizeUrl(
                    data.menu_url
                ),
                true
            );


            linksSection.classList.remove(
                "hidden"
            );
        }


        /*
         * IMPORTANT EDIT FIX
         *
         * Explicit edit mode is required so
         * logged-out users don't get redirected
         * back to the public theme.
         */

        edit.href =
            `/E-Tag/?tag=${encodeURIComponent(
                tag.tag_code
            )}&edit=1`;


        loading.classList.add(
            "hidden"
        );


        profile.classList.remove(
            "hidden"
        );
    }


    load()
        .catch(
            error => {

                console.error(
                    "Business profile error:",
                    error
                );


                loading.classList.add(
                    "hidden"
                );


                errorBox.textContent =
                    error.message ||
                    "Unable to load business profile.";


                errorBox.classList.remove(
                    "hidden"
                );
            }
        );

</script>

</body>

</html>
