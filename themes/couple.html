<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>E-Tag · Couple</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            padding:
                24px 12px 40px;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #ffe4e6 0%,
                    #fff7ed 45%,
                    #f5f7fb 45%
                );

            color:
                #7f1d1d;
        }

        .page {
            width:
                min(
                    100%,
                    560px
                );

            margin:
                0 auto;
        }

        .profile {
            overflow:
                hidden;

            border-radius:
                28px;

            background:
                #ffffff;

            box-shadow:
                0 20px 60px
                rgba(
                    127,
                    29,
                    29,
                    .12
                );
        }

        .hero {
            padding:
                34px 24px 30px;

            text-align:
                center;

            background:
                linear-gradient(
                    145deg,
                    #fff7ed,
                    #ffe4e6,
                    #fef2f2
                );
        }

        .heart {
            font-size:
                26px;

            margin-bottom:
                8px;
        }

        .avatar {
            width:
                132px;

            height:
                132px;

            margin:
                0 auto 18px;

            border-radius:
                28px;

            overflow:
                hidden;

            background:
                #fecdd3;

            border:
                4px solid
                rgba(
                    190,
                    24,
                    93,
                    .12
                );

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                35px;

            font-weight:
                800;
        }

        .avatar img {
            width:
                100%;

            height:
                100%;

            object-fit:
                cover;
        }

        .avatar.character img {
            object-fit:
                contain;

            padding:
                8px;
        }

        h1 {
            margin:
                0;

            font-size:
                30px;

            line-height:
                1.2;
        }

        .people {
            margin-top:
                8px;

            color:
                #9f1239;

            font-size:
                14px;

            font-weight:
                700;
        }

        .date {
            margin-top:
                8px;

            color:
                #be123c;

            font-size:
                13px;
        }

        .bio,
        .story {
            max-width:
                440px;

            margin:
                14px auto 0;

            line-height:
                1.65;

            white-space:
                pre-wrap;
        }

        .bio {
            color:
                #991b1b;
        }

        .story {
            color:
                #7f1d1d;
        }

        .section {
            padding:
                20px;
        }

        .title {
            margin:
                0 0 12px;

            font-size:
                16px;
        }

        .grid {
            display:
                grid;

            gap:
                9px;
        }

        .button {
            display:
                block;

            padding:
                13px 14px;

            border-radius:
                12px;

            background:
                #9f1239;

            color:
                #ffffff;

            text-decoration:
                none;

            text-align:
                center;

            font-size:
                14px;

            font-weight:
                800;
        }

        .social {
            background:
                #ffe4e6;

            color:
                #9f1239;
        }

        .edit {
            background:
                #f1f5f9;

            color:
                #111827;
        }

        .loading,
        .error {
            padding:
                24px;

            border-radius:
                20px;

            background:
                #ffffff;

            color:
                #7f1d1d;

            text-align:
                center;
        }

        .hidden {
            display:
                none !important;
        }

    </style>

</head>


<body>

<div class="page">


    <!-- LOADING -->

    <div
        id="loading"
        class="loading"
    >
        Loading couple profile...
    </div>


    <!-- ERROR -->

    <div
        id="error"
        class="error hidden"
    ></div>


    <!-- PROFILE -->

    <div
        id="profile"
        class="profile hidden"
    >

        <div class="hero">

            <div class="heart">
                ❤️
            </div>


            <div
                id="avatar"
                class="avatar"
            ></div>


            <h1
                id="coupleName"
            >
                Couple
            </h1>


            <div
                id="people"
                class="people"
            ></div>


            <div
                id="date"
                class="date"
            ></div>


            <p
                id="bio"
                class="bio"
            ></p>


            <p
                id="story"
                class="story"
            ></p>

        </div>


        <!-- CONTACT -->

        <div class="section">

            <h2 class="title">
                Contact
            </h2>


            <div
                id="contacts"
                class="grid"
            ></div>

        </div>


        <!-- SOCIAL -->

        <div
            id="socialSection"
            class="section hidden"
        >

            <h2 class="title">
                Social
            </h2>


            <div
                id="socials"
                class="grid"
            ></div>

        </div>


        <!-- EDIT -->

        <div class="section">

            <a
                id="edit"
                class="button edit"
                href="#"
            >
                Edit My Profile
            </a>

        </div>

    </div>

</div>


<script type="module">

    import {
        createClient
    } from
        "https://esm.sh/@supabase/supabase-js@2";


    const SUPABASE_URL =
        "https://zuptxhcjzhqynrquyray.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_1sa0MtE83MZXETR5JLakJA_fRVrjDJI";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const errorBox =
        document.getElementById(
            "error"
        );


    const profile =
        document.getElementById(
            "profile"
        );


    const avatar =
        document.getElementById(
            "avatar"
        );


    const coupleName =
        document.getElementById(
            "coupleName"
        );


    const people =
        document.getElementById(
            "people"
        );


    const date =
        document.getElementById(
            "date"
        );


    const bio =
        document.getElementById(
            "bio"
        );


    const story =
        document.getElementById(
            "story"
        );


    const contacts =
        document.getElementById(
            "contacts"
        );


    const socials =
        document.getElementById(
            "socials"
        );


    const socialSection =
        document.getElementById(
            "socialSection"
        );


    const edit =
        document.getElementById(
            "edit"
        );


    const CHARACTER_BASE =
        "/E-Tag/assets/characters/couple/";


    function getTagCode() {

        return new URL(
            window.location.href
        )
            .searchParams
            .get(
                "tag"
            );
    }


    function clean(
        value
    ) {

        return String(
            value || ""
        ).trim();
    }


    function username(
        value
    ) {

        return clean(
            value
        ).replace(
            /^@/,
            ""
        );
    }


    function dateLabel(
        value
    ) {

        if (
            !value
        ) {

            return "";
        }


        const parsed =
            new Date(
                `${value}T00:00:00`
            );


        if (
            Number.isNaN(
                parsed.getTime()
            )
        ) {

            return value;
        }


        return parsed.toLocaleDateString(
            undefined,
            {
                day:
                    "numeric",

                month:
                    "long",

                year:
                    "numeric"
            }
        );
    }


    function renderAvatar(
        element,
        data
    ) {

        element.innerHTML =
            "";

        element.classList.remove(
            "character"
        );


        if (
            data.avatar_type ===
                "character" &&
            data.character_id
        ) {

            const image =
                document.createElement(
                    "img"
                );


            image.src =
                `${CHARACTER_BASE}${encodeURIComponent(
                    data.character_id
                )}.svg`;


            image.alt =
                "Couple character";


            image.onerror =
                () => {

                    element.innerHTML =
                        "";

                    element.classList.remove(
                        "character"
                    );

                    element.textContent =
                        "❤️";
                };


            element.classList.add(
                "character"
            );


            element.appendChild(
                image
            );


            return;
        }


        if (
            data.avatar_url
        ) {

            const image =
                document.createElement(
                    "img"
                );


            image.src =
                data.avatar_url;


            image.alt =
                "Couple photo";


            image.onerror =
                () => {

                    element.innerHTML =
                        "";

                    element.textContent =
                        "❤️";
                };


            element.appendChild(
                image
            );


            return;
        }


        element.textContent =
            "❤️";
    }


    function addButton(
        parent,
        label,
        href,
        social = false
    ) {

        const link =
            document.createElement(
                "a"
            );


        link.className =
            social
                ? "button social"
                : "button";


        link.textContent =
            label;


        link.href =
            href;


        if (
            href.startsWith(
                "http"
            )
        ) {

            link.target =
                "_blank";

            link.rel =
                "noopener";
        }


        parent.appendChild(
            link
        );


        if (
            social
        ) {

            socialSection.classList.remove(
                "hidden"
            );
        }
    }


    async function load() {

        const tagCode =
            getTagCode();


        if (
            !tagCode
        ) {

            loading.classList.add(
                "hidden"
            );

            errorBox.textContent =
                "Invalid E-Tag URL.";

            errorBox.classList.remove(
                "hidden"
            );

            return;
        }


        const {
            data: tag,
            error: tagError
        } =
            await supabase
                .from(
                    "nfc_tags"
                )
                .select(
                    "owner_id,active,tag_code"
                )
                .eq(
                    "tag_code",
                    tagCode
                )
                .maybeSingle();


        if (
            tagError
        ) {

            loading.classList.add(
                "hidden"
            );

            errorBox.textContent =
                `Unable to load E-Tag: ${
                    tagError.message
                }`;

            errorBox.classList.remove(
                "hidden"
            );

            return;
        }


        if (
            !tag
        ) {

            loading.textContent =
                "E-Tag not found.";

            return;
        }


        if (
            !tag.active ||
            !tag.owner_id
        ) {

            loading.textContent =
                "This E-Tag has not been activated.";

            return;
        }


        const {
            data: data,
            error: profileError
        } =
            await supabase
                .from(
                    "profiles"
                )
                .select(
                    "*"
                )
                .eq(
                    "id",
                    tag.owner_id
                )
                .maybeSingle();


        if (
            profileError
        ) {

            loading.classList.add(
                "hidden"
            );

            errorBox.textContent =
                `Unable to load couple profile: ${
                    profileError.message
                }`;

            errorBox.classList.remove(
                "hidden"
            );

            return;
        }


        if (
            !data
        ) {

            loading.textContent =
                "Public couple profile not found.";

            return;
        }


        const displayName =
            clean(
                data.couple_name
            ) ||
            clean(
                data.display_name
            ) ||
            "Our Story";


        coupleName.textContent =
            displayName;


        const person1 =
            clean(
                data.person1_name
            );


        const person2 =
            clean(
                data.person2_name
            );


        if (
            person1 ||
            person2
        ) {

            people.textContent =
                [
                    person1,
                    person2
                ]
                    .filter(
                        Boolean
                    )
                    .join(
                        " ❤️ "
                    );
        }


        if (
            data.anniversary_date
        ) {

            date.textContent =
                `Together since ${dateLabel(
                    data.anniversary_date
                )}`;
        }


        bio.textContent =
            clean(
                data.bio
            );


        story.textContent =
            clean(
                data.our_story
            );


        if (
            !data.our_story
        ) {

            story.style.display =
                "none";
        }


        renderAvatar(
            avatar,
            data
        );


        /* CONTACT */


        if (
            data.whatsapp
        ) {

            const number =
                clean(
                    data.whatsapp
                )
                    .replace(
                        /\D/g,
                        ""
                    );


            if (
                number
            ) {

                addButton(
                    contacts,
                    "WhatsApp",
                    `https://wa.me/${number}`
                );
            }
        }


        if (
            data.email
        ) {

            addButton(
                contacts,
                "Email",
                `mailto:${encodeURIComponent(
                    data.email
                )}`
            );
        }


        /* SOCIAL */


        if (
            data.person1_instagram
        ) {

            addButton(
                socials,
                "Person 1 Instagram",
                `https://instagram.com/${username(
                    data.person1_instagram
                )}`,
                true
            );
        }


        if (
            data.person2_instagram
        ) {

            addButton(
                socials,
                "Person 2 Instagram",
                `https://instagram.com/${username(
                    data.person2_instagram
                )}`,
                true
            );
        }


        if (
            data.person1_tiktok
        ) {

            addButton(
                socials,
                "Person 1 TikTok",
                `https://www.tiktok.com/@${username(
                    data.person1_tiktok
                )}`,
                true
            );
        }


        if (
            data.person2_tiktok
        ) {

            addButton(
                socials,
                "Person 2 TikTok",
                `https://www.tiktok.com/@${username(
                    data.person2_tiktok
                )}`,
                true
            );
        }


        if (
            data.shared_youtube
        ) {

            addButton(
                socials,
                "Shared YouTube",
                `https://youtube.com/@${username(
                    data.shared_youtube
                )}`,
                true
            );
        }


        if (
            data.other_social_links
        ) {

            data.other_social_links
                .split(
                    "\n"
                )
                .map(
                    value =>
                        value.trim()
                )
                .filter(
                    Boolean
                )
                .forEach(
                    (
                        url,
                        index
                    ) => {

                        const safeUrl =
                            /^https?:\/\//i.test(
                                url
                            )
                                ? url
                                : `https://${url}`;


                        addButton(
                            socials,
                            `Other Link ${index + 1}`,
                            safeUrl,
                            true
                        );
                    }
                );
        }


        /*
         * IMPORTANT FIX
         *
         * Logged-out user clicking this button
         * will enter edit/login mode.
         */

        edit.href =
            `/E-Tag/?tag=${encodeURIComponent(
                tag.tag_code
            )}&edit=1`;


        loading.classList.add(
            "hidden"
        );


        profile.classList.remove(
            "hidden"
        );
    }


    load()
        .catch(
            error => {

                console.error(
                    "Couple profile error:",
                    error
                );


                loading.classList.add(
                    "hidden"
                );


                errorBox.textContent =
                    error.message ||
                    "Unable to load couple profile.";


                errorBox.classList.remove(
                    "hidden"
                );
            }
        );

</script>

</body>

</html>
