<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>E-Tag · Couple</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            padding:
                24px 12px 40px;

            font-family:
                Inter,
                system-ui,
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #ffe4e6,
                    #fff7ed 45%,
                    #f5f7fb 45%
                );

            color: #7f1d1d;
        }

        .page {
            width:
                min(100%, 560px);

            margin: 0 auto;
        }

        .profile {
            overflow: hidden;

            border-radius: 28px;

            background: #ffffff;

            box-shadow:
                0 20px 60px
                rgba(
                    127,
                    29,
                    29,
                    .12
                );
        }

        .hero {
            padding:
                34px 24px 30px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    #fff7ed,
                    #ffe4e6,
                    #fef2f2
                );
        }

        .heart {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .avatar {
            width: 132px;
            height: 132px;

            margin:
                0 auto 18px;

            border-radius: 28px;

            overflow: hidden;

            background: #fecdd3;

            border:
                4px solid
                rgba(
                    190,
                    24,
                    93,
                    .12
                );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 35px;
            font-weight: 800;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            margin: 0;

            font-size: 30px;
            line-height: 1.2;
        }

        .people {
            margin-top: 8px;

            color: #9f1239;

            font-size: 14px;
            font-weight: 700;
        }

        .date {
            margin-top: 8px;

            color: #be123c;

            font-size: 13px;
        }

        .bio,
        .story {
            max-width: 440px;

            margin:
                14px auto 0;

            line-height: 1.65;

            white-space: pre-wrap;
        }

        .bio {
            color: #991b1b;
        }

        .story {
            color: #7f1d1d;
        }

        .section {
            padding: 20px;
        }

        .title {
            margin:
                0 0 12px;

            font-size: 16px;
        }

        .grid {
            display: grid;
            gap: 9px;
        }

        .button {
            display: block;

            padding:
                13px 14px;

            border-radius: 12px;

            background: #9f1239;

            color: #ffffff;

            text-decoration: none;

            text-align: center;

            font-size: 14px;
            font-weight: 800;
        }

        .social {
            background: #ffe4e6;
            color: #9f1239;
        }

        .edit {
            background: #f1f5f9;
            color: #111827;
        }

        .loading {
            padding: 24px;

            border-radius: 20px;

            background: #ffffff;

            text-align: center;
        }

        .hidden {
            display: none !important;
        }

    </style>
</head>


<body>

<div class="page">

    <div
        id="loading"
        class="loading"
    >
        Loading couple profile...
    </div>


    <div
        id="profile"
        class="profile hidden"
    >

        <div class="hero">

            <div class="heart">
                ❤️
            </div>


            <div
                id="avatar"
                class="avatar"
            ></div>


            <h1
                id="coupleName"
            >
                Couple
            </h1>


            <div
                id="people"
                class="people"
            ></div>


            <div
                id="date"
                class="date"
            ></div>


            <p
                id="bio"
                class="bio"
            ></p>


            <p
                id="story"
                class="story"
            ></p>

        </div>


        <div class="section">

            <h2 class="title">
                Contact
            </h2>


            <div
                id="contacts"
                class="grid"
            ></div>

        </div>


        <div
            id="socialSection"
            class="section hidden"
        >

            <h2 class="title">
                Social
            </h2>


            <div
                id="socials"
                class="grid"
            ></div>

        </div>


        <div class="section">

            <a
                id="edit"
                class="button edit"
            >
                Edit My Profile
            </a>

        </div>

    </div>

</div>


<script type="module">

    import {
        createClient
    } from
        "https://esm.sh/@supabase/supabase-js@2";


    const SUPABASE_URL =
        "https://zuptxhcjzhqynrquyray.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_1sa0MtE83MZXETR5JLakJA_fRVrjDJI";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const profile =
        document.getElementById(
            "profile"
        );


    const avatar =
        document.getElementById(
            "avatar"
        );


    const coupleName =
        document.getElementById(
            "coupleName"
        );


    const people =
        document.getElementById(
            "people"
        );


    const date =
        document.getElementById(
            "date"
        );


    const bio =
        document.getElementById(
            "bio"
        );


    const story =
        document.getElementById(
            "story"
        );


    const contacts =
        document.getElementById(
            "contacts"
        );


    const socials =
        document.getElementById(
            "socials"
        );


    const socialSection =
        document.getElementById(
            "socialSection"
        );


    const edit =
        document.getElementById(
            "edit"
        );


    function tag() {

        return new URL(
            location.href
        )
            .searchParams
            .get(
                "tag"
            );
    }


    function clean(
        value
    ) {

        return String(
            value || ""
        ).trim();
    }


    function user(
        value
    ) {

        return clean(
            value
        )
            .replace(
                /^@/,
                ""
            );
    }


    function add(
        parent,
        label,
        url,
        social = false
    ) {

        const a =
            document.createElement(
                "a"
            );


        a.className =
            social
                ? "button social"
                : "button";


        a.textContent =
            label;


        a.href =
            url;


        if (
            url.startsWith(
                "http"
            )
        ) {

            a.target =
                "_blank";

            a.rel =
                "noopener";
        }


        parent.appendChild(
            a
        );


        if (
            social
        ) {

            socialSection.classList.remove(
                "hidden"
            );
        }
    }


    function dateLabel(
        value
    ) {

        if (
            !value
        ) {

            return "";
        }


        const d =
            new Date(
                `${value}T00:00:00`
            );


        if (
            Number.isNaN(
                d.getTime()
            )
        ) {

            return value;
        }


        return d.toLocaleDateString(
            undefined,
            {
                day:
                    "numeric",
                month:
                    "long",
                year:
                    "numeric"
            }
        );
    }


    async function load() {

        const code =
            tag();


        if (
            !code
        ) {

            loading.textContent =
                "Invalid E-Tag URL.";

            return;
        }


        const {
            data: t
        } =
            await supabase
                .from(
                    "nfc_tags"
                )
                .select(
                    "owner_id,active,tag_code"
                )
                .eq(
                    "tag_code",
                    code
                )
                .maybeSingle();


        if (
            !t ||
            !t.active ||
            !t.owner_id
        ) {

            loading.textContent =
                "E-Tag not found or not activated.";

            return;
        }


        const {
            data: p
        } =
            await supabase
                .from(
                    "profiles"
                )
                .select(
                    "*"
                )
                .eq(
                    "id",
                    t.owner_id
                )
                .maybeSingle();


        if (
            !p
        ) {

            loading.textContent =
                "Public profile not found.";

            return;
        }


        coupleName.textContent =
            clean(
                p.couple_name
            ) ||
            clean(
                p.display_name
            ) ||
            "Our Story";


        const person1 =
            clean(
                p.person1_name
            );


        const person2 =
            clean(
                p.person2_name
            );


        if (
            person1 ||
            person2
        ) {

            people.textContent =
                [person1, person2]
                    .filter(Boolean)
                    .join(
                        " ❤️ "
                    );
        }


        date.textContent =
            p.anniversary_date
                ? `Together since ${dateLabel(
                    p.anniversary_date
                )}`
                : "";


        bio.textContent =
            clean(
                p.bio
            );


        story.textContent =
            clean(
                p.our_story
            );


        if (
            p.avatar_url
        ) {

            avatar.innerHTML =
                `
                    <img
                        src="${p.avatar_url}"
                        alt="Couple"
                    >
                `;

        } else {

            avatar.textContent =
                "❤️";
        }


        if (
            p.whatsapp
        ) {

            const number =
                clean(
                    p.whatsapp
                ).replace(
                    /\D/g,
                    ""
                );


            if (
                number
            ) {

                add(
                    contacts,
                    "WhatsApp",
                    `https://wa.me/${number}`
                );
            }
        }


        if (
            p.email
        ) {

            add(
                contacts,
                "Email",
                `mailto:${encodeURIComponent(
                    p.email
                )}`
            );
        }


        if (
            p.person1_instagram
        ) {

            add(
                socials,
                "Person 1 Instagram",
                `https://instagram.com/${user(
                    p.person1_instagram
                )}`,
                true
            );
        }


        if (
            p.person2_instagram
        ) {

            add(
                socials,
                "Person 2 Instagram",
                `https://instagram.com/${user(
                    p.person2_instagram
                )}`,
                true
            );
        }


        if (
            p.person1_tiktok
        ) {

            add(
                socials,
                "Person 1 TikTok",
                `https://www.tiktok.com/@${user(
                    p.person1_tiktok
                )}`,
                true
            );
        }


        if (
            p.person2_tiktok
        ) {

            add(
                socials,
                "Person 2 TikTok",
                `https://www.tiktok.com/@${user(
                    p.person2_tiktok
                )}`,
                true
            );
        }


        if (
            p.shared_youtube
        ) {

            add(
                socials,
                "Shared YouTube",
                `https://youtube.com/@${user(
                    p.shared_youtube
                )}`,
                true
            );
        }


        if (
            p.other_social_links
        ) {

            p.other_social_links
                .split("\n")
                .map(
                    x => x.trim()
                )
                .filter(
                    Boolean
                )
                .forEach(
                    (url, index) => {

                        const normalized =
                            /^https?:\/\//i.test(
                                url
                            )
                                ? url
                                : `https://${url}`;


                        add(
                            socials,
                            `Other Link ${index + 1}`,
                            normalized,
                            true
                        );
                    }
                );
        }


        edit.href =
            `/E-Tag/?tag=${encodeURIComponent(
                t.tag_code
            )}`;


        loading.classList.add(
            "hidden"
        );


        profile.classList.remove(
            "hidden"
        );
    }


    load();

</script>

</body>
</html>
