<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>E-Tag · Couple</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px 12px 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #ffe4e6 0%,
                    #fff7ed 45%,
                    #f5f7fb 45%
                );

            color: #7f1d1d;
        }

        .page {
            width: min(100%, 520px);
        }

        .profile {
            overflow: hidden;
            border-radius: 28px;
            background: #ffffff;
            box-shadow:
                0 20px 60px rgba(
                    127,
                    29,
                    29,
                    0.12
                );
        }

        .hero {
            padding: 34px 24px 30px;
            text-align: center;
            background:
                linear-gradient(
                    145deg,
                    #fff7ed,
                    #ffe4e6,
                    #fef2f2
                );
        }

        .heart {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .avatar {
            width: 128px;
            height: 128px;
            margin: 0 auto 18px;
            border-radius: 28px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;

            background: #fecdd3;
            border: 4px solid rgba(
                190,
                24,
                93,
                0.12
            );

            font-size: 34px;
            font-weight: 800;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            line-height: 1.2;
        }

        .type {
            display: inline-flex;
            margin-top: 12px;
            padding: 7px 11px;
            border-radius: 999px;
            background: #fecdd3;
            color: #9f1239;
            font-size: 11px;
            font-weight: 800;
        }

        .bio {
            margin: 14px auto 0;
            max-width: 420px;
            color: #991b1b;
            line-height: 1.65;
            white-space: pre-wrap;
        }

        .heart-row {
            margin-top: 14px;
            color: #be123c;
            letter-spacing: 4px;
        }

        .actions {
            padding: 22px;
            display: grid;
            gap: 10px;
            background: #ffffff;
        }

        .action {
            display: block;
            text-decoration: none;
            text-align: center;
            padding: 14px 15px;
            border-radius: 13px;
            background: #9f1239;
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
        }

        .edit {
            background: #ffe4e6;
            color: #9f1239;
        }

        .loading,
        .error {
            padding: 24px;
            border-radius: 20px;
            background: #ffffff;
            color: #7f1d1d;
            text-align: center;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="page">

    <div
        id="loading"
        class="loading"
    >
        Loading profile...
    </div>


    <div
        id="error"
        class="error hidden"
    ></div>


    <div
        id="profile"
        class="profile hidden"
    >

        <div class="hero">

            <div class="heart">
                ❤️
            </div>

            <div
                id="avatar"
                class="avatar"
            ></div>

            <h1
                id="name"
            >
                E-Tag Couple
            </h1>

            <div class="type">
                Couple
            </div>

            <p
                id="bio"
                class="bio"
            ></p>

            <div class="heart-row">
                ♥ ♥ ♥
            </div>

        </div>


        <div class="actions">

            <a
                id="phone"
                class="action hidden"
            >
                Contact
            </a>

            <a
                id="whatsapp"
                class="action hidden"
                target="_blank"
                rel="noopener"
            >
                WhatsApp
            </a>

            <a
                id="email"
                class="action hidden"
            >
                Email
            </a>

            <a
                id="edit"
                class="action edit"
            >
                Edit My Profile
            </a>

        </div>

    </div>

</div>


<script type="module">

    import {
        createClient
    } from
        "https://esm.sh/@supabase/supabase-js@2";


    const SUPABASE_URL =
        "https://zuptxhcjzhqynrquyray.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_1sa0MtE83MZXETR5JLakJA_fRVrjDJI";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    const loading =
        document.getElementById(
            "loading"
        );

    const errorBox =
        document.getElementById(
            "error"
        );

    const profile =
        document.getElementById(
            "profile"
        );

    const avatar =
        document.getElementById(
            "avatar"
        );

    const name =
        document.getElementById(
            "name"
        );

    const bio =
        document.getElementById(
            "bio"
        );

    const phone =
        document.getElementById(
            "phone"
        );

    const whatsapp =
        document.getElementById(
            "whatsapp"
        );

    const email =
        document.getElementById(
            "email"
        );

    const edit =
        document.getElementById(
            "edit"
        );


    function getTagCode() {

        return new URL(
            window.location.href
        )
            .searchParams
            .get("tag");
    }


    function initials(
        value
    ) {

        const parts =
            String(
                value || ""
            )
                .trim()
                .split(
                    /\s+/
                )
                .filter(
                    Boolean
                );


        if (
            parts.length ===
            0
        ) {

            return "?";
        }


        if (
            parts.length ===
            1
        ) {

            return parts[0]
                .substring(
                    0,
                    2
                )
                .toUpperCase();
        }


        return (
            parts[0][0] +
            parts[
                parts.length - 1
            ][0]
        ).toUpperCase();
    }


    function renderAvatar(
        element,
        displayName,
        avatarUrl
    ) {

        if (
            avatarUrl
        ) {

            element.innerHTML =
                `
                    <img
                        src="${avatarUrl}"
                        alt="Couple"
                    >
                `;

        } else {

            element.textContent =
                initials(
                    displayName
                );
        }
    }


    async function load() {

        const tagCode =
            getTagCode();


        if (
            !tagCode
        ) {

            loading.textContent =
                "Invalid E-Tag URL.";

            return;
        }


        const {
            data: tag
        } =
            await supabase
                .from(
                    "nfc_tags"
                )
                .select(
                    "owner_id,tag_code,active"
                )
                .eq(
                    "tag_code",
                    tagCode
                )
                .maybeSingle();


        if (
            !tag ||
            !tag.active ||
            !tag.owner_id
        ) {

            loading.textContent =
                "E-Tag not found or not activated.";

            return;
        }


        const {
            data: publicProfile
        } =
            await supabase
                .from(
                    "profiles"
                )
                .select(
                    "display_name,bio,phone,whatsapp,email,avatar_url"
                )
                .eq(
                    "id",
                    tag.owner_id
                )
                .maybeSingle();


        if (
            !publicProfile
        ) {

            loading.textContent =
                "Public profile not found.";

            return;
        }


        const displayName =
            publicProfile.display_name ||
            "E-Tag Couple";


        name.textContent =
            displayName;


        bio.textContent =
            publicProfile.bio ||
            "";


        renderAvatar(
            avatar,
            displayName,
            publicProfile.avatar_url
        );


        if (
            publicProfile.phone
        ) {

            phone.href =
                `tel:${encodeURIComponent(
                    publicProfile.phone
                )}`;

            phone.textContent =
                "Contact";

            phone.classList.remove(
                "hidden"
            );
        }


        if (
            publicProfile.whatsapp
        ) {

            const number =
                publicProfile.whatsapp.replace(
                    /\D/g,
                    ""
                );


            if (
                number
            ) {

                whatsapp.href =
                    `https://wa.me/${number}`;

                whatsapp.classList.remove(
                    "hidden"
                );
            }
        }


        if (
            publicProfile.email
        ) {

            email.href =
                `mailto:${encodeURIComponent(
                    publicProfile.email
                )}`;

            email.classList.remove(
                "hidden"
            );
        }


        edit.href =
            `/E-Tag/?tag=${encodeURIComponent(
                tag.tag_code
            )}`;


        loading.classList.add(
            "hidden"
        );

        profile.classList.remove(
            "hidden"
        );
    }


    load();

</script>

</body>
</html>
