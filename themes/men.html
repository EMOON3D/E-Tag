<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>E-Tag · Men</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            padding:
                24px 12px 40px;

            font-family:
                Inter,
                system-ui,
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #111827 0%,
                    #1f2937 45%,
                    #f5f7fb 45%
                );

            color: #ffffff;
        }

        .page {
            width:
                min(100%, 560px);

            margin: 0 auto;
        }

        .profile {
            overflow: hidden;

            border-radius: 28px;

            background: #ffffff;

            color: #111827;

            box-shadow:
                0 20px 60px
                rgba(
                    0,
                    0,
                    0,
                    .18
                );
        }

        .hero {
            padding:
                34px 24px 28px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    #111827,
                    #1f2937,
                    #374151
                );

            color: #ffffff;
        }

        .avatar {
            width: 120px;
            height: 120px;

            margin:
                0 auto 18px;

            border-radius: 50%;

            overflow: hidden;

            background: #374151;

            display: flex;
            align-items: center;
            justify-content: center;

            border:
                4px solid
                rgba(
                    255,
                    255,
                    255,
                    .16
                );

            font-size: 35px;
            font-weight: 800;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            margin: 0;

            font-size: 30px;
            line-height: 1.2;
        }

        .age {
            margin-top: 8px;

            color: #9ca3af;

            font-size: 14px;
        }

        .bio {
            max-width: 440px;

            margin:
                14px auto 0;

            color: #d1d5db;

            line-height: 1.65;

            white-space: pre-wrap;
        }

        .section {
            padding:
                20px;
        }

        .section-title {
            margin:
                0 0 12px;

            font-size: 16px;
        }

        .actions {
            display: grid;
            gap: 10px;
        }

        .action {
            display: block;

            padding:
                13px 14px;

            border-radius: 12px;

            background: #111827;
            color: #ffffff;

            text-decoration: none;

            text-align: center;

            font-size: 14px;
            font-weight: 800;
        }

        .socials {
            display: grid;
            gap: 9px;
        }

        .social {
            display: block;

            padding:
                11px 13px;

            border-radius: 10px;

            background: #f3f4f6;

            color: #111827;

            text-decoration: none;

            text-align: center;

            font-size: 13px;
            font-weight: 700;
        }

        .edit {
            margin-top: 10px;

            background: #e5e7eb;

            color: #111827;
        }

        .loading,
        .error {
            padding: 24px;

            border-radius: 20px;

            background: #ffffff;

            color: #111827;

            text-align: center;
        }

        .hidden {
            display: none !important;
        }

    </style>
</head>


<body>

<div class="page">

    <div
        id="loading"
        class="loading"
    >
        Loading profile...
    </div>


    <div
        id="error"
        class="error hidden"
    ></div>


    <div
        id="profile"
        class="profile hidden"
    >

        <div class="hero">

            <div
                id="avatar"
                class="avatar"
            ></div>


            <h1
                id="name"
            >
                E-Tag User
            </h1>


            <div
                id="age"
                class="age"
            ></div>


            <p
                id="bio"
                class="bio"
            ></p>

        </div>


        <div
            id="contactSection"
            class="section"
        >

            <h2 class="section-title">
                Contact
            </h2>


            <div
                id="contacts"
                class="actions"
            ></div>

        </div>


        <div
            id="socialSection"
            class="section hidden"
        >

            <h2 class="section-title">
                Social
            </h2>


            <div
                id="socials"
                class="socials"
            ></div>

        </div>


        <div class="section">

            <a
                id="edit"
                class="action edit"
            >
                Edit My Profile
            </a>

        </div>

    </div>

</div>


<script type="module">

    import {
        createClient
    } from
        "https://esm.sh/@supabase/supabase-js@2";


    const SUPABASE_URL =
        "https://zuptxhcjzhqynrquyray.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_1sa0MtE83MZXETR5JLakJA_fRVrjDJI";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const errorBox =
        document.getElementById(
            "error"
        );


    const profile =
        document.getElementById(
            "profile"
        );


    const avatar =
        document.getElementById(
            "avatar"
        );


    const name =
        document.getElementById(
            "name"
        );


    const age =
        document.getElementById(
            "age"
        );


    const bio =
        document.getElementById(
            "bio"
        );


    const contacts =
        document.getElementById(
            "contacts"
        );


    const socials =
        document.getElementById(
            "socials"
        );


    const socialSection =
        document.getElementById(
            "socialSection"
        );


    const edit =
        document.getElementById(
            "edit"
        );


    function getTag() {

        return new URL(
            location.href
        )
            .searchParams
            .get(
                "tag"
            );
    }


    function text(
        value
    ) {

        return String(
            value ||
            ""
        )
            .trim();
    }


    function initial(
        value
    ) {

        const parts =
            text(
                value
            )
                .split(
                    /\s+/
                );


        if (
            parts.length ===
            1
        ) {

            return parts[0]
                .slice(0, 2)
                .toUpperCase();
        }


        return (
            parts[0]?.[0] ||
            "E"
        ) +
        (
            parts[1]?.[0] ||
            "T"
        );
    }


    function addLink(
        parent,
        label,
        url
    ) {

        const a =
            document.createElement(
                "a"
            );


        a.className =
            "action";


        a.textContent =
            label;


        a.href =
            url;


        if (
            url.startsWith(
                "http"
            )
        ) {

            a.target =
                "_blank";

            a.rel =
                "noopener";
        }


        parent.appendChild(
            a
        );
    }


    function addSocial(
        label,
        url
    ) {

        const a =
            document.createElement(
                "a"
            );


        a.className =
            "social";


        a.textContent =
            label;


        a.href =
            url;


        a.target =
            "_blank";

        a.rel =
            "noopener";


        socials.appendChild(
            a
        );


        socialSection.classList.remove(
            "hidden"
        );
    }


    function username(
        value
    ) {

        return text(
            value
        ).replace(
            /^@/,
            ""
        );
    }


    async function load() {

        const tagCode =
            getTag();


        if (
            !tagCode
        ) {

            loading.textContent =
                "Invalid E-Tag URL.";

            return;
        }


        const {
            data: tag
        } =
            await supabase
                .from(
                    "nfc_tags"
                )
                .select(
                    "owner_id,active,tag_code"
                )
                .eq(
                    "tag_code",
                    tagCode
                )
                .maybeSingle();


        if (
            !tag ||
            !tag.active ||
            !tag.owner_id
        ) {

            loading.textContent =
                "E-Tag not found or not activated.";

            return;
        }


        const {
            data: p
        } =
            await supabase
                .from(
                    "profiles"
                )
                .select(
                    "*"
                )
                .eq(
                    "id",
                    tag.owner_id
                )
                .maybeSingle();


        if (
            !p
        ) {

            loading.textContent =
                "Public profile not found.";

            return;
        }


        const displayName =
            text(
                p.display_name
            ) ||
            "E-Tag User";


        name.textContent =
            displayName;


        age.textContent =
            p.age
                ? `${p.age} years old`
                : "";


        bio.textContent =
            text(
                p.bio
            );


        if (
            p.avatar_url
        ) {

            avatar.innerHTML =
                `
                    <img
                        src="${p.avatar_url}"
                        alt="Profile photo"
                    >
                `;

        } else {

            avatar.textContent =
                initial(
                    displayName
                );
        }


        if (
            p.phone
        ) {

            addLink(
                contacts,
                "Call",
                `tel:${encodeURIComponent(
                    p.phone
                )}`
            );
        }


        if (
            p.whatsapp
        ) {

            const number =
                text(
                    p.whatsapp
                )
                    .replace(
                        /\D/g,
                        ""
                    );


            if (
                number
            ) {

                addLink(
                    contacts,
                    "WhatsApp",
                    `https://wa.me/${number}`
                );
            }
        }


        if (
            p.email
        ) {

            addLink(
                contacts,
                "Email",
                `mailto:${encodeURIComponent(
                    p.email
                )}`
            );
        }


        if (
            p.facebook
        ) {

            addSocial(
                "Facebook",
                `https://facebook.com/${username(
                    p.facebook
                )}`
            );
        }


        if (
            p.instagram
        ) {

            addSocial(
                "Instagram",
                `https://instagram.com/${username(
                    p.instagram
                )}`
            );
        }


        if (
            p.tiktok
        ) {

            addSocial(
                "TikTok",
                `https://www.tiktok.com/@${username(
                    p.tiktok
                )}`
            );
        }


        if (
            p.youtube
        ) {

            addSocial(
                "YouTube",
                `https://youtube.com/@${username(
                    p.youtube
                )}`
            );
        }


        if (
            p.telegram
        ) {

            addSocial(
                "Telegram",
                `https://t.me/${username(
                    p.telegram
                )}`
            );
        }


        if (
            p.discord
        ) {

            addSocial(
                "Discord",
                `https://discord.com/`
            );
        }


        edit.href =
            `/E-Tag/?tag=${encodeURIComponent(
                tag.tag_code
            )}`;


        loading.classList.add(
            "hidden"
        );


        profile.classList.remove(
            "hidden"
        );
    }


    load();

</script>

</body>
</html>
