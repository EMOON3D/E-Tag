<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>E-Tag · Men</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            padding:
                20px 12px 44px;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #f7f9fc 0%,
                    #eef2f7 48%,
                    #f8fafc 100%
                );

            color:
                #172033;

            -webkit-font-smoothing:
                antialiased;
        }

        a {
            -webkit-tap-highlight-color:
                transparent;
        }

        .page {
            width:
                min(
                    100%,
                    560px
                );

            margin:
                0 auto;
        }

        /* =====================================================
           PROFILE CARD
           ===================================================== */

        .profile {
            overflow:
                hidden;

            border-radius:
                30px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.97
                );

            border:
                1px solid #e4e9f0;

            box-shadow:
                0 22px 65px
                rgba(
                    34,
                    48,
                    70,
                    0.10
                );
        }

        /* =====================================================
           HERO
           ===================================================== */

        .hero {
            position:
                relative;

            overflow:
                hidden;

            padding:
                34px 24px 32px;

            text-align:
                center;

            background:
                linear-gradient(
                    145deg,
                    #ffffff 0%,
                    #f4f7fa 55%,
                    #e9eef4 100%
                );

            border-bottom:
                1px solid #e6ebf1;
        }

        .hero::before {
            content:
                "";

            position:
                absolute;

            width:
                230px;

            height:
                230px;

            top:
                -135px;

            left:
                -80px;

            border-radius:
                50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.8
                );

            filter:
                blur(2px);

            pointer-events:
                none;
        }

        .hero::after {
            content:
                "";

            position:
                absolute;

            width:
                260px;

            height:
                260px;

            right:
                -125px;

            bottom:
                -175px;

            border-radius:
                50%;

            background:
                rgba(
                    215,
                    223,
                    233,
                    0.55
                );

            pointer-events:
                none;
        }

        .avatar-wrap {
            position:
                relative;

            width:
                126px;

            height:
                126px;

            margin:
                0 auto 18px;

            z-index:
                1;
        }

        .avatar {
            width:
                126px;

            height:
                126px;

            border-radius:
                50%;

            overflow:
                hidden;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                linear-gradient(
                    145deg,
                    #e7ecf2,
                    #cfd7e2
                );

            border:
                5px solid #ffffff;

            box-shadow:
                0 12px 32px
                rgba(
                    45,
                    59,
                    80,
                    0.15
                );

            color:
                #354157;

            font-size:
                34px;

            font-weight:
                850;
        }

        .avatar img {
            width:
                100%;

            height:
                100%;

            object-fit:
                cover;
        }

        .avatar.character img {
            object-fit:
                contain;

            padding:
                8px;
        }

        .online-dot {
            position:
                absolute;

            right:
                6px;

            bottom:
                7px;

            width:
                18px;

            height:
                18px;

            border-radius:
                50%;

            background:
                #ffffff;

            border:
                4px solid #7c8797;

            z-index:
                2;
        }

        h1 {
            position:
                relative;

            z-index:
                1;

            margin:
                0;

            color:
                #172033;

            font-size:
                30px;

            line-height:
                1.2;

            letter-spacing:
                -0.04em;
        }

        .age {
            position:
                relative;

            z-index:
                1;

            margin-top:
                8px;

            color:
                #8a94a5;

            font-size:
                13px;

            font-weight:
                650;
        }

        .bio {
            position:
                relative;

            z-index:
                1;

            max-width:
                440px;

            margin:
                14px auto 0;

            color:
                #667186;

            line-height:
                1.7;

            font-size:
                14px;

            white-space:
                pre-wrap;
        }

        /* =====================================================
           SECTIONS
           ===================================================== */

        .section {
            padding:
                22px 20px 0;
        }

        .section:last-child {
            padding-bottom:
                20px;
        }

        .section-title-row {
            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            margin-bottom:
                13px;
        }

        .section-title {
            margin:
                0;

            color:
                #273249;

            font-size:
                15px;

            font-weight:
                850;

            letter-spacing:
                -0.01em;
        }

        .section-subtitle {
            color:
                #a0a8b6;

            font-size:
                11px;

            font-weight:
                700;
        }

        /* =====================================================
           CONTACT BUTTONS
           ===================================================== */

        .actions {
            display:
                grid;

            gap:
                10px;
        }

        .action {
            position:
                relative;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            min-height:
                49px;

            padding:
                13px 15px;

            border-radius:
                14px;

            background:
                #f4f6f9;

            border:
                1px solid #e5e9ef;

            color:
                #202b40;

            text-decoration:
                none;

            text-align:
                center;

            font-size:
                13px;

            font-weight:
                800;

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                box-shadow 0.18s ease,
                border-color 0.18s ease;
        }

        .action:hover {
            transform:
                translateY(-1px);

            background:
                #edf1f5;

            border-color:
                #dce2ea;

            box-shadow:
                0 7px 18px
                rgba(
                    42,
                    56,
                    77,
                    0.07
                );
        }

        .action:active {
            transform:
                translateY(0);
        }

        /* =====================================================
           SOCIAL LINKS
           ===================================================== */

        .socials {
            display:
                grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap:
                10px;
        }

        .social {
            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            min-height:
                45px;

            padding:
                11px 12px;

            border-radius:
                13px;

            background:
                #fafbfc;

            border:
                1px solid #e6eaf0;

            color:
                #344056;

            text-decoration:
                none;

            text-align:
                center;

            font-size:
                12px;

            font-weight:
                750;

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                border-color 0.18s ease;
        }

        .social:hover {
            transform:
                translateY(-1px);

            background:
                #f2f5f8;

            border-color:
                #dce2e9;
        }

        .social:active {
            transform:
                translateY(0);
        }

        /* =====================================================
           EDIT BUTTON
           ===================================================== */

        .edit-section {
            padding-top:
                18px;
        }

        .edit {
            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            min-height:
                48px;

            border-radius:
                14px;

            background:
                #202a3d;

            color:
                #ffffff;

            text-decoration:
                none;

            text-align:
                center;

            font-size:
                13px;

            font-weight:
                800;

            box-shadow:
                0 9px 22px
                rgba(
                    32,
                    42,
                    61,
                    0.14
                );

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                box-shadow 0.18s ease;
        }

        .edit:hover {
            background:
                #172033;

            transform:
                translateY(-1px);

            box-shadow:
                0 11px 25px
                rgba(
                    32,
                    42,
                    61,
                    0.19
                );
        }

        .edit:active {
            transform:
                translateY(0);
        }

        /* =====================================================
           LOADING / ERROR
           ===================================================== */

        .loading,
        .error {
            padding:
                30px 22px;

            border-radius:
                24px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.97
                );

            border:
                1px solid #e5e9ef;

            color:
                #59657a;

            text-align:
                center;

            box-shadow:
                0 18px 50px
                rgba(
                    35,
                    50,
                    72,
                    0.08
                );
        }

        .loading::before {
            content:
                "";

            display:
                block;

            width:
                30px;

            height:
                30px;

            margin:
                0 auto 14px;

            border:
                3px solid #e7ebf0;

            border-top-color:
                #647187;

            border-radius:
                50%;

            animation:
                spin 0.8s linear infinite;
        }

        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }

        }

        .error {
            color:
                #9b4040;
        }

        .hidden {
            display:
                none !important;
        }

        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 480px) {

            body {
                padding:
                    10px 8px 30px;
            }

            .profile {
                border-radius:
                    25px;
            }

            .hero {
                padding:
                    28px 18px 27px;
            }

            .avatar-wrap,
            .avatar {
                width:
                    112px;

                height:
                    112px;
            }

            .avatar-wrap {
                margin-bottom:
                    16px;
            }

            h1 {
                font-size:
                    27px;
            }

            .bio {
                font-size:
                    13px;

                line-height:
                    1.65;
            }

            .section {
                padding:
                    19px 15px 0;
            }

            .socials {
                grid-template-columns:
                    repeat(
                        2,
                        minmax(
                            0,
                            1fr
                        )
                    );
            }

        }

    </style>

</head>


<body>

<div class="page">

    <!-- =====================================================
         LOADING
         ===================================================== -->

    <div
        id="loading"
        class="loading"
    >
        Loading profile...
    </div>


    <!-- =====================================================
         ERROR
         ===================================================== -->

    <div
        id="error"
        class="error hidden"
    ></div>


    <!-- =====================================================
         PROFILE
         ===================================================== -->

    <div
        id="profile"
        class="profile hidden"
    >

        <!-- HERO -->

        <div class="hero">

            <div class="avatar-wrap">

                <div
                    id="avatar"
                    class="avatar"
                ></div>

                <div class="online-dot"></div>

            </div>


            <h1
                id="name"
            >
                E-Tag User
            </h1>


            <div
                id="age"
                class="age"
            ></div>


            <p
                id="bio"
                class="bio"
            ></p>

        </div>


        <!-- CONTACT -->

        <div
            id="contactSection"
            class="section"
        >

            <div class="section-title-row">

                <h2 class="section-title">
                    Contact
                </h2>

                <span class="section-subtitle">
                    Get in touch
                </span>

            </div>


            <div
                id="contacts"
                class="actions"
            ></div>

        </div>


        <!-- SOCIAL -->

        <div
            id="socialSection"
            class="section hidden"
        >

            <div class="section-title-row">

                <h2 class="section-title">
                    Social
                </h2>

                <span class="section-subtitle">
                    Connect
                </span>

            </div>


            <div
                id="socials"
                class="socials"
            ></div>

        </div>


        <!-- EDIT -->

        <div
            class="section edit-section"
        >

            <a
                id="edit"
                class="edit"
                href="#"
            >
                Edit My Profile
            </a>

        </div>

    </div>

</div>


<script type="module">

    import {
        createClient
    } from
        "https://esm.sh/@supabase/supabase-js@2";


    const SUPABASE_URL =
        "https://zuptxhcjzhqynrquyray.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_1sa0MtE83MZXETR5JLakJA_fRVrjDJI";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const errorBox =
        document.getElementById(
            "error"
        );


    const profile =
        document.getElementById(
            "profile"
        );


    const avatar =
        document.getElementById(
            "avatar"
        );


    const name =
        document.getElementById(
            "name"
        );


    const age =
        document.getElementById(
            "age"
        );


    const bio =
        document.getElementById(
            "bio"
        );


    const contacts =
        document.getElementById(
            "contacts"
        );


    const socials =
        document.getElementById(
            "socials"
        );


    const socialSection =
        document.getElementById(
            "socialSection"
        );


    const edit =
        document.getElementById(
            "edit"
        );


    const CHARACTER_BASE =
        "/E-Tag/assets/characters/men/";


    function getTagCode() {

        return new URL(
            window.location.href
        )
            .searchParams
            .get("tag");

    }


    function clean(
        value
    ) {

        return String(
            value || ""
        ).trim();

    }


    function initials(
        value
    ) {

        const parts =
            clean(
                value
            )
                .split(
                    /\s+/
                )
                .filter(
                    Boolean
                );


        if (
            parts.length === 0
        ) {

            return "?";

        }


        if (
            parts.length === 1
        ) {

            return parts[0]
                .substring(
                    0,
                    2
                )
                .toUpperCase();

        }


        return (
            parts[0][0] +
            parts[
                parts.length - 1
            ][0]
        ).toUpperCase();

    }


    function renderAvatar(
        element,
        profile
    ) {

        element.innerHTML =
            "";

        element.classList.remove(
            "character"
        );


        const displayName =
            clean(
                profile.display_name
            ) ||
            "E-Tag User";


        if (
            profile.avatar_type ===
                "character" &&
            profile.character_id
        ) {

            const image =
                document.createElement(
                    "img"
                );


            image.src =
                `${CHARACTER_BASE}${encodeURIComponent(
                    profile.character_id
                )}.svg`;


            image.alt =
                "Character";


            image.onerror =
                () => {

                    element.innerHTML =
                        "";

                    element.classList.remove(
                        "character"
                    );

                    element.textContent =
                        initials(
                            displayName
                        );

                };


            element.classList.add(
                "character"
            );


            element.appendChild(
                image
            );


            return;

        }


        if (
            profile.avatar_url
        ) {

            const image =
                document.createElement(
                    "img"
                );


            image.src =
                profile.avatar_url;


            image.alt =
                "Profile photo";


            image.onerror =
                () => {

                    element.innerHTML =
                        "";

                    element.textContent =
                        initials(
                            displayName
                        );

                };


            element.appendChild(
                image
            );


            return;

        }


        element.textContent =
            initials(
                displayName
            );

    }


    function addContact(
        label,
        href
    ) {

        const link =
            document.createElement(
                "a"
            );


        link.className =
            "action";


        link.textContent =
            label;


        link.href =
            href;


        if (
            href.startsWith(
                "http"
            )
        ) {

            link.target =
                "_blank";

            link.rel =
                "noopener";

        }


        contacts.appendChild(
            link
        );

    }


    function addSocial(
        label,
        href
    ) {

        const link =
            document.createElement(
                "a"
            );


        link.className =
            "social";


        link.textContent =
            label;


        link.href =
            href;


        link.target =
            "_blank";

        link.rel =
            "noopener";


        socials.appendChild(
            link
        );


        socialSection.classList.remove(
            "hidden"
        );

    }


    function username(
        value
    ) {

        return clean(
            value
        ).replace(
            /^@/,
            ""
        );

    }


    async function load() {

        const tagCode =
            getTagCode();


        if (
            !tagCode
        ) {

            loading.textContent =
                "Invalid E-Tag URL.";

            return;

        }


        const {
            data: tag,
            error: tagError
        } =
            await supabase
                .from(
                    "nfc_tags"
                )
                .select(
                    "owner_id,active,tag_code"
                )
                .eq(
                    "tag_code",
                    tagCode
                )
                .maybeSingle();


        if (
            tagError
        ) {

            loading.classList.add(
                "hidden"
            );


            errorBox.textContent =
                `Unable to load this E-Tag: ${
                    tagError.message
                }`;


            errorBox.classList.remove(
                "hidden"
            );


            return;

        }


        if (
            !tag
        ) {

            loading.textContent =
                "E-Tag not found.";

            return;

        }


        if (
            !tag.active ||
            !tag.owner_id
        ) {

            loading.textContent =
                "This E-Tag has not been activated.";

            return;

        }


        const {
            data: p,
            error: profileError
        } =
            await supabase
                .from(
                    "profiles"
                )
                .select(
                    "*"
                )
                .eq(
                    "id",
                    tag.owner_id
                )
                .maybeSingle();


        if (
            profileError
        ) {

            loading.classList.add(
                "hidden"
            );


            errorBox.textContent =
                `Unable to load profile: ${
                    profileError.message
                }`;


            errorBox.classList.remove(
                "hidden"
            );


            return;

        }


        if (
            !p
        ) {

            loading.textContent =
                "Public profile not found.";

            return;

        }


        const displayName =
            clean(
                p.display_name
            ) ||
            "E-Tag User";


        name.textContent =
            displayName;


        age.textContent =
            p.age
                ? `${p.age} years old`
                : "";


        bio.textContent =
            clean(
                p.bio
            );


        renderAvatar(
            avatar,
            p
        );


        if (
            p.phone
        ) {

            addContact(
                "Call",
                `tel:${encodeURIComponent(
                    p.phone
                )}`
            );

        }


        if (
            p.whatsapp
        ) {

            const number =
                clean(
                    p.whatsapp
                )
                    .replace(
                        /\D/g,
                        ""
                    );


            if (
                number
            ) {

                addContact(
                    "WhatsApp",
                    `https://wa.me/${number}`
                );

            }

        }


        if (
            p.email
        ) {

            addContact(
                "Email",
                `mailto:${encodeURIComponent(
                    p.email
                )}`
            );

        }


        if (
            p.facebook
        ) {

            addSocial(
                "Facebook",
                `https://facebook.com/${username(
                    p.facebook
                )}`
            );

        }


        if (
            p.instagram
        ) {

            addSocial(
                "Instagram",
                `https://instagram.com/${username(
                    p.instagram
                )}`
            );

        }


        if (
            p.tiktok
        ) {

            addSocial(
                "TikTok",
                `https://www.tiktok.com/@${username(
                    p.tiktok
                )}`
            );

        }


        if (
            p.youtube
        ) {

            addSocial(
                "YouTube",
                `https://youtube.com/@${username(
                    p.youtube
                )}`
            );

        }


        if (
            p.telegram
        ) {

            addSocial(
                "Telegram",
                `https://t.me/${username(
                    p.telegram
                )}`
            );

        }


        if (
            p.discord
        ) {

            addSocial(
                "Discord",
                "https://discord.com/"
            );

        }


        /*
         * IMPORTANT
         *
         * Keep edit routing exactly as before.
         */

        edit.href =
            `/E-Tag/?tag=${encodeURIComponent(
                tag.tag_code
            )}&edit=1`;


        loading.classList.add(
            "hidden"
        );


        profile.classList.remove(
            "hidden"
        );

    }


    load();

</script>

</body>

</html>
