<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>E-Tag · Men</title>

    <style>

        * { box-sizing: border-box; }

        :root {
            --main: #d3dbc8;
            --main-light: #e5eadf;
            --main-soft: rgba(211,219,200,.72);
            --main-glass: rgba(211,219,200,.30);
            --main-border: rgba(255,255,255,.48);
            --text: #253027;
            --text-soft: rgba(37,48,39,.68);
            --text-muted: rgba(37,48,39,.50);
            --white: #ffffff;
            --shadow: 0 20px 55px rgba(43,57,45,.14);
        }

        html, body { width:100%; height:100%; margin:0; overflow:hidden; }

        body {
            min-height:100dvh;
            font-family: Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
            color:var(--text);
            background:
                radial-gradient(ellipse at 70% 18%,rgba(255,255,255,.92) 0%,rgba(255,255,255,.45) 27%,transparent 57%),
                radial-gradient(ellipse at 15% 75%,rgba(194,207,184,.60) 0%,rgba(211,219,200,.38) 35%,transparent 70%),
                linear-gradient(135deg,#c3cdb8 0%,#d3dbc8 38%,#e1e7da 68%,#cbd5c2 100%);
            -webkit-font-smoothing:antialiased;
            text-rendering:optimizeLegibility;
            overscroll-behavior:none;
        }

        body::before { content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 72% 24%,rgba(255,255,255,.40),transparent 32%),radial-gradient(ellipse at 20% 15%,rgba(255,255,255,.26),transparent 22%);z-index:0; }
        body::after { content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.08),transparent 40%);z-index:0; }
        a { color:inherit;text-decoration:none; }
        button { font:inherit; }

        .app { position:relative;z-index:1;width:100%;height:100dvh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left)); }
        .profile { position:relative;width:min(100%,560px);height:min(100%,900px);max-height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:rgba(255,255,255,.08);border-radius:30px;box-shadow:var(--shadow); }

        .hero { position:relative;flex:0 0 auto;padding:clamp(20px,3.4vh,34px) 24px clamp(14px,2.5vh,23px);text-align:center; }
        .hero::after { content:"";position:absolute;width:230px;height:150px;top:-90px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.38);filter:blur(38px);border-radius:50%;pointer-events:none; }
        .avatar { position:relative;z-index:1;width:clamp(70px,10.5vh,104px);height:clamp(70px,10.5vh,104px);margin:0 auto clamp(8px,1.5vh,14px);display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:50%;background:linear-gradient(145deg,#eef2e9,#c2cdb8);border:3px solid rgba(255,255,255,.70);box-shadow:0 12px 30px rgba(60,74,62,.16);font-size:clamp(24px,3.8vh,34px);font-weight:800;letter-spacing:-1px;color:var(--text); }
        .avatar img { width:100%;height:100%;display:block;object-fit:cover; }
        .avatar.character img { object-fit:contain;padding:7px; }
        h1 { position:relative;z-index:1;margin:0;font-size:clamp(23px,3.3vh,30px);line-height:1.12;letter-spacing:-.7px;color:var(--text); }
        .age { position:relative;z-index:1;margin-top:5px;color:var(--text-soft);font-size:12px; }
        .bio { position:relative;z-index:1;max-width:430px;margin:clamp(7px,1.3vh,12px) auto 0;color:var(--text-soft);font-size:clamp(11px,1.65vh,14px);line-height:1.42;white-space:pre-line; }

        .content { flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden; }
        .section { padding:clamp(12px,2.1vh,22px) 20px 0; }
        .section-header { margin-bottom:clamp(7px,1.25vh,12px); }
        .section-title { margin:0;color:var(--text);font-size:clamp(17px,2.6vh,21px);line-height:1.15;letter-spacing:-.35px; }
        .section-subtitle { margin:3px 0 0;color:var(--text-muted);font-size:11px; }

        .contacts { display:flex;flex-direction:column;gap:clamp(5px,.8vh,8px); }
        .contact-item { width:100%;min-height:clamp(45px,6.3vh,60px);display:flex;align-items:center;justify-content:center;padding:7px 14px;border:1px solid var(--main-border);border-radius:16px;background:linear-gradient(100deg,rgba(255,255,255,.48),rgba(211,219,200,.68));box-shadow:0 7px 18px rgba(54,67,56,.10);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .2s ease,box-shadow .2s ease,background .2s ease; }
        .contact-item:hover { background:linear-gradient(100deg,rgba(255,255,255,.62),rgba(211,219,200,.82));box-shadow:0 10px 22px rgba(54,67,56,.14); }
        .contact-item:active { transform:scale(.985); }
        .contact-inner { width:100%;display:flex;align-items:center;justify-content:center;gap:11px;text-align:center; }
        .contact-icon { width:36px;height:36px;flex:0 0 36px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(255,255,255,.46);border:1px solid rgba(255,255,255,.48);overflow:hidden; }
        .contact-icon img { width:21px;height:21px;object-fit:contain;display:block; }
        .contact-info { min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center; }
        .contact-label { margin-bottom:2px;color:var(--text-muted);font-size:9px;line-height:1.15; }
        .contact-value { overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-size:12px;font-weight:700; }

        .social-section { flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding-top:clamp(10px,1.8vh,18px); }
        .social-section .section-header { flex:0 0 auto; }
        .social-window { position:relative;width:calc(100% + 40px);margin-left:-20px;flex:0 0 auto;overflow:hidden;padding:10px 0;touch-action:pan-y;user-select:none;-webkit-user-select:none;overscroll-behavior:contain; }
        .social-track { display:flex;align-items:center;justify-content:center;gap:16px;width:max-content;padding:8px 0;will-change:transform;cursor:grab;transform:translate3d(0,0,0);backface-visibility:hidden;-webkit-backface-visibility:hidden; }
        .social-track.dragging { cursor:grabbing; }
        .social-item { position:relative;width:66px;height:66px;flex:0 0 66px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.58);padding:0;border-radius:50%;background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(211,219,200,.82));box-shadow:0 8px 20px rgba(55,69,57,.13);cursor:pointer;-webkit-tap-highlight-color:transparent; }
        .social-item img { width:30px;height:30px;object-fit:contain;display:block;pointer-events:none; }
        .social-name { position:absolute;left:50%;bottom:-19px;transform:translateX(-50%);font-size:9px;color:var(--text-muted);white-space:nowrap; }

        .bottom { flex:0 0 auto;padding:10px 20px max(12px,env(safe-area-inset-bottom)); }
        .edit-button { width:100%;display:flex;align-items:center;justify-content:center;min-height:45px;border:1px solid rgba(255,255,255,.60);border-radius:15px;background:rgba(255,255,255,.46);color:var(--text);font-size:12px;font-weight:800;cursor:pointer; }
        .loading,.error { position:relative;z-index:2;width:min(100%,560px);padding:30px;text-align:center;border-radius:22px;background:rgba(255,255,255,.55);color:var(--text);box-shadow:var(--shadow); }
        .hidden { display:none !important; }

        @media(max-height:700px){ .hero{padding-top:14px;padding-bottom:10px}.section{padding-top:9px}.social-item{width:56px;height:56px;flex-basis:56px}.bottom{padding-top:6px}.profile{border-radius:24px;} }
        @media(max-width:480px){ .profile{width:100%;height:100%;border-radius:0}.app{padding:0}.hero{padding-left:18px;padding-right:18px}.section{padding-left:16px;padding-right:16px}.social-window{width:calc(100% + 32px);margin-left:-16px}.bottom{padding-left:16px;padding-right:16px;} }

    </style>

</head>

<body>

<div class="app">

    <div id="loading" class="loading">Loading profile...</div>
    <div id="errorBox" class="error hidden"></div>

    <main id="profile" class="profile hidden">

        <section class="hero">
            <div id="avatar" class="avatar">?</div>
            <h1 id="name">E-Tag User</h1>
            <div id="age" class="age"></div>
            <div id="bio" class="bio"></div>
        </section>

        <div class="content">

            <section id="contactSection" class="section">
                <div class="section-header">
                    <h2 class="section-title">Contact</h2>
                    <p class="section-subtitle">Get in touch with me</p>
                </div>
                <div id="contacts" class="contacts"></div>
            </section>

            <section class="section social-section">
                <div class="section-header">
                    <h2 class="section-title">Social</h2>
                    <p class="section-subtitle">Connect with me</p>
                </div>
                <div id="socialWindow" class="social-window">
                    <div id="socialTrack" class="social-track"></div>
                </div>
            </section>

        </div>

        <div class="bottom">
            <a id="editButton" class="edit-button" href="#">Edit Profile</a>
        </div>

    </main>

</div>

<script type="module">

    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL="https://zuptxhcjzhqynrquyray.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY="sb_publishable_1sa0MtE83MZXETR5JLakJA_fRVrjDJI";
    const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

    const loading=document.getElementById("loading");
    const errorBox=document.getElementById("errorBox");
    const profile=document.getElementById("profile");
    const avatar=document.getElementById("avatar");
    const nameElement=document.getElementById("name");
    const ageElement=document.getElementById("age");
    const bioElement=document.getElementById("bio");
    const contactSection=document.getElementById("contactSection");
    const contacts=document.getElementById("contacts");
    const socialTrack=document.getElementById("socialTrack");
    const socialWindow=document.getElementById("socialWindow");
    const editButton=document.getElementById("editButton");

    const ICONS={
        phone:"/E-Tag/assets/icons/phone.svg",
        whatsapp:"/E-Tag/assets/icons/whatsapp.svg",
        email:"/E-Tag/assets/icons/email.svg",
        facebook:"/E-Tag/assets/icons/facebook.svg",
        instagram:"/E-Tag/assets/icons/instagram.svg",
        tiktok:"/E-Tag/assets/icons/tiktok.svg",
        youtube:"/E-Tag/assets/icons/youtube.svg",
        telegram:"/E-Tag/assets/icons/telegram.svg",
        discord:"/E-Tag/assets/icons/discord.svg",
        linkedin:"/E-Tag/assets/icons/linkedin.svg",
        location:"/E-Tag/assets/icons/location.svg"
    };

    const CHARACTER_LIBRARY={
        men:[
            {id:"men-01",src:"/E-Tag/assets/characters/men/men-01.svg"},
            {id:"men-02",src:"/E-Tag/assets/characters/men/men-02.svg"},
            {id:"men-03",src:"/E-Tag/assets/characters/men/men-03.svg"}
        ]
    };

    let previewMode=false;
    let socialItems=[];
    let currentSocialIndex=0;

    function clean(value){return String(value??"").trim();}
    function initials(value){const parts=clean(value).split(/\s+/).filter(Boolean);if(!parts.length)return"?";if(parts.length===1)return parts[0].slice(0,2).toUpperCase();return(parts[0][0]+parts[parts.length-1][0]).toUpperCase();}
    function username(value){const text=clean(value).replace(/\/+$/g,"");try{const url=new URL(text);const parts=url.pathname.split("/").filter(Boolean);return parts[parts.length-1]||url.hostname.replace(/^www\./,"");}catch{return text.replace(/^https?:\/\//i,"").replace(/^www\./i,"").split("/").filter(Boolean).pop()||text;}}

    function setAvatar(profileData){
        avatar.innerHTML="";avatar.classList.remove("character");
        if(profileData.avatar_type==="character"&&profileData.character_id){
            const character=CHARACTER_LIBRARY.men.find(item=>item.id===profileData.character_id);
            if(character){const img=document.createElement("img");img.src=character.src;img.alt="Profile";img.onerror=()=>{avatar.textContent=initials(profileData.display_name);};avatar.classList.add("character");avatar.appendChild(img);return;}
        }
        if(profileData.avatar_url){const img=document.createElement("img");img.src=profileData.avatar_url;img.alt="Profile";img.onerror=()=>{avatar.innerHTML="";avatar.textContent=initials(profileData.display_name);};avatar.appendChild(img);return;}
        avatar.textContent=initials(profileData.display_name);
    }

    function addContact(label,value,href,icon){
        const a=document.createElement("a");a.className="contact-item";a.href=href||"#";
        if(href){a.target="_blank";a.rel="noopener noreferrer";}
        a.innerHTML=`<div class="contact-inner"><div class="contact-icon"><img src="${icon}" alt=""></div><div class="contact-info"><div class="contact-label">${label}</div><div class="contact-value"></div></div></div>`;
        a.querySelector(".contact-value").textContent=value;
        contacts.appendChild(a);
    }

    function addSocial(label,value,href,icon){socialItems.push({label,value,href,icon});}

    function buildSocialCarousel(){
        socialTrack.innerHTML="";
        if(!socialItems.length){socialWindow.classList.add("hidden");return;}
        socialWindow.classList.remove("hidden");
        socialItems.forEach(item=>{
            const a=document.createElement("a");a.className="social-item";a.href=item.href||"#";a.target="_blank";a.rel="noopener noreferrer";a.title=item.label;
            const img=document.createElement("img");img.src=item.icon;img.alt=item.label;a.appendChild(img);
            const label=document.createElement("span");label.className="social-name";label.textContent=item.label;a.appendChild(label);
            socialTrack.appendChild(a);
        });
        currentSocialIndex=0;
        updateSocialPosition();
    }

    function updateSocialPosition(){
        if(!socialItems.length)return;
        const itemWidth=82;
        const visible=Math.max(1,Math.floor(socialWindow.clientWidth/itemWidth));
        const maxStart=Math.max(0,socialItems.length-visible);
        currentSocialIndex=Math.min(currentSocialIndex,maxStart);
        const offset=-(currentSocialIndex*itemWidth);
        socialTrack.style.transform=`translate3d(${offset}px,0,0)`;
    }

    let pointerStartX=0;
    let pointerStartOffset=0;
    let dragging=false;

    socialWindow.addEventListener("pointerdown",event=>{if(!socialItems.length)return;dragging=true;pointerStartX=event.clientX;pointerStartOffset=currentSocialIndex*82;socialTrack.classList.add("dragging");socialWindow.setPointerCapture?.(event.pointerId);});
    socialWindow.addEventListener("pointermove",event=>{if(!dragging)return;const delta=event.clientX-pointerStartX;const raw=pointerStartOffset-delta;currentSocialIndex=Math.round(raw/82);updateSocialPosition();});
    socialWindow.addEventListener("pointerup",()=>{dragging=false;socialTrack.classList.remove("dragging");});
    socialWindow.addEventListener("pointercancel",()=>{dragging=false;socialTrack.classList.remove("dragging");});
    window.addEventListener("resize",updateSocialPosition);

    function render(profileData,tag){
        profileData=profileData||{};
        const displayName=clean(profileData.display_name)||"E-Tag User";
        nameElement.textContent=displayName;
        ageElement.textContent=profileData.age?`${profileData.age} years old`:"";
        bioElement.textContent=clean(profileData.bio);
        setAvatar(profileData);

        contacts.innerHTML="";
        if(profileData.phone)addContact("Phone",profileData.phone,`tel:${encodeURIComponent(profileData.phone)}`,ICONS.phone);
        if(profileData.whatsapp){const number=clean(profileData.whatsapp).replace(/\D/g,"");if(number)addContact("WhatsApp",profileData.whatsapp,`https://wa.me/${number}`,ICONS.whatsapp);}
        if(profileData.email)addContact("Email",profileData.email,`mailto:${profileData.email}`,ICONS.email);
        if(profileData.business_location)addContact("Location",profileData.business_location,profileData.google_maps||"#",ICONS.location);
        contactSection.classList.toggle("hidden",contacts.children.length===0);

        socialItems=[];
        if(profileData.facebook){const value=clean(profileData.facebook);addSocial("Facebook",`@${username(value)}`,value,ICONS.facebook);}
        if(profileData.instagram){const value=clean(profileData.instagram);addSocial("Instagram",`@${username(value)}`,value,ICONS.instagram);}
        if(profileData.tiktok){const value=clean(profileData.tiktok);addSocial("TikTok",`@${username(value)}`,value,ICONS.tiktok);}
        if(profileData.youtube){const value=clean(profileData.youtube);addSocial("YouTube",`@${username(value)}`,value,ICONS.youtube);}
        if(profileData.telegram){const value=clean(profileData.telegram);addSocial("Telegram",`@${username(value)}`,value,ICONS.telegram);}
        if(profileData.discord){const value=clean(profileData.discord);addSocial("Discord",`@${username(value)}`,value,ICONS.discord);}
        if(profileData.linkedin){const value=clean(profileData.linkedin);addSocial("LinkedIn",`@${username(value)}`,value,ICONS.linkedin);}
        buildSocialCarousel();

        if(tag?.tag_code&&!previewMode)editButton.href=`/E-Tag/?tag=${encodeURIComponent(tag.tag_code)}&edit=1`;
        else editButton.href="#";
        editButton.classList.toggle("hidden",previewMode);

        loading.classList.add("hidden");errorBox.classList.add("hidden");profile.classList.remove("hidden");
    }

    function showError(error){console.error("Men theme load error:",error);loading.classList.add("hidden");profile.classList.add("hidden");errorBox.textContent=error?.message||"Unable to load profile.";errorBox.classList.remove("hidden");}

    function getPreviewDataFromUrl(){
        const params=new URLSearchParams(window.location.search);
        return params.get("preview")==="1";
    }

    window.addEventListener("message",event=>{
        if(event.origin!==window.location.origin)return;
        if(event.data?.type!=="ETAG_PROFILE_PREVIEW")return;
        previewMode=true;
        render(event.data.profile||{},null);
    });

    async function load(){
        try{
            previewMode=getPreviewDataFromUrl();
            if(previewMode){
                loading.textContent="Loading Men preview...";
                setTimeout(()=>{if(profile.classList.contains("hidden")&&!previewMode)showError(new Error("Preview data was not received."));},5000);
                return;
            }

            const params=new URLSearchParams(window.location.search);
            const tagCode=params.get("tag");
            if(!tagCode)throw new Error("Missing E-Tag code.");

            const{data:tag,error:tagError}=await supabase.from("nfc_tags").select("id,tag_code,owner_id,active").eq("tag_code",tagCode).eq("active",true).maybeSingle();
            if(tagError)throw new Error(tagError.message);
            if(!tag)throw new Error("E-Tag not found or inactive.");

            const{data:profileData,error:profileError}=await supabase.from("profiles").select("*").eq("id",tag.owner_id).maybeSingle();
            if(profileError)throw new Error(profileError.message);
            if(!profileData)throw new Error("Public profile not found.");

            render(profileData,tag);
        }catch(error){showError(error);}
    }

    load();

</script>

</body>
</html>
