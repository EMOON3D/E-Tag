<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>E-Tag · Men</title>

    <style>

        * {
            box-sizing: border-box;
        }


        :root {

            --main: #d3dbc8;

            --main-light: #e5eadf;

            --main-soft: rgba(211, 219, 200, .72);

            --main-glass: rgba(211, 219, 200, .30);

            --main-border: rgba(255, 255, 255, .48);

            --text: #253027;

            --text-soft: rgba(37, 48, 39, .68);

            --text-muted: rgba(37, 48, 39, .50);

            --white: #ffffff;

            --shadow:
                0 20px 55px
                rgba(43, 57, 45, .14);
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;

            overflow: hidden;
        }


        body {

            min-height: 100dvh;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text);

            background:

                radial-gradient(
                    ellipse at 70% 18%,
                    rgba(255,255,255,.92)
                    0%,
                    rgba(255,255,255,.45)
                    27%,
                    transparent 57%
                ),

                radial-gradient(
                    ellipse at 15% 75%,
                    rgba(194,207,184,.60)
                    0%,
                    rgba(211,219,200,.38)
                    35%,
                    transparent 70%
                ),

                linear-gradient(
                    135deg,
                    #c3cdb8 0%,
                    #d3dbc8 38%,
                    #e1e7da 68%,
                    #cbd5c2 100%
                );

            -webkit-font-smoothing: antialiased;

            text-rendering: optimizeLegibility;

            overscroll-behavior: none;
        }


        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background:

                radial-gradient(
                    ellipse at 72% 24%,
                    rgba(255,255,255,.40),
                    transparent 32%
                ),

                radial-gradient(
                    ellipse at 20% 15%,
                    rgba(255,255,255,.26),
                    transparent 22%
                );

            z-index: 0;
        }


        body::after {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.08),
                    transparent 40%
                );

            z-index: 0;
        }


        a {

            color: inherit;

            text-decoration: none;
        }


        button {

            font: inherit;
        }


        /* =====================================================
           APP
        ===================================================== */

        .app {

            position: relative;

            z-index: 1;

            width: 100%;
            height: 100dvh;

            min-height: 100dvh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding:
                max(10px, env(safe-area-inset-top))
                max(10px, env(safe-area-inset-right))
                max(10px, env(safe-area-inset-bottom))
                max(10px, env(safe-area-inset-left));
        }


        .profile {

            position: relative;

            width:
                min(
                    100%,
                    560px
                );

            height:
                min(
                    100%,
                    900px
                );

            max-height: 100dvh;

            display: flex;

            flex-direction: column;

            overflow: hidden;

            background:
                rgba(255,255,255,.08);

            border-radius: 30px;

            box-shadow:
                var(--shadow);
        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {

            position: relative;

            flex: 0 0 auto;

            padding:
                clamp(20px, 3.4vh, 34px)
                24px
                clamp(14px, 2.5vh, 23px);

            text-align: center;
        }


        .hero::after {

            content: "";

            position: absolute;

            width: 230px;
            height: 150px;

            top: -90px;
            left: 50%;

            transform:
                translateX(-50%);

            background:
                rgba(
                    255,
                    255,
                    255,
                    .38
                );

            filter:
                blur(38px);

            border-radius: 50%;

            pointer-events: none;
        }


        .avatar {

            position: relative;
            z-index: 1;

            width:
                clamp(
                    70px,
                    10.5vh,
                    104px
                );

            height:
                clamp(
                    70px,
                    10.5vh,
                    104px
                );

            margin:
                0 auto
                clamp(
                    8px,
                    1.5vh,
                    14px
                );

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #eef2e9,
                    #c2cdb8
                );

            border:
                3px solid
                rgba(
                    255,
                    255,
                    255,
                    .70
                );

            box-shadow:
                0 12px 30px
                rgba(
                    60,
                    74,
                    62,
                    .16
                );

            font-size:
                clamp(
                    24px,
                    3.8vh,
                    34px
                );

            font-weight: 800;

            letter-spacing: -1px;

            color:
                var(--text);
        }


        .avatar img {

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }


        .avatar.character img {

            object-fit: contain;

            padding: 7px;
        }


        h1 {

            position: relative;
            z-index: 1;

            margin: 0;

            font-size:
                clamp(
                    23px,
                    3.3vh,
                    30px
                );

            line-height: 1.12;

            letter-spacing: -.7px;

            color:
                var(--text);
        }


        .age {

            position: relative;
            z-index: 1;

            margin-top: 5px;

            color:
                var(--text-soft);

            font-size: 12px;
        }


        .bio {

            position: relative;
            z-index: 1;

            max-width: 430px;

            margin:
                clamp(
                    7px,
                    1.3vh,
                    12px
                )
                auto 0;

            color:
                var(--text-soft);

            font-size:
                clamp(
                    11px,
                    1.65vh,
                    14px
                );

            line-height: 1.42;

            white-space: pre-line;
        }


        /* =====================================================
           CONTENT
        ===================================================== */

        .content {

            flex: 1 1 auto;

            min-height: 0;

            display: flex;

            flex-direction: column;

            overflow: hidden;
        }


        .section {

            padding:
                clamp(
                    12px,
                    2.1vh,
                    22px
                )
                20px
                0;
        }


        .section-header {

            margin-bottom:
                clamp(
                    7px,
                    1.25vh,
                    12px
                );
        }


        .section-title {

            margin: 0;

            color:
                var(--text);

            font-size:
                clamp(
                    17px,
                    2.6vh,
                    21px
                );

            line-height: 1.15;

            letter-spacing: -.35px;
        }


        .section-subtitle {

            margin:
                3px 0 0;

            color:
                var(--text-muted);

            font-size: 11px;
        }


        /* =====================================================
           CONTACT
        ===================================================== */

        .contacts {

            display: flex;

            flex-direction: column;

            gap:
                clamp(
                    5px,
                    .8vh,
                    8px
                );
        }


        .contact-item {

            width: 100%;

            min-height:
                clamp(
                    45px,
                    6.3vh,
                    60px
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                7px 14px;

            border:
                1px solid
                var(--main-border);

            border-radius: 16px;

            background:
                linear-gradient(
                    100deg,
                    rgba(255,255,255,.48),
                    rgba(211,219,200,.68)
                );

            box-shadow:
                0 7px 18px
                rgba(
                    54,
                    67,
                    56,
                    .10
                );

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }


        .contact-item:hover {

            background:
                linear-gradient(
                    100deg,
                    rgba(255,255,255,.62),
                    rgba(211,219,200,.82)
                );

            box-shadow:
                0 10px 22px
                rgba(
                    54,
                    67,
                    56,
                    .14
                );
        }


        .contact-item:active {

            transform:
                scale(.985);
        }


        .contact-inner {

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 11px;

            text-align: center;
        }


        .contact-icon {

            width:
                36px;

            height:
                36px;

            flex:
                0 0 36px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .46
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .48
                );

            overflow: hidden;
        }


        .contact-icon img {

            width: 21px;

            height: 21px;

            object-fit: contain;

            display: block;
        }


        .contact-info {

            min-width: 0;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;
        }


        .contact-label {

            margin-bottom: 2px;

            color:
                var(--text-muted);

            font-size: 9px;

            line-height: 1.15;
        }


        .contact-value {

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            color:
                var(--text);

            font-size: 12px;

            font-weight: 700;
        }


        /* =====================================================
           SOCIAL
        ===================================================== */

        .social-section {

            flex: 1 1 auto;

            min-height: 0;

            display: flex;

            flex-direction: column;

            padding-top:
                clamp(
                    10px,
                    1.8vh,
                    18px
                );
        }


        .social-section .section-header {

            flex: 0 0 auto;
        }


        .social-window {

            position: relative;

            width:
                calc(
                    100% + 40px
                );

            margin-left: -20px;

            flex: 0 0 auto;

            overflow: hidden;

            padding:
                10px 0 10px;

            touch-action:
                pan-y;

            user-select: none;

            -webkit-user-select: none;

            overscroll-behavior:
                contain;
        }


        .social-track {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 16px;

            width: max-content;

            padding:
                8px 0;

            will-change:
                transform;

            cursor: grab;

            transform:
                translate3d(
                    0,
                    0,
                    0
                );

            backface-visibility:
                hidden;

            -webkit-backface-visibility:
                hidden;
        }


        .social-track.dragging {

            cursor: grabbing;
        }


        .social-item {

            position: relative;

            width: 66px;
            height: 66px;

            flex:
                0 0 66px;

            display: flex;

            align-items: center;
            justify-content: center;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .58
                );

            padding: 0;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    rgba(
                        255,
                        255,
                        255,
                        .72
                    ),
                    rgba(
                        211,
                        219,
                        200,
                        .82
                    )
                );

            box-shadow:
                0 8px 20px
                rgba(
                    55,
                    69,
                    57,
                    .13
                );

            cursor: pointer;

            -webkit-tap-highlight-color:
                transparent;

            transition:
                transform .34s
                    cubic-bezier(
                        .22,
                        .8,
                        .25,
                        1
                    ),

                opacity .28s ease,

                box-shadow .28s ease;
        }


        .social-item img {

            width: 35px;
            height: 35px;

            object-fit: contain;

            pointer-events: none;

            transition:
                width .34s
                    cubic-bezier(
                        .22,
                        .8,
                        .25,
                        1
                    ),

                height .34s
                    cubic-bezier(
                        .22,
                        .8,
                        .25,
                        1
                    );
        }


        .social-item.active {

            width: 76px;
            height: 76px;

            flex-basis: 76px;

            transform:
                translateY(-3px);

            background:
                linear-gradient(
                    145deg,
                    rgba(
                        255,
                        255,
                        255,
                        .94
                    ),
                    rgba(
                        211,
                        219,
                        200,
                        .94
                    )
                );

            box-shadow:
                0 15px 30px
                rgba(
                    55,
                    69,
                    57,
                    .18
                );

            z-index: 3;
        }


        .social-item.active img {

            width: 44px;
            height: 44px;
        }


        .social-item.near {

            transform:
                scale(.90);
        }


        .social-item.hidden-social {

            opacity: 0;

            pointer-events: none;
        }


        /* =====================================================
           SOCIAL INFO
        ===================================================== */

        .social-info {

            flex:
                0 0 44px;

            height: 44px;

            min-height: 44px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            overflow: hidden;

            margin-top: -1px;

            transition:
                opacity .16s ease,
                transform .16s ease;
        }


        .social-info.changing {

            opacity: 0;

            transform:
                translateY(4px);
        }


        .social-name {

            width: 100%;

            margin: 0;

            color:
                var(--text);

            font-size: 14px;

            font-weight: 800;

            line-height: 17px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .social-username {

            width: 100%;

            margin:
                2px 0 0;

            color:
                var(--text-muted);

            font-size: 11px;

            line-height: 14px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .swipe-hint {

            flex:
                0 0 17px;

            height: 17px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            color:
                var(--text-muted);

            font-size: 9px;
        }


        .swipe-line {

            width: 19px;

            height: 1px;

            background:
                rgba(
                    37,
                    48,
                    39,
                    .20
                );
        }


        /* =====================================================
           BOTTOM
        ===================================================== */

        .bottom {

            position:
                absolute;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 100;

            height:
                40px;

            display: flex;

            align-items: flex-start;

            justify-content: center;

            padding:
                5px
                20px
                max(
                    6px,
                    env(
                        safe-area-inset-bottom
                    )
                );

            pointer-events:
                none;
        }


        .edit-button {

            pointer-events:
                auto;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 24px;

            padding:
                4px 9px;

            border-radius: 999px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .32
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .40
                );

            color:
                var(--text-muted);

            font-size: 8px;

            font-weight: 600;

            letter-spacing: .1px;

            opacity: .66;

            transition:
                opacity .2s ease,
                background .2s ease,
                transform .2s ease;
        }


        .edit-button:hover {

            opacity: 1;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .52
                );
        }


        .edit-button:active {

            transform:
                scale(.96);
        }


        /* =====================================================
           LOADING / ERROR
        ===================================================== */

        .loading {

            position: fixed;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            color:
                var(--text);

            font-size: 13px;
        }


        .loading::before {

            content: "";

            width: 28px;

            height: 28px;

            margin-right: 10px;

            border:
                3px solid
                rgba(
                    37,
                    48,
                    39,
                    .12
                );

            border-top-color:
                rgba(
                    37,
                    48,
                    39,
                    .55
                );

            border-radius: 50%;

            animation:
                spin .8s linear infinite;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }

        }


        .error {

            position: fixed;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 24px;

            text-align: center;

            color:
                var(--text);

            font-size: 13px;

            line-height: 1.5;
        }


        .hidden {

            display:
                none !important;
        }


        /* =====================================================
           DESKTOP
        ===================================================== */

        @media (min-width: 601px) {

            .app {

                padding:
                    20px;
            }


            .profile {

                height:
                    min(
                        calc(
                            100dvh - 40px
                        ),
                        900px
                    );
            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .app {

                padding:
                    0;
            }


            .profile {

                width:
                    100%;

                height:
                    100dvh;

                min-height:
                    100dvh;

                max-height:
                    100dvh;

                border-radius:
                    0;

                box-shadow:
                    none;

                background:
                    transparent;
            }


            .hero {

                padding-top:
                    max(
                        16px,
                        env(
                            safe-area-inset-top
                        )
                    );

                padding-left:
                    18px;

                padding-right:
                    18px;
            }


            .section {

                padding-left:
                    16px;

                padding-right:
                    16px;
            }


            .social-window {

                width:
                    calc(
                        100% + 32px
                    );

                margin-left:
                    -16px;
            }


            /*
             * Mobile fix:
             *
             * The edit button is fixed to the
             * actual iframe viewport instead of
             * depending on flex/content height.
             */

            .bottom {

                position:
                    fixed;

                left:
                    50%;

                right:
                    auto;

                bottom:
                    0;

                width:
                    100%;

                height:
                    max(
                        38px,
                        calc(
                            30px +
                            env(
                                safe-area-inset-bottom
                            )
                        )
                    );

                transform:
                    translateX(-50%);

                padding:
                    5px
                    16px
                    max(
                        6px,
                        env(
                            safe-area-inset-bottom
                        )
                    );

                background:
                    linear-gradient(
                        180deg,
                        rgba(
                            211,
                            219,
                            200,
                            0
                        ),
                        rgba(
                            211,
                            219,
                            200,
                            .12
                        )
                    );

                backdrop-filter:
                    blur(4px);

                -webkit-backdrop-filter:
                    blur(4px);
            }


            .edit-button {

                position:
                    relative;

                z-index:
                    101;
            }

        }


        /* =====================================================
           SMALL HEIGHT MOBILE
        ===================================================== */

        @media (max-width: 600px)
        and (max-height: 740px) {

            .hero {

                padding-top:
                    max(
                        12px,
                        env(
                            safe-area-inset-top
                        )
                    );

                padding-bottom:
                    11px;
            }


            .avatar {

                width:
                    62px;

                height:
                    62px;

                margin-bottom:
                    7px;

                font-size:
                    21px;
            }


            h1 {

                font-size:
                    22px;
            }


            .age {

                margin-top:
                    3px;

                font-size:
                    11px;
            }


            .bio {

                margin-top:
                    6px;

                font-size:
                    10.5px;

                line-height:
                    1.3;
            }


            .section {

                padding-top:
                    9px;
            }


            .section-header {

                margin-bottom:
                    6px;
            }


            .section-title {

                font-size:
                    16px;
            }


            .section-subtitle {

                font-size:
                    10px;
            }


            .contacts {

                gap:
                    5px;
            }


            .contact-item {

                min-height:
                    42px;

                padding:
                    5px 8px;
            }


            .contact-icon {

                width:
                    30px;

                height:
                    30px;

                flex-basis:
                    30px;
            }


            .contact-icon img {

                width:
                    18px;

                height:
                    18px;
            }


            .contact-value {

                font-size:
                    11px;
            }


            .social-section {

                padding-top:
                    7px;
            }


            .social-window {

                padding-top:
                    5px;

                padding-bottom:
                    5px;
            }


            .social-track {

                gap:
                    10px;

                padding-top:
                    5px;

                padding-bottom:
                    5px;
            }


            .social-item {

                width:
                    54px;

                height:
                    54px;

                flex-basis:
                    54px;
            }


            .social-item img {

                width:
                    29px;

                height:
                    29px;
            }


            .social-item.active {

                width:
                    66px;

                height:
                    66px;

                flex-basis:
                    66px;
            }


            .social-item.active img {

                width:
                    38px;

                height:
                    38px;
            }


            .social-info {

                height:
                    39px;

                min-height:
                    39px;

                flex-basis:
                    39px;
            }


            .swipe-hint {

                height:
                    14px;

                min-height:
                    14px;

                flex-basis:
                    14px;

                font-size:
                    8px;
            }


            .bottom {

                height:
                    max(
                        36px,
                        calc(
                            28px +
                            env(
                                safe-area-inset-bottom
                            )
                        )
                    );
            }

        }


        /* =====================================================
           VERY SMALL HEIGHT MOBILE
        ===================================================== */

        @media (max-width: 600px)
        and (max-height: 620px) {

            .hero {

                padding-top:
                    max(
                        8px,
                        env(
                            safe-area-inset-top
                        )
                    );

                padding-bottom:
                    7px;
            }


            .avatar {

                width:
                    50px;

                height:
                    50px;

                margin-bottom:
                    5px;

                font-size:
                    17px;
            }


            h1 {

                font-size:
                    19px;
            }


            .age {

                font-size:
                    10px;

    function getTagCode() {

        const url =
            new URL(
                window.location.href
            );


        const tag =
            url.searchParams.get(
                "tag"
            );


        if (
            !tag
        ) {

            return null;
        }


        return tag
            .trim()
            .toUpperCase();
    }


    function clean(
        value
    ) {

        return String(
            value || ""
        ).trim();
    }


    function initials(
        value
    ) {

        const parts =
            clean(
                value
            )
                .split(
                    /\s+/
                )
                .filter(
                    Boolean
                );


        if (
            parts.length === 0
        ) {

            return "?";
        }


        if (
            parts.length === 1
        ) {

            return parts[0]
                .substring(
                    0,
                    2
                )
                .toUpperCase();
        }


        return (
            parts[0][0] +
            parts[
                parts.length - 1
            ][0]
        ).toUpperCase();
    }


    function username(
        value
    ) {

        return clean(
            value
        ).replace(
            /^@/,
            ""
        );
    }

    function addContact(
        label,
        value,
        href,
        iconUrl
    ) {

        const link =

                "a"
            );


        link.className =
            "contact-item";


        link.href =

            ) ||

            )
        ) {

            link.target =
                "_blank";


            link.rel =
                "noopener noreferrer";
        }


        const inner =
            document.createElement(
                "div"
            );


        inner.className =
            "contact-inner";


        const icon =
            document.createElement(
                "div"
            );


        icon.className =
            "contact-icon";


        const image =
            document.createElement(
                "img"
            );


        image.src =
            iconUrl;


        image.alt =
            label;


        icon.appendChild(
            image
        );


        const info =
            document.createElement(
                "div"
            );


        info.className =

        const labelElement =

                "div"
            );


        labelElement.className =

            );

        );

        );

        );

    const socialData = [];


    function addSocial(
        platformName,
        platformUsername,
        href,
        iconUrl
    ) {

        if (
            !href
        ) {

            return;
        }


        socialData.push({

            name:
                platformName,

            username:
                platformUsername,

            url:
                href,

            icon:
                iconUrl
        });
    }


    let items = [];

    let count = 0;

    let activeIndex = 0;

    let currentOffset = 0;

    let dragging = false;

    let moved = false;

    let startX = 0;

    let startOffset = 0;

    let suppressClick = false;

    let infoTimer = null;

    const copies = 7;


    function buildSocialCarousel() {

        socialTrack.innerHTML =
            "";


        if (
            socialData.length === 0
        ) {

            socialSection.classList.add(
                "hidden"
            );

            return;
        }


        socialSection.classList.remove(
            "hidden"
        );


        for (
            let copy = 0;
            copy < copies;
            copy++
        ) {

            socialData.forEach(
                (
                    data,
                    originalIndex
                ) => {

                    const link =
                        document.createElement(
                            "a"
                        );


                    link.className =
                        "social-item";


                    link.href =
                        data.url;


                    link.target =
                        "_blank";


                    link.rel =
                        "noopener noreferrer";


                    link.dataset.name =
                        data.name;


                    link.dataset.username =
                        data.username;


                    link.dataset.url =
                        data.url;


                    link.dataset.originalIndex =
                        String(
                            originalIndex
                        );


                    const image =
                        document.createElement(
                            "img"
                        );


                    image.src =
                        data.icon;


                    image.alt =
                        data.name;


                    image.draggable =
                        false;


                    link.appendChild(
                        image
                    );


                    socialTrack.appendChild(
                        link
                    );
                }
            );
        }


        items =
            Array.from(
                socialTrack.querySelectorAll(
                    ".social-item"
                )
            );


        count =
            socialData.length;


        activeIndex =
            count * 3;


        requestAnimationFrame(
            () => {

                updateVisuals();


                setOffset(
                    getTargetOffset(
                        activeIndex
                    ),
                    false
                );


                updateInformation(
                    items[activeIndex],
                    false
                );
            }
        );
    }


    function getTargetOffset(
        index
    ) {

        const item =
            items[index];


        if (
            !item
        ) {

            return 0;
        }


        const windowWidth =
            socialWindow.clientWidth;


        const itemCenter =
            item.offsetLeft +
            item.offsetWidth / 2;


        return (
            windowWidth / 2 -
            itemCenter
        );
    }


    function setOffset(
        offset,
        animate = true
    ) {

        socialTrack.style.transition =
            animate
                ? "transform .42s cubic-bezier(.22,.8,.25,1)"
                : "none";


        socialTrack.style.transform =
            `translate3d(${offset}px,0,0)`;


        currentOffset =
            offset;
    }


    function updateVisuals() {

        items.forEach(
            (
                item,
                index
            ) => {

                const distance =
                    Math.abs(
                        index -
                        activeIndex
                    );


                item.classList.remove(
                    "active",
                    "near",
                    "hidden-social"
                );


                if (
                    distance === 0
                ) {

                    item.classList.add(
                        "active"
                    );

                }
                else if (
                    distance === 1
                ) {

                    item.classList.add(
                        "near"
                    );

                }
                else {

                    item.classList.add(
                        "hidden-social"
                    );
                }
            }
        );
    }


    function updateInformation(
        item,
        animate = true
    ) {

        if (
            !item
        ) {

            return;
        }


        if (
            infoTimer
        ) {

            clearTimeout(
                infoTimer
            );
        }


        if (
            animate
        ) {

            socialInfo.classList.add(
                "changing"
            );
        }


        infoTimer =
            setTimeout(
                () => {

                    socialName.textContent =
                        item.dataset.name;


                    socialUsername.textContent =
                        item.dataset.username;


                    socialInfo.classList.remove(
                        "changing"
                    );

                },
                animate
                    ? 100
                    : 0
            );
    }


    function normalizeInfinitePosition() {

        if (
            count === 0
        ) {

            return;
        }


        const lower =
            count * 2;


        const upper =
            count * 5;


        if (
            activeIndex < lower
        ) {

            activeIndex +=
                count * 3;


            setOffset(
                getTargetOffset(
                    activeIndex
                ),
                false
            );


            updateVisuals();


            updateInformation(
                items[activeIndex],
                false
            );


            return;
        }


        if (
            activeIndex >= upper
        ) {

            activeIndex -=
                count * 3;


            setOffset(
                getTargetOffset(
                    activeIndex
                ),
                false
            );


            updateVisuals();


            updateInformation(
                items[activeIndex],
                false
            );
        }
    }


    function selectIndex(
        index,
        animate = true
    ) {

        if (
            count === 0
        ) {

            return;
        }


        activeIndex =
            index;


        updateVisuals();


        setOffset(
            getTargetOffset(
                activeIndex
            ),
            animate
        );


        updateInformation(
            items[activeIndex],
            animate
        );


        if (
            animate
        ) {

            setTimeout(
                normalizeInfinitePosition,
                460
            );

        }
        else {

            normalizeInfinitePosition();
        }
    }


    function getClosestIndex() {

        if (
            count === 0
        ) {

            return 0;
        }


        const center =
            socialWindow.clientWidth /
            2;


        let closest =
            activeIndex;


        let closestDistance =
            Infinity;


        items.forEach(
            (
                item,
                index
            ) => {

                const itemCenter =
                    item.offsetLeft +
                    item.offsetWidth / 2 +
                    currentOffset;


                const distance =
                    Math.abs(
                        center -
                        itemCenter
                    );


                if (
                    distance <
                    closestDistance
                ) {

                    closestDistance =
                        distance;


                    closest =
                        index;
                }
            }
        );


        return closest;
    }


    socialTrack.addEventListener(
        "click",
        event => {

            const item =
                event.target.closest(
                    ".social-item"
                );


            if (
                !item
            ) {

                return;
            }


            if (
                suppressClick ||
                moved
            ) {

                event.preventDefault();

                return;
            }


            const index =
                items.indexOf(
                    item
                );


            if (
                index !==
                activeIndex
            ) {

                event.preventDefault();


                selectIndex(
                    index
                );


                return;
            }


            event.preventDefault();


            item.animate(
                [
                    {
                        transform:
                            "translateY(-3px) scale(1)"
                    },

                    {
                        transform:
                            "translateY(-3px) scale(.92)"
                    },

                    {
                        transform:
                            "translateY(-3px) scale(1)"
                    }
                ],
                {
                    duration: 170,

                    easing:
                        "cubic-bezier(.22,.8,.25,1)"
                }
            );


            const url =
                item.dataset.url ||
                item.href ||
                "";


            if (!url) {
                return;
            }


            const opened =
                window.open(
                    url,
                    "_blank",
                    "noopener,noreferrer"
                );


            if (!opened) {
                window.location.href = url;
            }
        }
    );


    socialWindow.addEventListener(
        "pointerdown",
        event => {

            if (
                count === 0
            ) {

                return;
            }


            dragging =
                true;


            moved =
                false;


            suppressClick =
                false;


            startX =
                event.clientX;


            startOffset =
                currentOffset;


            socialTrack.classList.add(
                "dragging"
            );


            socialTrack.style.transition =
                "none";


            try {

                socialWindow.setPointerCapture(
                    event.pointerId
                );

            }
            catch (
                error
            ) {}
        }
    );


    socialWindow.addEventListener(
        "pointermove",
        event => {

            if (
                !dragging ||
                count === 0
            ) {

                return;
            }


            const delta =
                event.clientX -
                startX;


            if (
                Math.abs(delta) >
                5
            ) {

                moved =
                    true;


                suppressClick =
                    true;
            }


            const newOffset =
                startOffset +
                delta;


            socialTrack.style.transform =
                `translate3d(${newOffset}px,0,0)`;


            currentOffset =
                newOffset;


            const closest =
                getClosestIndex();


            if (
                closest !==
                activeIndex
            ) {

                activeIndex =
                    closest;


                updateVisuals();


                updateInformation(
                    items[activeIndex],
                    true
                );
            }


            if (
                activeIndex <
                count * 2
            ) {

                activeIndex +=
                    count * 3;


                const normalizedOffset =
                    getTargetOffset(
                        activeIndex
                    );


                setOffset(
                    normalizedOffset,
                    false
                );


                startOffset =
                    normalizedOffset;


                startX =
                    event.clientX;


                updateVisuals();


                updateInformation(
                    items[activeIndex],
                    false
                );
            }


            if (
                activeIndex >=
                count * 5
            ) {

                activeIndex -=
                    count * 3;


                const normalizedOffset =
                    getTargetOffset(
                        activeIndex
                    );


                setOffset(
                    normalizedOffset,
                    false
                );


                startOffset =
                    normalizedOffset;


                startX =
                    event.clientX;


                updateVisuals();


                updateInformation(
                    items[activeIndex],
                    false
                );
            }
        }
    );


    function finishDrag(
        event
    ) {

        if (
            !dragging
        ) {

            return;
        }


        dragging =
            false;


        socialTrack.classList.remove(
            "dragging"
        );


        try {

            socialWindow.releasePointerCapture(
                event.pointerId
            );

        }
        catch (
            error
        ) {}


        const closest =
            getClosestIndex();


        selectIndex(
            closest
        );


        setTimeout(
            () => {

                moved =
                    false;


                suppressClick =
                    false;

            },
            100
        );
    }


    socialWindow.addEventListener(
        "pointerup",
        finishDrag
    );


    socialWindow.addEventListener(
        "pointercancel",
        finishDrag
    );


    socialWindow.addEventListener(
        "wheel",
        event => {

            if (
                count === 0
            ) {

                return;
            }


            event.preventDefault();


            const direction =
                Math.abs(
                    event.deltaX
                ) >
                Math.abs(
                    event.deltaY
                )

                    ? (
                        event.deltaX > 0
                            ? 1
                            : -1
                    )

                    : (
                        event.deltaY > 0
                            ? 1
                            : -1
                    );


            selectIndex(
                activeIndex +
                direction
            );

        },
        {
            passive: false
        }
    );


    window.addEventListener(
        "keydown",
        event => {

            if (
                count === 0
            ) {

                return;
            }


            if (
                event.key ===
                "ArrowRight"
            ) {

                selectIndex(
                    activeIndex + 1
                );
            }


            if (
                event.key ===
                "ArrowLeft"
            ) {

                selectIndex(
                    activeIndex - 1
                );
            }
        }
    );


    let resizeFrame =
        null;


    window.addEventListener(
        "resize",
        () => {

            if (
                resizeFrame
            ) {

                cancelAnimationFrame(
                    resizeFrame
                );
            }


            resizeFrame =
                requestAnimationFrame(
                    () => {

                        if (
                            count > 0
                        ) {

                            setOffset(
                                getTargetOffset(
                                    activeIndex
                                ),
                                false
                            );
                        }
                    }
                );
        }
    );


    async function getTag(
        tagCode
    ) {

        const {
            data,
            error
        } =
            await supabase
                .from(
                    "nfc_tags"
                )
                .select(
                    "owner_id,active,tag_code"
                )
                .eq(
                    "tag_code",
                    tagCode
                )
                .maybeSingle();


        if (
            error
        ) {

            throw new Error(
                `Unable to load this E-Tag: ${error.message}`
            );
        }


        if (
            !data
        ) {

            throw new Error(
                `E-Tag "${tagCode}" was not found.`
            );
        }


        return data;
    }


    async function load() {

        try {

            const tagCode =
                getTagCode();


            if (
                !tagCode
            ) {

                throw new Error(
                    "Invalid E-Tag URL."
                );
            }


            const tag =
                await getTag(
                    tagCode
                );


            if (
                !tag.active ||
                !tag.owner_id
            ) {

                throw new Error(
                    "This E-Tag has not been activated."
                );
            }


            const {
                data: profileData,
                error: profileError
            } =
                await supabase
                    .from(
                        "profiles"
                    )
                    .select(
                        "*"
                    )
                    .eq(
                        "id",
                        tag.owner_id
                    )
                    .maybeSingle();


            if (
                profileError
            ) {

                throw new Error(
                    `Unable to load profile: ${profileError.message}`
                );
            }


            if (
                !profileData
            ) {

                throw new Error(
                    "Public profile not found."
                );
            }


            const displayName =
                clean(
                    profileData.display_name
                ) ||
                "E-Tag User";


            name.textContent =
                displayName;


            age.textContent =
                profileData.age
                    ? `${profileData.age} years old`
                    : "";


            bio.textContent =
                clean(
                    profileData.bio
                );


            renderAvatar(
                avatar,
                profileData
            );


            /* =================================================
               CONTACT
               LOCATION INTENTIONALLY OMITTED
            ================================================= */

            contacts.innerHTML =
                "";


            if (
                profileData.phone
            ) {

                addContact(
                    "Call",
                    "Call Me",
                    `tel:${encodeURIComponent(
                        profileData.phone
                    )}`,
                    ICONS.call
                );
            }


            if (
                profileData.whatsapp
            ) {

                const number =
                    clean(
                        profileData.whatsapp
                    )
                        .replace(
                            /\D/g,
                            ""
                        );


                if (
                    number
                ) {

                    addContact(
                        "WhatsApp",
                        "WhatsApp Me",
                        `https://wa.me/${number}`,
                        ICONS.whatsapp
                    );
                }
            }


            if (
                profileData.email
            ) {

                addContact(
                    "Email",
                    "Email Me",
                    `mailto:${encodeURIComponent(
                        profileData.email
                    )}`,
                    ICONS.email
                );
            }


            if (
                contacts.children.length === 0
            ) {

                contactSection.classList.add(
                    "hidden"
                );

            }
            else {

                contactSection.classList.remove(
                    "hidden"
                );
            }


            /* =================================================
               SOCIAL
            ================================================= */

            socialData.length =
                0;


            if (
                profileData.facebook
            ) {

                const value =
                    clean(
                        profileData.facebook
                    );


                const user =
                    username(
                        value
                    );


                addSocial(
                    "Facebook",
                    `@${user}`,
                    value,
                    ICONS.facebook
                );
            }


            if (
                profileData.instagram
            ) {

                const value =
                    clean(
                        profileData.instagram
                    );


                const user =
                    username(
                        value
                    );


                addSocial(
                    "Instagram",
                    `@${user}`,
                    value,
                    ICONS.instagram
                );
            }


            if (
                profileData.tiktok
            ) {

                const value =
                    clean(
                        profileData.tiktok
                    );


                const user =
                    username(
                        value
                    );


                addSocial(
                    "TikTok",
                    `@${user}`,
                    value,
                    ICONS.tiktok
                );
            }


            if (
                profileData.youtube
            ) {

                const value =
                    clean(
                        profileData.youtube
                    );


                const user =
                    username(
                        value
                    );


                addSocial(
                    "YouTube",
                    `@${user}`,
                    value,
                    ICONS.youtube
                );
            }


            if (
                profileData.telegram
            ) {

                const value =
                    clean(
                        profileData.telegram
                    );


                const user =
                    username(
                        value
                    );


                addSocial(
                    "Telegram",
                    `@${user}`,
                    value,
                    ICONS.telegram
                );
            }


            if (
                profileData.discord
            ) {

                const value =
                    clean(
                        profileData.discord
                    );


                addSocial(
                    "Discord",
                    value
                        ? `@${username(value)}`
                        : "@discord",
                    value,
                    ICONS.discord
                );
            }


            if (
                profileData.linkedin
            ) {

                const value =
                    clean(
                        profileData.linkedin
                    );


                const user =
                    username(
                        value
                    );


                addSocial(
                    "LinkedIn",
                    `@${user}`,
                    value,
                    ICONS.linkedin
                );
            }


            buildSocialCarousel();


            /* =================================================
               EDIT ROUTING
            ================================================= */

            editButton.href =
                `/E-Tag/?tag=${encodeURIComponent(
                    tag.tag_code
                )}&edit=1`;


            loading.classList.add(
                "hidden"
            );


            errorBox.classList.add(
                "hidden"
            );


            profile.classList.remove(
                "hidden"
            );


        }
        catch (
            error
        ) {

            console.error(
                "Men theme load error:",
                error
            );


            loading.classList.add(
                "hidden"
            );


            errorBox.textContent =
                error.message ||
                "Unable to load profile.";


            errorBox.classList.remove(
                "hidden"
            );
        }
    }


    load();

</script>


</body>

</html>
