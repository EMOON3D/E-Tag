        const extraScript = `

<script type="module">

import {
    createClient
}
from
    "https://esm.sh/@supabase/supabase-js@2";


const SUPABASE_URL =
    "https://zuptxhcjzhqynrquyray.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_1sa0MtE83MZXETR5JLakJA_fRVrjDJI";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const DEFAULT_THEME =
{

    background1:
        "#C3CDB8",

    background2:
        "#D3DBC8",

    background3:
        "#E1E7DA",

    main:
        "#D3DBC8",

    secondary:
        "#E5EADF",

    glass:
        "#D3DBC8",

    surface:
        "#FFFFFF",

    border:
        "#FFFFFF",

    accent:
        "#B8C9A8",

    shadow:
        "#374539"

};


function normalizeColor(
    value,
    fallback
)
{

    const text =
        String(
            value ||
            ""
        )
        .trim()
        .toUpperCase();


    if (
        /^#[0-9A-F]{6}$/.test(
            text
        )
    )
    {

        return text;

    }


    return fallback;

}


function applyThemeColors(
    colors
)
{

    const palette =
    {

        ...DEFAULT_THEME,

        ...(colors &&
            typeof colors ===
                "object"
            ? colors
            : {})

    };


    const normalized =
    {

        background1:
            normalizeColor(
                palette.background1,
                DEFAULT_THEME.background1
            ),

        background2:
            normalizeColor(
                palette.background2,
                DEFAULT_THEME.background2
            ),

        background3:
            normalizeColor(
                palette.background3,
                DEFAULT_THEME.background3
            ),

        main:
            normalizeColor(
                palette.main,
                DEFAULT_THEME.main
            ),

        secondary:
            normalizeColor(
                palette.secondary,
                DEFAULT_THEME.secondary
            ),

        glass:
            normalizeColor(
                palette.glass,
                DEFAULT_THEME.glass
            ),

        surface:
            normalizeColor(
                palette.surface,
                DEFAULT_THEME.surface
            ),

        border:
            normalizeColor(
                palette.border,
                DEFAULT_THEME.border
            ),

        accent:
            normalizeColor(
                palette.accent,
                DEFAULT_THEME.accent
            ),

        shadow:
            normalizeColor(
                palette.shadow,
                DEFAULT_THEME.shadow
            )

    };


    Object.entries(
        normalized
    )
    .forEach(
        (
            [
                key,
                value
            ]
        ) => {

            document.documentElement.style.setProperty(
                `--etag-${key}`,
                value
            );

        }
    );

}


function sendReady()
{

    try
    {

        window.parent.postMessage(
            {
                type:
                    "etag-men-preview-ready"
            },
            window.location.origin
        );

    }
    catch (
        error
    )
    {}

}


window.addEventListener(
    "message",
    event => {

        if (
            event.origin !==
            window.location.origin
        )
        {

            return;

        }


        if (
            event.data?.type ===
            "etag-theme-colors"
        )
        {

            applyThemeColors(
                event.data.colors
            );

        }


    }
);


async function loadSavedTheme()
{

    try
    {

        const url =
            new URL(
                window.location.href
            );


        const tagCode =
            url.searchParams.get(
                "tag"
            );


        if (
            !tagCode
        )
        {

            sendReady();

            return;

        }


        const {
            data: tag,
            error: tagError
        } =
            await supabase
                .from(
                    "nfc_tags"
                )
                .select(
                    "owner_id,active"
                )
                .eq(
                    "tag_code",
                    tagCode
                )
                .maybeSingle();


        if (
            tagError ||
            !tag ||
            !tag.active ||
            !tag.owner_id
        )
        {

            sendReady();

            return;

        }


        const {
            data: profile,
            error: profileError
        } =
            await supabase
                .from(
                    "profiles"
                )
                .select(
                    "theme_colors"
                )
                .eq(
                    "id",
                    tag.owner_id
                )
                .maybeSingle();


        if (
            !profileError &&
            profile?.theme_colors
        )
        {

            applyThemeColors(
                profile.theme_colors
            );

        }


        sendReady();

    }
    catch (
        error
    )
    {

        console.error(
            "Men theme color load error:",
            error
        );


        sendReady();

    }

}


if (
    document.readyState ===
    "loading"
)
{

    document.addEventListener(
        "DOMContentLoaded",
        loadSavedTheme,
        {
            once: true
        }
    );

}
else
{

    loadSavedTheme();

}

</script>

`;
