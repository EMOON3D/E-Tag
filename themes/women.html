<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>E-Tag · Women</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            padding:
                24px 12px 40px;

            font-family:
                Inter,
                system-ui,
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #fce7f3,
                    #fff1f2 45%,
                    #f5f7fb 45%
                );

            color: #831843;
        }

        .page {
            width:
                min(100%, 560px);

            margin: 0 auto;
        }

        .profile {
            overflow: hidden;

            border-radius: 28px;

            background: #ffffff;

            box-shadow:
                0 20px 60px
                rgba(
                    131,
                    24,
                    67,
                    .12
                );
        }

        .hero {
            padding:
                34px 24px 28px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    #fff1f2,
                    #fce7f3,
                    #fdf2f8
                );
        }

        .avatar {
            width: 120px;
            height: 120px;

            margin:
                0 auto 18px;

            border-radius: 50%;

            overflow: hidden;

            background: #fbcfe8;

            border:
                4px solid
                rgba(
                    190,
                    24,
                    93,
                    .12
                );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 35px;
            font-weight: 800;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            margin: 0;

            font-size: 30px;
            line-height: 1.2;
        }

        .age {
            margin-top: 8px;

            color: #be185d;

            font-size: 14px;
        }

        .bio {
            max-width: 440px;

            margin:
                14px auto 0;

            color: #9d174d;

            line-height: 1.65;

            white-space: pre-wrap;
        }

        .section {
            padding: 20px;
        }

        .section-title {
            margin:
                0 0 12px;

            font-size: 16px;
        }

        .actions,
        .socials {
            display: grid;
            gap: 9px;
        }

        .action {
            display: block;

            padding:
                13px 14px;

            border-radius: 12px;

            background: #9d174d;
            color: #ffffff;

            text-decoration: none;

            text-align: center;

            font-size: 14px;
            font-weight: 800;
        }

        .social {
            display: block;

            padding:
                11px 13px;

            border-radius: 10px;

            background: #fce7f3;

            color: #9d174d;

            text-decoration: none;

            text-align: center;

            font-size: 13px;
            font-weight: 700;
        }

        .edit {
            background: #fbcfe8;
            color: #9d174d;
        }

        .loading,
        .error {
            padding: 24px;

            border-radius: 20px;

            background: #ffffff;

            text-align: center;
        }

        .hidden {
            display: none !important;
        }

    </style>
</head>


<body>

<div class="page">

    <div
        id="loading"
        class="loading"
    >
        Loading profile...
    </div>


    <div
        id="profile"
        class="profile hidden"
    >

        <div class="hero">

            <div
                id="avatar"
                class="avatar"
            ></div>


            <h1
                id="name"
            >
                E-Tag User
            </h1>


            <div
                id="age"
                class="age"
            ></div>


            <p
                id="bio"
                class="bio"
            ></p>

        </div>


        <div class="section">

            <h2 class="section-title">
                Contact
            </h2>


            <div
                id="contacts"
                class="actions"
            ></div>

        </div>


        <div
            id="socialSection"
            class="section hidden"
        >

            <h2 class="section-title">
                Social
            </h2>


            <div
                id="socials"
                class="socials"
            ></div>

        </div>


        <div class="section">

            <a
                id="edit"
                class="action edit"
            >
                Edit My Profile
            </a>

        </div>

    </div>

</div>


<script type="module">

    import {
        createClient
    } from
        "https://esm.sh/@supabase/supabase-js@2";


    const SUPABASE_URL =
        "https://zuptxhcjzhqynrquyray.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_1sa0MtE83MZXETR5JLakJA_fRVrjDJI";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    const loading =
        document.getElementById(
            "loading"
        );

    const profile =
        document.getElementById(
            "profile"
        );

    const avatar =
        document.getElementById(
            "avatar"
        );

    const name =
        document.getElementById(
            "name"
        );

    const age =
        document.getElementById(
            "age"
        );

    const bio =
        document.getElementById(
            "bio"
        );

    const contacts =
        document.getElementById(
            "contacts"
        );

    const socials =
        document.getElementById(
            "socials"
        );

    const socialSection =
        document.getElementById(
            "socialSection"
        );

    const edit =
        document.getElementById(
            "edit"
        );


    function tag() {

        return new URL(
            location.href
        )
            .searchParams
            .get(
                "tag"
            );
    }


    function clean(
        value
    ) {

        return String(
            value || ""
        ).trim();
    }


    function userName(
        value
    ) {

        return clean(
            value
        )
            .replace(
                /^@/,
                ""
            );
    }


    function initials(
        value
    ) {

        const p =
            clean(
                value
            ).split(
                /\s+/
            );


        return (
            p[0]?.[0] ||
            "E"
        ) +
        (
            p[1]?.[0] ||
            "T"
        );
    }


    function link(
        parent,
        label,
        url,
        className = "action"
    ) {

        const a =
            document.createElement(
                "a"
            );


        a.className =
            className;

        a.textContent =
            label;

        a.href =
            url;

        if (
            url.startsWith(
                "http"
            )
        ) {

            a.target =
                "_blank";

            a.rel =
                "noopener";
        }


        parent.appendChild(
            a
        );
    }


    async function load() {

        const code =
            tag();


        if (
            !code
        ) {

            loading.textContent =
                "Invalid E-Tag URL.";

            return;
        }


        const {
            data: t
        } =
            await supabase
                .from(
                    "nfc_tags"
                )
                .select(
                    "owner_id,active,tag_code"
                )
                .eq(
                    "tag_code",
                    code
                )
                .maybeSingle();


        if (
            !t ||
            !t.active ||
            !t.owner_id
        ) {

            loading.textContent =
                "E-Tag not found or not activated.";

            return;
        }


        const {
            data: p
        } =
            await supabase
                .from(
                    "profiles"
                )
                .select(
                    "*"
                )
                .eq(
                    "id",
                    t.owner_id
                )
                .maybeSingle();


        if (
            !p
        ) {

            loading.textContent =
                "Public profile not found.";

            return;
        }


        const displayName =
            clean(
                p.display_name
            ) ||
            "E-Tag User";


        name.textContent =
            displayName;


        age.textContent =
            p.age
                ? `${p.age} years old`
                : "";


        bio.textContent =
            clean(
                p.bio
            );


        if (
            p.avatar_url
        ) {

            avatar.innerHTML =
                `
                    <img
                        src="${p.avatar_url}"
                        alt="Profile"
                    >
                `;

        } else {

            avatar.textContent =
                initials(
                    displayName
                );
        }


        if (
            p.phone
        ) {

            link(
                contacts,
                "Call",
                `tel:${encodeURIComponent(
                    p.phone
                )}`
            );
        }


        if (
            p.whatsapp
        ) {

            const n =
                clean(
                    p.whatsapp
                ).replace(
                    /\D/g,
                    ""
                );


            if (
                n
            ) {

                link(
                    contacts,
                    "WhatsApp",
                    `https://wa.me/${n}`
                );
            }
        }


        if (
            p.email
        ) {

            link(
                contacts,
                "Email",
                `mailto:${encodeURIComponent(
                    p.email
                )}`
            );
        }


        if (
            p.facebook
        ) {

            link(
                socials,
                "Facebook",
                `https://facebook.com/${userName(
                    p.facebook
                )}`,
                "social"
            );

            socialSection.classList.remove(
                "hidden"
            );
        }


        if (
            p.instagram
        ) {

            link(
                socials,
                "Instagram",
                `https://instagram.com/${userName(
                    p.instagram
                )}`,
                "social"
            );

            socialSection.classList.remove(
                "hidden"
            );
        }


        if (
            p.tiktok
        ) {

            link(
                socials,
                "TikTok",
                `https://www.tiktok.com/@${userName(
                    p.tiktok
                )}`,
                "social"
            );

            socialSection.classList.remove(
                "hidden"
            );
        }


        if (
            p.youtube
        ) {

            link(
                socials,
                "YouTube",
                `https://youtube.com/@${userName(
                    p.youtube
                )}`,
                "social"
            );

            socialSection.classList.remove(
                "hidden"
            );
        }


        if (
            p.telegram
        ) {

            link(
                socials,
                "Telegram",
                `https://t.me/${userName(
                    p.telegram
                )}`,
                "social"
            );

            socialSection.classList.remove(
                "hidden"
            );
        }


        edit.href =
            `/E-Tag/?tag=${encodeURIComponent(
                t.tag_code
            )}`;


        loading.classList.add(
            "hidden"
        );


        profile.classList.remove(
            "hidden"
        );
    }


    load();

</script>

</body>
</html>
