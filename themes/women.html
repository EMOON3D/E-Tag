socialTrack.addEventListener("click",e=>{const item=e.target.closest(".social-item");if(!item)return;if(suppressClick||moved){e.preventDefault();return}const i=items.indexOf(item);if(i!==activeIndex){e.preventDefault();selectIndex(i)}});
socialWindow.addEventListener("pointerdown",e=>{if(count===0)return;dragging=true;moved=false;suppressClick=false;startX=e.clientX;startOffset=currentOffset;socialTrack.classList.add("dragging");socialTrack.style.transition="none";try{socialWindow.setPointerCapture(e.pointerId)}catch(_){}});
socialWindow.addEventListener("pointermove",e=>{if(!dragging||count===0)return;const delta=e.clientX-startX;if(Math.abs(delta)>5){moved=true;suppressClick=true}const off=startOffset+delta;socialTrack.style.transform=`translate3d(${off}px,0,0)`;currentOffset=off;const c=closest();if(c!==activeIndex){activeIndex=c;updateVisuals();updateInformation(items[activeIndex],true)}if(activeIndex<count*2){activeIndex+=count*3;const no=getTargetOffset(activeIndex);setOffset(no,false);startOffset=no;startX=e.clientX;updateVisuals();updateInformation(items[activeIndex],false)}if(activeIndex>=count*5){activeIndex-=count*3;const no=getTargetOffset(activeIndex);setOffset(no,false);startOffset=no;startX=e.clientX;updateVisuals();updateInformation(items[activeIndex],false)}});
function finishDrag(e){if(!dragging)return;dragging=false;socialTrack.classList.remove("dragging");try{socialWindow.releasePointerCapture(e.pointerId)}catch(_){}selectIndex(closest());setTimeout(()=>{moved=false;suppressClick=false},100)}socialWindow.addEventListener("pointerup",finishDrag);socialWindow.addEventListener("pointercancel",finishDrag);
socialWindow.addEventListener("wheel",e=>{if(count===0)return;e.preventDefault();const dir=Math.abs(e.deltaX)>Math.abs(e.deltaY)?(e.deltaX>0?1:-1):(e.deltaY>0?1:-1);selectIndex(activeIndex+dir)},{passive:false});window.addEventListener("keydown",e=>{if(count===0)return;if(e.key==="ArrowRight")selectIndex(activeIndex+1);if(e.key==="ArrowLeft")selectIndex(activeIndex-1)});
window.addEventListener("resize",()=>{requestAnimationFrame(()=>{if(count>0)setOffset(getTargetOffset(activeIndex),false)})});
function applyStaticSocial(){const icons=Array.from(socialTrack.querySelectorAll(".social-item"));const originalCount=new Set(icons.map(i=>i.dataset.originalIndex)).size;if(!originalCount)return;if(originalCount>=3){socialTrack.classList.remove("etag-static-social");socialWindow.classList.remove("etag-static-social-window");return}const seen=new Set();icons.forEach(item=>{const key=item.dataset.originalIndex||"";if(seen.has(key))item.remove();else seen.add(key)});socialTrack.classList.add("etag-static-social");socialWindow.classList.add("etag-static-social-window");socialTrack.style.transition="none";socialTrack.style.transform="none";Array.from(socialTrack.querySelectorAll(".social-item")).forEach(i=>i.classList.remove("active","near","hidden-social"))}
async function loadProfile(tagCode){const{data:tag,error:tagError}=await supabase.from("nfc_tags").select("owner_id,active,tag_code").eq("tag_code",tagCode).maybeSingle();if(tagError)throw new Error(`Unable to load E-Tag: ${tagError.message}`);if(!tag)throw new Error("E-Tag not found.");if(!tag.active||!tag.owner_id)throw new Error("This E-Tag has not been activated.");const{data,error:profileError}=await supabase.from("profiles").select("*").eq("id",tag.owner_id).maybeSingle();if(profileError)throw new Error(`Unable to load profile: ${profileError.message}`);if(!data)throw new Error("Public profile not found.");return{tag,data}}
function renderProfile(data,tag){name.textContent=clean(data.display_name)||"E-Tag User";age.textContent=data.age?`${data.age} years old`:"";bio.textContent=clean(data.bio);renderCoverImage(data);renderAvatar(avatar,data);contacts.innerHTML="";if(data.phone)addContact("Call","Call Me",`tel:${encodeURIComponent(data.phone)}`,ICONS.call);if(data.whatsapp){const n=clean(data.whatsapp).replace(/\D/g,"");if(n)addContact("WhatsApp","WhatsApp Me",`https://wa.me/${n}`,ICONS.whatsapp)}if(data.email)addContact("Email","Email Me",`mailto:${encodeURIComponent(data.email)}`,ICONS.email);contactSection.classList.toggle("hidden",contacts.children.length===0);socialData.length=0;const fields=[["Facebook","facebook",ICONS.facebook],["Instagram","instagram",ICONS.instagram],["TikTok","tiktok",ICONS.tiktok],["YouTube","youtube",ICONS.youtube],["Telegram","telegram",ICONS.telegram],["Discord","discord",ICONS.discord],["LinkedIn","linkedin",ICONS.linkedin]];fields.forEach(([n,k,icon])=>{const v=clean(data[k]);if(v){const url=toSocialUrl(n,v);addSocial(n,`@${username(v)}`,url,icon)}});buildSocialCarousel();editButton.href=`/E-Tag/?tag=${encodeURIComponent(tag.tag_code)}&edit=1`;loading.classList.add("hidden");errorBox.classList.add("hidden");profile.classList.remove("hidden");setTimeout(applyStaticSocial,50)}
const preview=new URLSearchParams(location.search).get("preview")==="1";if(preview){window.addEventListener("message",e=>{if(e.origin!==location.origin||e.data?.type!=="etag-dashboard-preview")return;renderProfile(e.data.profile||{}, {tag_code:""});editButton.classList.add("hidden")});loading.textContent="Loading preview...";window.parent.postMessage({type:"etag-women-preview-ready"},location.origin)}else{try{const tagCode=clean(new URL(location.href).searchParams.get("tag"));if(!tag)throw new Error("Invalid E-Tag URL.");const tagCodeValue=tag.toUpperCase();loadProfile(tagCodeValue).then(({tag,data})=>renderProfile(data,tag)).catch(err=>{console.error("Women profile error:",err);loading.classList.add("hidden");errorBox.textContent=err.message||"Unable to load profile.";errorBox.classList.remove("hidden")})}catch(err){loading.classList.add("hidden");errorBox.textContent=err.message||"Unable to load profile.";errorBox.classList.remove("hidden")}}
</script>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
const themeClient=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const defaults={background:"#D3DBC8",glow:"#FFFFFF"};function applyTheme(colors){const c={...defaults,...(colors&&typeof colors==="object"?colors:{})};const bg=/^#[0-9A-F]{6}$/i.test(String(c.background||""))?String(c.background).toUpperCase():defaults.background;const glow=/^#[0-9A-F]{6}$/i.test(String(c.glow||""))?String(c.glow).toUpperCase():defaults.glow;document.documentElement.style.setProperty("--etag-theme-background",bg);document.documentElement.style.setProperty("--etag-theme-glow",glow)}window.addEventListener("message",e=>{if(e.origin!==location.origin)return;if(e.data?.type==="etag-theme-colors")applyTheme(e.data.colors)});const p=new URLSearchParams(location.search);if(p.get("preview")==="1"){window.parent.postMessage({type:"etag-women-preview-ready"},location.origin)}else{(async()=>{try{const tagCode=p.get("tag")?.trim().toUpperCase();if(!tagCode)return;const{data:tag}=await themeClient.from("nfc_tags").select("owner_id,active").eq("tag_code",tagCode).maybeSingle();if(!tag?.active||!tag.owner_id)return;const{data:prof}=await themeClient.from("profiles").select("theme_colors").eq("id",tag.owner_id).maybeSingle();if(prof?.theme_colors)applyTheme(prof.theme_colors)}catch(err){console.error("Theme color load error:",err)}})()}
</script>
