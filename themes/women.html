<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>E-Tag · Women</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            padding:
                24px 12px 40px;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #fce7f3 0%,
                    #fff1f2 45%,
                    #f5f7fb 45%
                );

            color: #831843;
        }

        .page {
            width:
                min(100%, 560px);

            margin:
                0 auto;
        }

        .profile {
            overflow:
                hidden;

            border-radius:
                28px;

            background:
                #ffffff;

            box-shadow:
                0 20px 60px
                rgba(
                    131,
                    24,
                    67,
                    .12
                );
        }

        .hero {
            padding:
                34px 24px 28px;

            text-align:
                center;

            background:
                linear-gradient(
                    145deg,
                    #fff1f2,
                    #fce7f3,
                    #fdf2f8
                );
        }

        .avatar {
            width:
                120px;

            height:
                120px;

            margin:
                0 auto 18px;

            border-radius:
                50%;

            overflow:
                hidden;

            background:
                #fbcfe8;

            border:
                4px solid
                rgba(
                    190,
                    24,
                    93,
                    .12
                );

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                35px;

            font-weight:
                800;
        }

        .avatar img {
            width:
                100%;

            height:
                100%;

            object-fit:
                cover;
        }

        .avatar.character img {
            object-fit:
                contain;

            padding:
                8px;
        }

        h1 {
            margin:
                0;

            font-size:
                30px;

            line-height:
                1.2;
        }

        .age {
            margin-top:
                8px;

            color:
                #be185d;

            font-size:
                14px;
        }

        .bio {
            max-width:
                440px;

            margin:
                14px auto 0;

            color:
                #9d174d;

            line-height:
                1.65;

            white-space:
                pre-wrap;
        }

        .section {
            padding:
                20px;
        }

        .section-title {
            margin:
                0 0 12px;

            font-size:
                16px;
        }

        .actions,
        .socials {
            display:
                grid;

            gap:
                10px;
        }

        .action {
            display:
                block;

            padding:
                13px 14px;

            border-radius:
                12px;

            background:
                #9d174d;

            color:
                #ffffff;

            text-decoration:
                none;

            text-align:
                center;

            font-size:
                14px;

            font-weight:
                800;
        }

        .social {
            display:
                block;

            padding:
                11px 13px;

            border-radius:
                10px;

            background:
                #fce7f3;

            color:
                #9d174d;

            text-decoration:
                none;

            text-align:
                center;

            font-size:
                13px;

            font-weight:
                700;
        }

        .edit {
            background:
                #fbcfe8;

            color:
                #9d174d;
        }

        .loading,
        .error {
            padding:
                24px;

            border-radius:
                20px;

            background:
                #ffffff;

            color:
                #831843;

            text-align:
                center;
        }

        .hidden {
            display:
                none !important;
        }

    </style>

</head>


<body>

<div class="page">


    <!-- LOADING -->

    <div
        id="loading"
        class="loading"
    >
        Loading profile...
    </div>


    <!-- ERROR -->

    <div
        id="error"
        class="error hidden"
    ></div>


    <!-- PROFILE -->

    <div
        id="profile"
        class="profile hidden"
    >

        <div class="hero">

            <div
                id="avatar"
                class="avatar"
            ></div>


            <h1
                id="name"
            >
                E-Tag User
            </h1>


            <div
                id="age"
                class="age"
            ></div>


            <p
                id="bio"
                class="bio"
            ></p>

        </div>


        <!-- CONTACT -->

        <div class="section">

            <h2 class="section-title">
                Contact
            </h2>


            <div
                id="contacts"
                class="actions"
            ></div>

        </div>


        <!-- SOCIAL -->

        <div
            id="socialSection"
            class="section hidden"
        >

            <h2 class="section-title">
                Social
            </h2>


            <div
                id="socials"
                class="socials"
            ></div>

        </div>


        <!-- EDIT -->

        <div class="section">

            <a
                id="edit"
                class="action edit"
                href="#"
            >
                Edit My Profile
            </a>

        </div>

    </div>

</div>


<script type="module">

    import {
        createClient
    } from
        "https://esm.sh/@supabase/supabase-js@2";


    const SUPABASE_URL =
        "https://zuptxhcjzhqynrquyray.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_1sa0MtE83MZXETR5JLakJA_fRVrjDJI";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const errorBox =
        document.getElementById(
            "error"
        );


    const profile =
        document.getElementById(
            "profile"
        );


    const avatar =
        document.getElementById(
            "avatar"
        );


    const name =
        document.getElementById(
            "name"
        );


    const age =
        document.getElementById(
            "age"
        );


    const bio =
        document.getElementById(
            "bio"
        );


    const contacts =
        document.getElementById(
            "contacts"
        );


    const socials =
        document.getElementById(
            "socials"
        );


    const socialSection =
        document.getElementById(
            "socialSection"
        );


    const edit =
        document.getElementById(
            "edit"
        );


    const CHARACTER_BASE =
        "/E-Tag/assets/characters/women/";


    function getTagCode() {

        return new URL(
            window.location.href
        )
            .searchParams
            .get(
                "tag"
            );
    }


    function clean(
        value
    ) {

        return String(
            value || ""
        ).trim();
    }


    function initials(
        value
    ) {

        const parts =
            clean(
                value
            )
                .split(
                    /\s+/
                )
                .filter(
                    Boolean
                );


        if (
            parts.length === 0
        ) {

            return "?";
        }


        if (
            parts.length === 1
        ) {

            return parts[0]
                .substring(
                    0,
                    2
                )
                .toUpperCase();
        }


        return (
            parts[0][0] +
            parts[
                parts.length - 1
            ][0]
        ).toUpperCase();
    }


    function username(
        value
    ) {

        return clean(
            value
        ).replace(
            /^@/,
            ""
        );
    }


    function renderAvatar(
        element,
        data
    ) {

        element.innerHTML =
            "";

        element.classList.remove(
            "character"
        );


        const displayName =
            clean(
                data.display_name
            ) ||
            "E-Tag User";


        /*
         * CHARACTER
         */

        if (
            data.avatar_type ===
                "character" &&
            data.character_id
        ) {

            const image =
                document.createElement(
                    "img"
                );


            image.src =
                `${CHARACTER_BASE}${encodeURIComponent(
                    data.character_id
                )}.svg`;


            image.alt =
                "Character";


            image.onerror =
                () => {

                    element.innerHTML =
                        "";

                    element.classList.remove(
                        "character"
                    );

                    element.textContent =
                        initials(
                            displayName
                        );
                };


            element.classList.add(
                "character"
            );


            element.appendChild(
                image
            );


            return;
        }


        /*
         * UPLOADED PHOTO
         */

        if (
            data.avatar_url
        ) {

            const image =
                document.createElement(
                    "img"
                );


            image.src =
                data.avatar_url;


            image.alt =
                "Profile photo";


            image.onerror =
                () => {

                    element.innerHTML =
                        "";

                    element.textContent =
                        initials(
                            displayName
                        );
                };


            element.appendChild(
                image
            );


            return;
        }


        /*
         * FALLBACK
         */

        element.textContent =
            initials(
                displayName
            );
    }


    function addContact(
        label,
        href
    ) {

        const link =
            document.createElement(
                "a"
            );


        link.className =
            "action";


        link.textContent =
            label;


        link.href =
            href;


        if (
            href.startsWith(
                "http"
            )
        ) {

            link.target =
                "_blank";

            link.rel =
                "noopener";
        }


        contacts.appendChild(
            link
        );
    }


    function addSocial(
        label,
        href
    ) {

        const link =
            document.createElement(
                "a"
            );


        link.className =
            "social";


        link.textContent =
            label;


        link.href =
            href;


        link.target =
            "_blank";

        link.rel =
            "noopener";


        socials.appendChild(
            link
        );


        socialSection.classList.remove(
            "hidden"
        );
    }


    async function load() {

        const tagCode =
            getTagCode();


        if (
            !tagCode
        ) {

            loading.classList.add(
                "hidden"
            );

            errorBox.textContent =
                "Invalid E-Tag URL.";

            errorBox.classList.remove(
                "hidden"
            );

            return;
        }


        /*
         * LOAD TAG
         */

        const {
            data: tag,
            error: tagError
        } =
            await supabase
                .from(
                    "nfc_tags"
                )
                .select(
                    "owner_id,active,tag_code"
                )
                .eq(
                    "tag_code",
                    tagCode
                )
                .maybeSingle();


        if (
            tagError
        ) {

            loading.classList.add(
                "hidden"
            );

            errorBox.textContent =
                `Unable to load E-Tag: ${
                    tagError.message
                }`;

            errorBox.classList.remove(
                "hidden"
            );

            return;
        }


        if (
            !tag
        ) {

            loading.textContent =
                "E-Tag not found.";

            return;
        }


        if (
            !tag.active ||
            !tag.owner_id
        ) {

            loading.textContent =
                "This E-Tag has not been activated.";

            return;
        }


        /*
         * LOAD PROFILE
         */

        const {
            data: data,
            error: profileError
        } =
            await supabase
                .from(
                    "profiles"
                )
                .select(
                    "*"
                )
                .eq(
                    "id",
                    tag.owner_id
                )
                .maybeSingle();


        if (
            profileError
        ) {

            loading.classList.add(
                "hidden"
            );

            errorBox.textContent =
                `Unable to load profile: ${
                    profileError.message
                }`;

            errorBox.classList.remove(
                "hidden"
            );

            return;
        }


        if (
            !data
        ) {

            loading.textContent =
                "Public profile not found.";

            return;
        }


        /*
         * PROFILE CONTENT
         */

        const displayName =
            clean(
                data.display_name
            ) ||
            "E-Tag User";


        name.textContent =
            displayName;


        age.textContent =
            data.age
                ? `${data.age} years old`
                : "";


        bio.textContent =
            clean(
                data.bio
            );


        renderAvatar(
            avatar,
            data
        );


        /*
         * CONTACT
         */

        if (
            data.phone
        ) {

            addContact(
                "Call",
                `tel:${encodeURIComponent(
                    data.phone
                )}`
            );
        }


        if (
            data.whatsapp
        ) {

            const number =
                clean(
                    data.whatsapp
                )
                    .replace(
                        /\D/g,
                        ""
                    );


            if (
                number
            ) {

                addContact(
                    "WhatsApp",
                    `https://wa.me/${number}`
                );
            }
        }


        if (
            data.email
        ) {

            addContact(
                "Email",
                `mailto:${encodeURIComponent(
                    data.email
                )}`
            );
        }


        /*
         * SOCIAL
         */

        if (
            data.facebook
        ) {

            addSocial(
                "Facebook",
                `https://facebook.com/${username(
                    data.facebook
                )}`
            );
        }


        if (
            data.instagram
        ) {

            addSocial(
                "Instagram",
                `https://instagram.com/${username(
                    data.instagram
                )}`
            );
        }


        if (
            data.tiktok
        ) {

            addSocial(
                "TikTok",
                `https://www.tiktok.com/@${username(
                    data.tiktok
                )}`
            );
        }


        if (
            data.youtube
        ) {

            addSocial(
                "YouTube",
                `https://youtube.com/@${username(
                    data.youtube
                )}`
            );
        }


        if (
            data.telegram
        ) {

            addSocial(
                "Telegram",
                `https://t.me/${username(
                    data.telegram
                )}`
            );
        }


        if (
            data.discord
        ) {

            addSocial(
                "Discord",
                "https://discord.com/"
            );
        }


        /*
         * IMPORTANT FIX
         *
         * Edit My Profile now enters
         * explicit edit mode.
         */

        edit.href =
            `/E-Tag/?tag=${encodeURIComponent(
                tag.tag_code
            )}&edit=1`;


        loading.classList.add(
            "hidden"
        );


        profile.classList.remove(
            "hidden"
        );
    }


    load()
        .catch(
            error => {

                console.error(
                    "Women profile error:",
                    error
                );


                loading.classList.add(
                    "hidden"
                );


                errorBox.textContent =
                    error.message ||
                    "Unable to load profile.";


                errorBox.classList.remove(
                    "hidden"
                );
            }
        );

</script>

</body>

</html>
