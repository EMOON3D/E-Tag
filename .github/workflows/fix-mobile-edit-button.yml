name: Fix Mobile Edit Button

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Men edit button position
        shell: python
        run: |
          from pathlib import Path

          path = Path("themes/men.html")
          text = path.read_text(encoding="utf-8")
          marker = "/* ETAG COVER EDIT BUTTON FIX */"

          css = '''
<style>
/* ETAG COVER EDIT BUTTON FIX */
.bottom {
    position: absolute !important;
    top: 14px !important;
    right: 14px !important;
    left: auto !important;
    bottom: auto !important;
    width: auto !important;
    height: auto !important;
    z-index: 9999 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: flex-end !important;
    padding: 0 !important;
    pointer-events: none !important;
}

.edit-button {
    pointer-events: auto !important;
    position: relative !important;
    z-index: 10000 !important;
    display: inline-flex !important;
    visibility: visible !important;
    min-height: 22px !important;
    padding: 3px 8px !important;
    border-radius: 999px !important;
    background: rgba(255,255,255,.16) !important;
    border: 1px solid rgba(255,255,255,.22) !important;
    color: rgba(37,48,39,.58) !important;
    font-size: 8px !important;
    font-weight: 600 !important;
    opacity: .58 !important;
    box-shadow: none !important;
    backdrop-filter: blur(8px) !important;
    -webkit-backdrop-filter: blur(8px) !important;
}

.edit-button:hover {
    opacity: .78 !important;
    background: rgba(255,255,255,.24) !important;
}

@media (max-width: 600px) {
    .bottom {
        top: max(10px, env(safe-area-inset-top)) !important;
        right: 12px !important;
    }

    .edit-button {
        min-height: 22px !important;
        padding: 3px 8px !important;
        font-size: 8px !important;
        opacity: .58 !important;
    }
}
</style>
'''

          if marker in text:
              start = text.find("<style>\n/* ETAG COVER EDIT BUTTON FIX */")
              end = text.find("</style>", start)
              if start != -1 and end != -1:
                  end += len("</style>")
                  text = text[:start] + css.strip() + text[end:]
              else:
                  text = text.replace("</head>", css + "</head>", 1)
          else:
              text = text.replace("</head>", css + "</head>", 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/men.html
          git commit -m "fix: move edit button onto cover" || exit 0
          git push
