name: Fix Mobile Edit Button

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Men mobile edit button
        shell: python
        run: |
          from pathlib import Path

          path = Path("themes/men.html")
          text = path.read_text(encoding="utf-8")
          marker = "/* ETAG MOBILE EDIT BUTTON FIX */"

          if marker in text:
              print("Already installed.")
              raise SystemExit(0)

          css = '''
<style>
/* ETAG MOBILE EDIT BUTTON FIX */
@media (max-width: 600px) {
    .bottom {
        position: fixed !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        z-index: 9999 !important;
        width: 100% !important;
        height: auto !important;
        min-height: 42px !important;
        display: flex !important;
        align-items: flex-start !important;
        justify-content: center !important;
        padding: 6px 16px max(8px, env(safe-area-inset-bottom)) !important;
        pointer-events: none !important;
        overflow: visible !important;
    }

    .edit-button {
        pointer-events: auto !important;
        position: relative !important;
        z-index: 10000 !important;
        display: inline-flex !important;
        visibility: visible !important;
        opacity: .78 !important;
        min-height: 28px !important;
        padding: 5px 11px !important;
        font-size: 9px !important;
    }
}
</style>
'''

          text = text.replace("</head>", css + "</head>", 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/men.html
          git commit -m "fix: show edit button on mobile" || exit 0
          git push
