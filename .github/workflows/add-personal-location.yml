name: Add Personal Location

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch current dashboard and Men files
        shell: python
        run: |
          from pathlib import Path
          import re

          # -----------------------------
          # dashboard.html
          # -----------------------------
          dashboard = Path("dashboard.html")
          text = dashboard.read_text(encoding="utf-8")

          if 'id="personalLocation"' not in text:
              phone_field_pattern = re.compile(
                  r'(\s*<div class="field">\s*<label>\s*Phone Number\s*</label>\s*<input\s+id="personalPhone"[\s\S]*?</div>)',
                  re.MULTILINE
              )

              addition = r'''\n\n                        <div class="field">\n\n                            <label>\n                                Location\n                            </label>\n\n                            <input\n                                id="personalLocation"\n                                class="input"\n                                type="text"\n                                maxlength="120"\n                                placeholder="Colombo, Sri Lanka"\n                            >\n\n                            <div class="field-help">\n                                Enter your city or location as plain text.\n                            </div>\n\n                        </div>'''

              text, count = phone_field_pattern.subn(
                  lambda m: m.group(1) + addition,
                  text,
                  count=1
              )

              if count != 1:
                  raise SystemExit("Could not find Personal Phone field in dashboard.html")

          if '"personalLocation"' not in text:
              text = text.replace(
                  '"personalPhone",\n        "personalBio",',
                  '"personalPhone",\n        "personalLocation",\n        "personalBio",',
                  1
              )

          if 'getValue(\n                        "personalLocation"' not in text:
              phone_data = '''phone:\n                    getValue(\n                        "personalPhone"\n                    ),'''
              replacement = '''phone:\n                    getValue(\n                        "personalPhone"\n                    ),\n\n\n                location:\n                    getValue(\n                        "personalLocation"\n                    ),'''
              if phone_data not in text:
                  raise SystemExit("Could not find Personal phone data block")
              text = text.replace(phone_data, replacement, 1)

          if '"personalLocation",\n            profile.location' not in text:
              profile_phone = '''setValue(\n            "personalPhone",\n            profile.phone\n        );'''
              profile_replacement = '''setValue(\n            "personalPhone",\n            profile.phone\n        );\n\n\n        setValue(\n            "personalLocation",\n            profile.location\n        );'''
              if profile_phone not in text:
                  raise SystemExit("Could not find Personal phone profile load block")
              text = text.replace(profile_phone, profile_replacement, 1)

          dashboard.write_text(text, encoding="utf-8")

          # -----------------------------
          # themes/men.html
          # -----------------------------
          men = Path("themes/men.html")
          text = men.read_text(encoding="utf-8")

          if 'id="location"' not in text:
              age_marker = re.compile(
                  r'(\s*<div\s+id="age"\s+class="age"\s*>\s*</div>)',
                  re.MULTILINE
              )

              location_html = r'''\n\n            <div\n                id="location"\n                class="location hidden"\n            ></div>'''

              text, count = age_marker.subn(
                  lambda m: m.group(1) + location_html,
                  text,
                  count=1
              )

              if count != 1:
                  raise SystemExit("Could not find Men age element")

          if '.location {' not in text:
              css_marker = '.age {'
              css = '''.location {\n            position: relative;\n            z-index: 1;\n            margin-top: 5px;\n            color: var(--text-soft);\n            font-size: 11px;\n            line-height: 1.3;\n        }\n\n        .location::before {\n            content: "📍";\n            margin-right: 4px;\n        }\n\n        '''
              if css_marker not in text:
                  raise SystemExit("Could not find Men age CSS block")
              text = text.replace(css_marker, css + css_marker, 1)

          if 'const location = document.getElementById("location")' not in text:
              display_marker = 'const displayName = clean(profileData.display_name) || "E-Tag User";'
              location_ref = '''const location = document.getElementById("location");'''
              if display_marker not in text:
                  raise SystemExit("Could not find Men displayName line")
              text = text.replace(display_marker, display_marker + '\n            ' + location_ref, 1)

          if 'location.textContent' not in text:
              age_render = 'age.textContent = profileData.age ? `${profileData.age} years old` : "";'
              location_render = '''age.textContent = profileData.age ? `${profileData.age} years old` : "";\n            location.textContent = clean(profileData.location);\n            location.classList.toggle("hidden", !clean(profileData.location));'''
              if age_render not in text:
                  raise SystemExit("Could not find Men age render line")
              text = text.replace(age_render, location_render, 1)

          men.write_text(text, encoding="utf-8")

      - name: Verify and commit
        shell: python
        run: |
          from pathlib import Path
          dashboard = Path("dashboard.html").read_text(encoding="utf-8")
          men = Path("themes/men.html").read_text(encoding="utf-8")

          required_dashboard = [
              'id="personalLocation"',
              '"personalLocation"',
              '"location"'
          ]

          required_men = [
              'id="location"',
              'profileData.location',
              '.location {'
          ]

          missing_dashboard = [x for x in required_dashboard if x not in dashboard]
          missing_men = [x for x in required_men if x not in men]

          if missing_dashboard or missing_men:
              raise SystemExit(
                  f"Location patch verification failed. dashboard={missing_dashboard}, men={missing_men}"
              )

          print("Personal Location patch verified successfully.")

          import subprocess
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "dashboard.html", "themes/men.html"], check=True)
          result = subprocess.run(["git", "diff", "--cached", "--quiet"])

          if result.returncode == 0:
              print("No changes needed; location patch is already installed.")
              raise SystemExit(0)

          subprocess.run(["git", "commit", "-m", "feat: add personal location field and Men display"], check=True)
          subprocess.run(["git", "push"], check=True)
