name: Remove Opening Hours Section

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-opening-hours:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove Business Opening Hours UI
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("dashboard.html")
          text = path.read_text(encoding="utf-8")
          original = text

          # Remove all previously injected Business Hours CSS/scripts.
          text = re.sub(
              r'<style\b[^>]*\bid=["\'](?:etagBusinessHours|etagBusinessHoursFinal|etagBusinessHoursRepair)[^"\']*["\'][^>]*>.*?</style>\s*',
              '',
              text,
              flags=re.I | re.S,
          )
          text = re.sub(
              r'<script\b[^>]*\bid=["\'](?:etagBusinessHours|etagBusinessHoursFinal|etagBusinessHoursRepair)[^"\']*["\'][^>]*>.*?</script>\s*',
              '',
              text,
              flags=re.I | re.S,
          )

          # Locate the visible field containing #openingHours or #etagBusinessHoursField.
          target_pos = text.find('id="openingHours"')
          if target_pos < 0:
              target_pos = text.find("id='openingHours'")
          if target_pos < 0:
              target_pos = text.find('id="etagBusinessHoursField"')
          if target_pos < 0:
              target_pos = text.find("id='etagBusinessHoursField'")

          if target_pos >= 0:
              div_token = re.compile(r'<div\b[^>]*>|</div\s*>', re.I)
              start = None

              # Find the nearest enclosing .field / Business Hours div before the target.
              candidates = list(re.finditer(r'<div\b[^>]*\bclass=["\'][^"\']*\bfield\b[^"\']*["\'][^>]*>', text[:target_pos], re.I))
              if candidates:
                  start = candidates[-1].start()

              if start is None:
                  candidates = list(re.finditer(r'<div\b[^>]*\bid=["\']etagBusinessHoursField["\'][^>]*>', text[:target_pos], re.I))
                  if candidates:
                      start = candidates[-1].start()

              if start is not None:
                  depth = 0
                  end = None
                  for m in div_token.finditer(text, start):
                      token = m.group(0)
                      if token.lower().startswith('</div'):
                          depth -= 1
                          if depth == 0:
                              end = m.end()
                              break
                      else:
                          depth += 1
                  if end is not None:
                      # Keep a hidden compatibility field outside the removed visible section.
                      hidden = '<textarea id="openingHours" aria-hidden="true" tabindex="-1" style="display:none !important;"></textarea>'
                      text = text[:start] + hidden + text[end:]
                      print("Removed entire Opening Hours field.")
                  else:
                      raise SystemExit("Could not determine Opening Hours field boundary")
              else:
                  raise SystemExit("Could not locate Opening Hours parent field")
          else:
              print("Opening Hours field not found; continuing cleanup.")

          # Remove common stale builder elements/styles by id/class references if any remain.
          text = re.sub(r'\s*<div[^>]*class=["\'][^"\']*business-hours-tools[^"\']*["\'][^>]*>.*?</div>\s*', '', text, flags=re.I|re.S)
          text = re.sub(r'\s*<div[^>]*id=["\']hoursRows["\'][^>]*>.*?</div>\s*', '', text, flags=re.I|re.S)

          if text == original:
              print("No dashboard changes were required.")
          else:
              path.write_text(text, encoding="utf-8")
              print("dashboard.html updated.")

      - name: Remove this one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/remove-opening-hours-section.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: remove Opening Hours section from dashboard"
          git push
