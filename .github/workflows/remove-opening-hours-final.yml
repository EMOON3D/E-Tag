name: Remove Opening Hours Completely

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-opening-hours:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove Business Opening Hours UI and old injectors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('dashboard.html')
          text = path.read_text(encoding='utf-8')

          # Remove previously injected Business Hours styles/scripts.
          text = re.sub(
              r'<style\b[^>]*\bid=["\'](?:etag)?BusinessHours[^"\']*["\'][^>]*>.*?</style>\s*',
              '',
              text,
              flags=re.I | re.S,
          )
          text = re.sub(
              r'<script\b[^>]*\bid=["\'](?:etag)?BusinessHours[^"\']*["\'][^>]*>.*?</script>\s*',
              '',
              text,
              flags=re.I | re.S,
          )

          # Find the actual field containing #openingHours and remove that whole field.
          pos = text.find('id="openingHours"')
          if pos < 0:
              pos = text.find("id='openingHours'")

          if pos >= 0:
              field_start_re = re.compile(
                  r'<div\b[^>]*\bclass=["\'][^"\']*\bfield\b[^"\']*["\'][^>]*>',
                  re.I,
              )
              starts = list(field_start_re.finditer(text, 0, pos))
              if starts:
                  start = starts[-1].start()
                  token_re = re.compile(r'<div\b[^>]*>|</div>', re.I)
                  depth = 0
                  end = None
                  for m in token_re.finditer(text, start):
                      if m.group(0).lower().startswith('</div'):
                          depth -= 1
                          if depth == 0:
                              end = m.end()
                              break
                      else:
                          depth += 1
                  if end is not None:
                      text = text[:start] + text[end:]
                      print('Removed the Opening Hours field.')
                  else:
                      raise SystemExit('Could not determine Opening Hours field boundary')
              else:
                  raise SystemExit('Opening Hours parent field not found')
          else:
              # Also remove any remaining visible label/block if the textarea was already removed.
              text = re.sub(
                  r'<div\b[^>]*\bclass=["\'][^"\']*\bfield\b[^"\']*["\'][^>]*>\s*<label[^>]*>\s*Opening Hours\s*</label>.*?</div>\s*',
                  '',
                  text,
                  count=1,
                  flags=re.I | re.S,
              )
              print('No openingHours element found; cleaned visible Opening Hours field where possible.')

          path.write_text(text, encoding='utf-8')
          PY

          # Remove every old Business/Openings-Hours workflow so it cannot recreate the section.
          find .github/workflows -maxdepth 1 -type f \( \
            -iname '*business*hours*.yml' -o \
            -iname '*opening*hours*.yml' -o \
            -iname '*hours*builder*.yml' \
          \) -print -delete

      - name: Commit removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "fix: remove business opening hours section"
          git push
