name: Restore Dashboard UI and Keep Men Live Preview

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore-dashboard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original dashboard UI and add Men iframe preview
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          PARENT = "110f6965beb85e6f2cf85da40e03052d4d8c92b7"
          path = Path("dashboard.html")

          original = subprocess.check_output(
              ["git", "show", f"{PARENT}:dashboard.html"],
              text=True
          )

          text = original

          if 'id="menPreviewFrame"' not in text:
              text = text.replace(
                  '<div class="preview-shell">',
                  '''<div class="preview-shell">

                    <iframe
                        id="menPreviewFrame"
                        class="men-preview-frame"
                        title="Men theme live preview"
                        src="/E-Tag/themes/men.html?preview=1"
                        loading="eager"
                    ></iframe>''',
                  1
              )

          style = r'''

        .men-preview-frame {
            display: block;
            width: 100%;
            height: 760px;
            min-height: 620px;
            border: 0;
            border-radius: 20px;
            background: transparent;
        }

        .preview {
            display: none !important;
        }
'''

          if ".men-preview-frame" not in text:
              text = text.replace(
                  "    </style>",
                  style + "\n    </style>",
                  1
              )

          marker = "    const previewContent ="
          if "const previewFrameElement =" not in text:
              insert_after = '''    const previewFrameElement =\n        document.getElementById(\n            "menPreviewFrame"\n        );\n\n\n'''
              pos = text.find(marker)
              if pos == -1:
                  raise SystemExit("Preview declarations marker not found.")
              text = text[:pos] + insert_after + text[pos:]

          send_function = r'''

    function sendMenPreview() {

        if (!previewFrameElement) {
            return;
        }

        const personalPreview = {
            display_name: getValue("personalName"),
            age: getValue("age") ? Number(getValue("age")) : null,
            phone: getValue("personalPhone"),
            bio: getValue("personalBio"),
            facebook: getValue("facebook"),
            instagram: getValue("instagram"),
            tiktok: getValue("tiktok"),
            youtube: getValue("youtube"),
            whatsapp: getValue("personalWhatsapp"),
            discord: getValue("discord"),
            telegram: getValue("telegram"),
            avatar_type: avatarType,
            character_id:
                avatarType === "character" ? characterId : null,
            avatar_url:
                avatarType === "upload" ? (currentAvatarUrl || null) : null
        };

        previewFrameElement.contentWindow?.postMessage(
            {
                type: "etag-men-preview",
                profile: personalPreview
            },
            "*"
        );
    }
'''

          if "function sendMenPreview()" not in text:
              needle = "    function updatePreview() {"
              if needle not in text:
                  raise SystemExit("updatePreview marker not found.")
              text = text.replace(needle, send_function + "\n\n" + needle, 1)

          text = text.replace(
              "    function updatePreview() {\n",
              "    function updatePreview() {\n\n        sendMenPreview();\n",
              1
          )

          listener = r'''

    if (previewFrameElement) {
        previewFrameElement.addEventListener(
            "load",
            () => {
                sendMenPreview();
            }
        );
    }
'''

          if "previewFrameElement.addEventListener" not in text:
              needle = "    /*\n     * SAVE\n     */"
              if needle not in text:
                  raise SystemExit("SAVE marker not found.")
              text = text.replace(needle, listener + "\n\n\n" + needle, 1)

          path.write_text(text, encoding="utf-8")

      - name: Remove temporary preview workflows
        shell: bash
        run: |
          rm -f .github/workflows/restore-dashboard-ui.yml
          rm -f .github/workflows/patch-men-preview-support.yml

      - name: Commit restored UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html .github/workflows/restore-dashboard-ui.yml .github/workflows/patch-men-preview-support.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Restore dashboard UI and keep Men live preview"
          git push

# trigger-restore