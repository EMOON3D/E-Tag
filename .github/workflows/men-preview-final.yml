name: Men Preview Final Patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-men:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact Men design and add preview bridge
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          path = Path('themes/men.html')

          exact = subprocess.check_output(
              [
                  'git',
                  'show',
                  '94139cf01127c39620b60c2eb2e3c6255bc54972:themes/men.html'
              ],
              text=True,
          )

          marker = '/* E-TAG MEN LIVE PREVIEW */'

          if marker not in exact:
              bridge = r'''

    /* E-TAG MEN LIVE PREVIEW */

    const isPreviewMode =
        new URLSearchParams(
            window.location.search
        ).get('preview') === '1';


    function renderPreviewProfile(
        profileData
    ) {

        const data =
            profileData || {};

        name.textContent =
            clean(data.display_name) ||
            'E-Tag User';

        age.textContent =
            data.age
                ? `${data.age} years old`
                : '';

        bio.textContent =
            clean(data.bio);

        renderAvatar(
            avatar,
            data
        );

        contacts.innerHTML =
            '';

        if (data.phone) {
            addContact(
                'Call',
                'Call Me',
                `tel:${encodeURIComponent(data.phone)}`,
                ICONS.call
            );
        }

        if (data.whatsapp) {
            const number =
                clean(data.whatsapp).replace(/\D/g, '');

            if (number) {
                addContact(
                    'WhatsApp',
                    'WhatsApp Me',
                    `https://wa.me/${number}`,
                    ICONS.whatsapp
                );
            }
        }

        if (data.email) {
            addContact(
                'Email',
                'Email Me',
                `mailto:${encodeURIComponent(data.email)}`,
                ICONS.email
            );
        }

        if (contacts.children.length === 0) {
            contactSection.classList.add('hidden');
        } else {
            contactSection.classList.remove('hidden');
        }

        socialData.length =
            0;

        const socialFields = [
            ['Facebook', 'facebook', ICONS.facebook],
            ['Instagram', 'instagram', ICONS.instagram],
            ['TikTok', 'tiktok', ICONS.tiktok],
            ['YouTube', 'youtube', ICONS.youtube],
            ['Telegram', 'telegram', ICONS.telegram],
            ['Discord', 'discord', ICONS.discord],
            ['LinkedIn', 'linkedin', ICONS.linkedin]
        ];

        socialFields.forEach(
            ([platformName, fieldName, iconUrl]) => {

                const value =
                    clean(data[fieldName]);

                if (!value) {
                    return;
                }

                addSocial(
                    platformName,
                    `@${username(value)}`,
                    value,
                    iconUrl
                );
            }
        );

        buildSocialCarousel();

        editButton.classList.add('hidden');
        loading.classList.add('hidden');
        errorBox.classList.add('hidden');
        profile.classList.remove('hidden');
    }


    if (isPreviewMode) {

        window.addEventListener(
            'message',
            event => {

                if (
                    event.origin !==
                    window.location.origin
                ) {
                    return;
                }

                if (
                    event.data?.type !==
                    'etag-dashboard-preview'
                ) {
                    return;
                }

                renderPreviewProfile(
                    event.data.profile || {}
                );
            }
        );

        loading.textContent =
            'Loading preview...';

        window.parent.postMessage(
            {
                type: 'etag-men-preview-ready'
            },
            window.location.origin
        );

    }

'''

              load_marker = '    load();\n\n</script>'

              if load_marker not in exact:
                  raise SystemExit('Men load marker not found')

              exact = exact.replace(
                  load_marker,
                  bridge +
                  "    if (!isPreviewMode) {\n\n        load();\n\n    }\n\n</script>",
                  1,
              )

          path.write_text(exact, encoding='utf-8')

      - name: Commit Men theme
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add themes/men.html
          if git diff --cached --quiet; then
            echo 'Men theme already patched.'
            exit 0
          fi
          git commit -m 'Restore exact Men design and fix live preview'
          git push
