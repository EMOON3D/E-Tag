name: Update Dashboard Men Preview

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-dashboard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore old dashboard and patch preview only
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          path = Path("dashboard.html")

          dashboard = subprocess.check_output(
              ["git", "show", "110f6965:dashboard.html"],
              text=True
          )

          preview_old = '''                <div class="preview-shell">

                    <div class="preview">

                        <div class="preview-top">

                            <div
                                id="previewAvatar"
                                class="preview-avatar"
                            ></div>


                            <h1
                                id="previewName"
                                class="preview-name"
                            >
                                E-Tag User
                            </h1>


                            <div
                                id="previewType"
                                class="preview-type"
                            >
                                Personal · Men
                            </div>


                            <p
                                id="previewBio"
                                class="preview-bio"
                            ></p>

                        </div>


                        <div
                            id="previewContent"
                            class="preview-content"
                        ></div>

                    </div>

                </div>'''

          preview_new = '''                <div class="preview-shell">

                    <div class="theme-preview-frame">

                        <iframe
                            id="themePreviewFrame"
                            title="E-Tag Men Public Profile Preview"
                            scrolling="no"
                            frameborder="0"
                        ></iframe>

                    </div>

                </div>'''

          if preview_old not in dashboard:
              raise SystemExit("Original dashboard preview block was not found.")

          dashboard = dashboard.replace(preview_old, preview_new, 1)

          css_marker = '''        .preview-shell {
            padding: 14px;

            min-height: 520px;

            border-radius: 18px;

            background: #f5f7fb;
        }
'''

          css_add = css_marker + '''
        .theme-preview-frame {
            width: 100%;
            height: 680px;
            overflow: hidden;
            border-radius: 26px;
            background: transparent;
        }

        #themePreviewFrame {
            width: 100%;
            height: 100%;
            display: block;
            border: 0;
            background: transparent;
        }
'''

          if css_marker not in dashboard:
              raise SystemExit("Dashboard preview CSS marker was not found.")

          dashboard = dashboard.replace(css_marker, css_add, 1)

          mobile_marker = '''            .button-row {
                flex-direction: column;
            }

        }
'''

          mobile_add = '''            .button-row {
                flex-direction: column;
            }

            .theme-preview-frame {
                height: 720px;
            }

        }
'''

          if mobile_marker not in dashboard:
              raise SystemExit("Dashboard mobile marker was not found.")

          dashboard = dashboard.replace(mobile_marker, mobile_add, 1)

          old_open = '''            openPublicButton.onclick =
                () => {

                    const publicUrl =
                        `${window.location.origin}/E-Tag/?tag=${encodeURIComponent(
                            currentTag.tag_code
                        )}`;


                    window.open(
                        publicUrl,
                        "_blank",
                        "noopener,noreferrer"
                    );

                };
'''

          new_open = '''            const publicUrl =
                `${window.location.origin}/E-Tag/?tag=${encodeURIComponent(
                    currentTag.tag_code
                )}`;


            openPublicButton.onclick =
                () => {

                    window.open(
                        publicUrl,
                        "_blank",
                        "noopener,noreferrer"
                    );

                };


            const themePreviewFrame =
                document.getElementById(
                    "themePreviewFrame"
                );


            if (themePreviewFrame) {

                themePreviewFrame.src =
                    `/E-Tag/themes/men.html?tag=${encodeURIComponent(
                        currentTag.tag_code
                    )}`;

            }
'''

          if old_open not in dashboard:
              raise SystemExit("Open Public Profile block was not found.")

          dashboard = dashboard.replace(old_open, new_open, 1)

          old_save_success = '''            showMessage(
                "Profile saved successfully.",
                "success"
            );
'''

          new_save_success = '''            const themePreviewFrame =
                document.getElementById(
                    "themePreviewFrame"
                );


            if (themePreviewFrame) {

                themePreviewFrame.src =
                    "about:blank";


                setTimeout(
                    () => {

                        themePreviewFrame.src =
                            `/E-Tag/themes/men.html?tag=${encodeURIComponent(
                                currentTag.tag_code
                            )}&previewRefresh=${Date.now()}`;

                    },
                    30
                );

            }


            showMessage(
                "Profile saved successfully.",
                "success"
            );
'''

          if old_save_success not in dashboard:
              raise SystemExit("Save success marker was not found.")

          dashboard = dashboard.replace(old_save_success, new_save_success, 1)

          path.write_text(dashboard, encoding="utf-8")

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/update-dashboard-men-preview.yml

      - name: Commit dashboard only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html .github/workflows/update-dashboard-men-preview.yml
          if git diff --cached --quiet; then
            echo "No dashboard changes found."
            exit 0
          fi
          git commit -m "Restore dashboard UI and use exact Men public preview"
          git push
