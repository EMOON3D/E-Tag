name: Restore Exact Men Design

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore-men:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact Men design
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          path = Path("themes/men.html")
          exact = subprocess.check_output(
              [
                  "git",
                  "show",
                  "94139cf01127c39620b60c2eb2e3c6255bc54972:themes/men.html"
              ],
              text=True
          )

          # Keep the exact visual/design source and only add the
          # technical preview bridge required by dashboard.html.
          if "etag-men-preview" not in exact:
              injection = r'''

    /* =========================================================
       DASHBOARD LIVE PREVIEW BRIDGE
       Visual design remains unchanged.
    ========================================================= */

    const isPreviewMode =
        new URLSearchParams(
            window.location.search
        ).get("preview") === "1";


    function renderPreviewProfile(
        profileData
    ) {

        const data =
            profileData || {};

        name.textContent =
            clean(data.display_name) ||
            "E-Tag User";

        age.textContent =
            data.age
                ? `${data.age} years old`
                : "";

        bio.textContent =
            clean(data.bio);

        renderAvatar(
            avatar,
            data
        );

        contacts.innerHTML =
            "";

        if (data.phone) {
            addContact(
                "Call",
                "Call Me",
                `tel:${encodeURIComponent(data.phone)}`,
                ICONS.call
            );
        }

        if (data.whatsapp) {

            const number =
                clean(data.whatsapp)
                    .replace(/\D/g, "");

            if (number) {
                addContact(
                    "WhatsApp",
                    "WhatsApp Me",
                    `https://wa.me/${number}`,
                    ICONS.whatsapp
                );
            }
        }

        if (data.email) {
            addContact(
                "Email",
                "Email Me",
                `mailto:${encodeURIComponent(data.email)}`,
                ICONS.email
            );
        }

        if (
            contacts.children.length === 0
        ) {
            contactSection.classList.add(
                "hidden"
            );
        } else {
            contactSection.classList.remove(
                "hidden"
            );
        }

        socialData.length =
            0;

        const socialFields = [
            ["Facebook", "facebook", ICONS.facebook],
            ["Instagram", "instagram", ICONS.instagram],
            ["TikTok", "tiktok", ICONS.tiktok],
            ["YouTube", "youtube", ICONS.youtube],
            ["Telegram", "telegram", ICONS.telegram],
            ["Discord", "discord", ICONS.discord],
            ["LinkedIn", "linkedin", ICONS.linkedin]
        ];

        socialFields.forEach(
            ([platformName, fieldName, iconUrl]) => {

                const value =
                    clean(data[fieldName]);

                if (!value) {
                    return;
                }

                addSocial(
                    platformName,
                    `@${username(value)}`,
                    value,
                    iconUrl
                );
            }
        );

        buildSocialCarousel();

        editButton.classList.add(
            "hidden"
        );

        loading.classList.add(
            "hidden"
        );

        errorBox.classList.add(
            "hidden"
        );

        profile.classList.remove(
            "hidden"
        );
    }


    if (isPreviewMode) {

        window.addEventListener(
            "message",
            event => {

                if (
                    event.origin !==
                    window.location.origin
                ) {
                    return;
                }

                if (
                    event.data?.type !==
                    "etag-men-preview"
                ) {
                    return;
                }

                renderPreviewProfile(
                    event.data.profile || {}
                );
            }
        );

        loading.textContent =
            "Loading preview...";

        window.parent.postMessage(
            {
                type:
                    "etag-men-preview-ready"
            },
            window.location.origin
        );
    }

'''

              marker = "    load();\n\n</script>"

              if marker not in exact:
                  raise SystemExit(
                      "Expected Men load marker was not found."
                  )

              exact = exact.replace(
                  marker,
                  injection +
                  "    if (!isPreviewMode) {\n\n        load();\n\n    }\n\n</script>",
                  1
              )

          path.write_text(
              exact,
              encoding="utf-8"
          )

      - name: Remove temporary Men preview patch workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-men-preview.yml

      - name: Commit exact Men restoration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/men.html .github/workflows/patch-men-preview.yml .github/workflows/restore-men-exact-design.yml
          git commit -m "Restore exact Men profile design and preview bridge"
          git push
