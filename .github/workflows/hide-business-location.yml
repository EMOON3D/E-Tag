name: Hide Business Location Text

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hide visible Business location text only
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("themes/business.html")
          text = path.read_text(encoding="utf-8")

          # Keep the existing #location element and all profile logic intact.
          # Only hide the visible address text from the public Business profile.
          style = '''\n<style id="etagBusinessHideLocationText">\n#location {\n    display: none !important;\n}\n</style>\n'''

          if 'id="etagBusinessHideLocationText"' not in text:
              text = text.replace('</head>', style + '</head>', 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/business.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "hide: remove business location text from public profile"
          git push
