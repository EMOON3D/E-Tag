name: Fix Business Google Maps Location

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Business theme
        shell: python
        run: |
          from pathlib import Path

          path = Path("themes/business.html")
          text = path.read_text(encoding="utf-8")

          old = '<div id="location" class="location"></div>'
          new = '<a id="location" class="location business-google-map-location" href="#" target="_blank" rel="noopener noreferrer"></a>'

          if old in text:
              text = text.replace(old, new, 1)

          css = r'''
<style id="etagBusinessGoogleMapLocationFix">
.business-google-map-location {
    display: none;
    width: 100%;
    min-height: clamp(45px,6.3vh,60px);
    margin-top: 8px;
    align-items: center;
    justify-content: center;
    padding: 7px 14px;
    border: 1px solid var(--main-border);
    border-radius: 16px;
    background: linear-gradient(100deg,rgba(255,255,255,.48),rgba(211,219,200,.68));
    box-shadow: 0 7px 18px rgba(54,67,56,.10);
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.business-google-map-location.is-visible {
    display: flex !important;
}
</style>
'''

          if 'id="etagBusinessGoogleMapLocationFix"' not in text:
              text = text.replace('</head>', css + '</head>', 1)

          js = r'''
<script id="etagBusinessGoogleMapLocationRuntime">
(() => {
    const run = () => {
        const locationElement = document.getElementById("location");
        const mapLink = document.querySelector("#businessLinks a.business-link[href]");

        if (!locationElement) return;

        if (mapLink && mapLink.href) {
            locationElement.textContent = "Google Maps";
            locationElement.href = mapLink.href;
            locationElement.classList.add("is-visible");

            mapLink.style.display = "none";
        } else {
            locationElement.textContent = "";
            locationElement.removeAttribute("href");
            locationElement.classList.remove("is-visible");
        }
    };

    let attempts = 0;
    const timer = setInterval(() => {
        run();
        attempts += 1;
        if (attempts >= 40) clearInterval(timer);
    }, 250);

    window.addEventListener("load", run, { once: true });
})();
</script>
'''

          if 'id="etagBusinessGoogleMapLocationRuntime"' not in text:
              text = text.replace('</body>', js + '</body>', 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/business.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Use Google Maps link in Business contact location row"
          git push
