name: Patch Men Theme Preview Support

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-men-theme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add preview support to Men theme
        shell: python
        run: |
          from pathlib import Path

          path = Path('themes/men.html')
          text = path.read_text(encoding='utf-8')

          marker = '/* E-TAG MEN PREVIEW SUPPORT */'

          if marker in text:
              print('Men preview support already exists.')
              raise SystemExit(0)

          injection = r'''/* E-TAG MEN PREVIEW SUPPORT */

    function renderPreviewProfile(profileData) {

        const data = profileData || {};

        const displayName =
            clean(data.display_name) ||
            "E-Tag User";

        name.textContent =
            displayName;

        age.textContent =
            data.age
                ? `${data.age} years old`
                : "";

        bio.textContent =
            clean(data.bio);

        renderAvatar(
            avatar,
            data
        );

        contacts.innerHTML =
            "";

        if (data.phone) {
            addContact(
                "Call",
                "Call Me",
                `tel:${encodeURIComponent(data.phone)}`,
                ICONS.call
            );
        }

        if (data.whatsapp) {
            const number =
                clean(data.whatsapp).replace(/\D/g, "");

            if (number) {
                addContact(
                    "WhatsApp",
                    "WhatsApp Me",
                    `https://wa.me/${number}`,
                    ICONS.whatsapp
                );
            }
        }

        if (data.email) {
            addContact(
                "Email",
                "Email Me",
                `mailto:${encodeURIComponent(data.email)}`,
                ICONS.email
            );
        }

        if (contacts.children.length === 0) {
            contactSection.classList.add("hidden");
        } else {
            contactSection.classList.remove("hidden");
        }

        socialData.length = 0;

        const socialFields = [
            ["Facebook", "facebook", ICONS.facebook],
            ["Instagram", "instagram", ICONS.instagram],
            ["TikTok", "tiktok", ICONS.tiktok],
            ["YouTube", "youtube", ICONS.youtube],
            ["Telegram", "telegram", ICONS.telegram],
            ["Discord", "discord", ICONS.discord],
            ["LinkedIn", "linkedin", ICONS.linkedin]
        ];

        socialFields.forEach(
            ([platformName, fieldName, iconUrl]) => {

                const value =
                    clean(data[fieldName]);

                if (!value) {
                    return;
                }

                const user =
                    username(value);

                addSocial(
                    platformName,
                    `@${user}`,
                    value,
                    iconUrl
                );
            }
        );

        buildSocialCarousel();

        editButton.classList.add("hidden");

        loading.classList.add("hidden");
        errorBox.classList.add("hidden");
        profile.classList.remove("hidden");
    }


    function receivePreviewMessage(event) {

        if (!event.data) {
            return;
        }

        if (
            event.data.type !==
            "etag-men-preview"
        ) {
            return;
        }

        renderPreviewProfile(
            event.data.profile || {}
        );
    }


    const isPreviewMode =
        new URLSearchParams(
            window.location.search
        ).get("preview") === "1";


    if (isPreviewMode) {

        window.addEventListener(
            "message",
            receivePreviewMessage
        );

        loading.textContent =
            "Loading preview...";

        window.parent.postMessage(
            {
                type: "etag-men-preview-ready"
            },
            "*"
        );

    }

'''

          needle = '    load();\n\n</script>'

          if needle not in text:
              raise SystemExit('Could not find Men theme load marker.')

          replacement = injection + '''    if (!isPreviewMode) {

        load();

    }

</script>'''

          text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit Men theme preview support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/men.html
          if git diff --cached --quiet; then
            echo "No Men theme changes needed."
            exit 0
          fi
          git commit -m "Add Men theme live preview support"
          git push
