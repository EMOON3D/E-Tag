name: Business Hours Modes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Business Hours mode selector and day controls
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("dashboard.html")
          text = path.read_text(encoding="utf-8")

          css = r'''
<style id="etagBusinessHoursModesStyle">
#businessHoursBuilder.etag-hours-rebuilt{
    border:1px solid #e5e7eb!important;
    border-radius:16px!important;
    background:#f9fafb!important;
    padding:14px!important;
}
#businessHoursBuilder.etag-hours-rebuilt .business-hours-tools{display:none!important}
.etag-hours-mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.etag-hours-mode{border:2px solid #e5e7eb;background:#fff;border-radius:12px;padding:11px 10px;text-align:left;cursor:pointer;font:inherit;color:#111827;min-height:72px}
.etag-hours-mode.active{border-color:#111827;background:#f3f4f6}
.etag-hours-mode-title{font-size:13px;font-weight:800;display:block;margin-bottom:4px}
.etag-hours-mode-help{font-size:11px;color:#6b7280;line-height:1.35;display:block}
.etag-hours-days{display:grid;gap:8px}
.etag-hours-day{border:1px solid #e5e7eb;border-radius:12px;background:#fff;padding:10px}
.etag-hours-day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.etag-hours-day-name{font-size:13px;font-weight:800}
.etag-hours-toggle{position:relative;width:48px;height:28px;flex:0 0 48px}
.etag-hours-toggle input{position:absolute;opacity:0;pointer-events:none}
.etag-hours-toggle span{position:absolute;inset:0;background:#d1d5db;border-radius:999px;cursor:pointer;transition:.18s}
.etag-hours-toggle span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:.18s}
.etag-hours-toggle input:checked+span{background:#111827}
.etag-hours-toggle input:checked+span:before{transform:translateX(20px)}
.etag-hours-times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.etag-hours-times label{font-size:10px;color:#6b7280;font-weight:700;display:block;margin-bottom:4px}
.etag-hours-times input{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:9px 10px;background:#fff;color:#111827;font:inherit;font-size:13px}
.etag-hours-extra{display:none}
.etag-hours-mode-selected .etag-hours-extra{display:block;margin-top:8px;color:#6b7280;font-size:11px}
.etag-hours-note{margin-top:9px;color:#6b7280;font-size:11px;line-height:1.4}
.etag-hours-hidden{display:none!important}
@media(max-width:700px){.etag-hours-mode-grid{grid-template-columns:1fr}.etag-hours-mode{min-height:auto}.etag-hours-times{grid-template-columns:1fr 1fr}}
</style>
'''

          js = r'''
<script id="etagBusinessHoursModesScript">
(function(){
    'use strict';

    function init(){
        const builder=document.getElementById('businessHoursBuilder');
        const legacy=document.getElementById('openingHours');
        if(!builder || !legacy) return;

        builder.classList.add('etag-hours-rebuilt');
        builder.innerHTML='';

        const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
        const state={
            mode:'selected',
            days:{}
        };

        days.forEach(function(day){
            state.days[day]={
                enabled:false,
                open:'09:00',
                close:'17:00'
            };
        });

        function parseTime(value){
            const m=String(value||'').trim().match(/^(\\d{1,2}):(\\d{2})\\s*(AM|PM)?$/i);
            if(!m) return '';
            let h=Number(m[1]);
            const min=m[2];
            const ap=m[3] ? m[3].toUpperCase() : null;
            if(ap==='AM') h=h===12?0:h;
            if(ap==='PM') h=h===12?12:h+12;
            if(h<0 || h>23 || Number(min)>59) return '';
            return String(h).padStart(2,'0')+':'+min;
        }

        function parseExisting(value){
            const raw=String(value||'').trim();
            if(/^appointments\\s*only$/i.test(raw) || /appointments?\\s+only/i.test(raw)) state.mode='appointments';
            else if(/always\\s+open/i.test(raw)) state.mode='always';
            else state.mode='selected';

            raw.split(/\\r?\\n/).forEach(function(line){
                const m=line.match(/^\\s*(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\\s*:\\s*(.*?)\\s*$/i);
                if(!m) return;
                const day=days.find(function(d){return d.toLowerCase()===m[1].toLowerCase();});
                if(!day) return;
                const v=m[2].trim();
                if(/^closed$/i.test(v)){
                    state.days[day].enabled=false;
                    return;
                }
                if(/appointments?\\s+only/i.test(v)){
                    state.mode='appointments';
                    state.days[day].enabled=true;
                    return;
                }
                if(/24\\s*hours?/i.test(v)){
                    state.mode='always';
                    state.days[day].enabled=true;
                    return;
                }
                const range=v.split(' | ')[0].match(/^(.+?)\\s*-\\s*(.+)$/);
                if(range){
                    state.mode='selected';
                    state.days[day].enabled=true;
                    state.days[day].open=parseTime(range[1])||'09:00';
                    state.days[day].close=parseTime(range[2])||'17:00';
                }
            });
        }

        parseExisting(legacy.value);

        const modeGrid=document.createElement('div');
        modeGrid.className='etag-hours-mode-grid';
        modeGrid.innerHTML=`
            <button type="button" class="etag-hours-mode" data-mode="selected">
                <span class="etag-hours-mode-title">Open for selected hours</span>
                <span class="etag-hours-mode-help">Choose opening and closing times for each day.</span>
            </button>
            <button type="button" class="etag-hours-mode" data-mode="always">
                <span class="etag-hours-mode-title">Always open</span>
                <span class="etag-hours-mode-help">Choose which days are available. Selected days are open 24 hours.</span>
            </button>
            <button type="button" class="etag-hours-mode" data-mode="appointments">
                <span class="etag-hours-mode-title">Appointments only</span>
                <span class="etag-hours-mode-help">Choose which days accept appointments.</span>
            </button>`;

        const daysWrap=document.createElement('div');
        daysWrap.className='etag-hours-days';
        builder.appendChild(modeGrid);
        builder.appendChild(daysWrap);

        function serialize(){
            if(state.mode==='always'){
                return days.map(function(day){
                    return day+': '+(state.days[day].enabled?'24 Hours':'Closed');
                }).join('\\n');
            }
            if(state.mode==='appointments'){
                return days.map(function(day){
                    return day+': '+(state.days[day].enabled?'Appointments only':'Closed');
                }).join('\\n');
            }
            return days.map(function(day){
                const d=state.days[day];
                return day+': '+(d.enabled ? d.open+' - '+d.close : 'Closed');
            }).join('\\n');
        }

        function sync(){
            legacy.value=serialize();
        }

        function render(){
            modeGrid.querySelectorAll('.etag-hours-mode').forEach(function(btn){
                btn.classList.toggle('active',btn.dataset.mode===state.mode);
            });
            daysWrap.innerHTML='';
            days.forEach(function(day){
                const d=state.days[day];
                const row=document.createElement('div');
                row.className='etag-hours-day'+(d.enabled?' etag-hours-mode-selected':'');
                row.innerHTML=`
                    <div class="etag-hours-day-head">
                        <span class="etag-hours-day-name">${day}</span>
                        <label class="etag-hours-toggle">
                            <input type="checkbox" ${d.enabled?'checked':''} aria-label="${day} available">
                            <span></span>
                        </label>
                    </div>
                    <div class="etag-hours-times ${state.mode==='selected'?'':'etag-hours-hidden'}">
                        <div><label>Opening time</label><input class="etag-open" type="time" value="${d.open}"></div>
                        <div><label>Closing time</label><input class="etag-close" type="time" value="${d.close}"></div>
                    </div>
                    <div class="etag-hours-extra">
                        ${state.mode==='always'?'Selected day = Open 24 hours.': 'Selected day = '+(state.mode==='appointments'?'appointments available.':'hours available.')}
                    </div>`;

                const toggle=row.querySelector('input[type="checkbox"]');
                const open=row.querySelector('.etag-open');
                const close=row.querySelector('.etag-close');
                toggle.addEventListener('change',function(){
                    d.enabled=toggle.checked;
                    render();
                    sync();
                });
                if(open){open.addEventListener('change',function(){d.open=open.value;sync();});}
                if(close){close.addEventListener('change',function(){d.close=close.value;sync();});}
                daysWrap.appendChild(row);
            });
            sync();
        }

        modeGrid.addEventListener('click',function(event){
            const btn=event.target.closest('.etag-hours-mode');
            if(!btn) return;
            state.mode=btn.dataset.mode;
            render();
        });

        // Keep hidden legacy field current right before save.
        document.addEventListener('click',function(event){
            const button=event.target.closest && event.target.closest('button');
            if(!button) return;
            const text=(button.textContent||'').trim().toLowerCase();
            if(text.includes('save')) sync();
        },true);

        render();
    }

    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){setTimeout(init,50);},{once:true});
    else setTimeout(init,50);
})();
</script>
'''

          if 'id="etagBusinessHoursModesStyle"' not in text:
              text=text.replace('</head>',css+'</head>',1)
          if 'id="etagBusinessHoursModesScript"' not in text:
              text=text.replace('</body>',js+'</body>',1)

          path.write_text(text,encoding='utf-8')
          print('Business Hours 3-mode UI added.')

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "feat: add business hours modes"
          git push
