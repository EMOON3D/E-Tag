name: Apply Full Theme Color Customization

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-theme-colors:
    if: >-
      !contains(github.event.head_commit.message, 'Apply full visual theme colors')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch dashboard and Men theme
        shell: bash
        run: |
          python3 .github/scripts/apply_full_theme_colors.py

      - name: Commit applied changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html themes/men.html .github/scripts/apply_full_theme_colors.py .github/workflows/apply-full-theme-colors.yml
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Apply full visual theme colors"
          git push origin main
