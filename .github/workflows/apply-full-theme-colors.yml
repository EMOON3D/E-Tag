name: Apply Full Theme Color Customization

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  apply-theme-colors:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply full visual theme colors
        run: python3 .github/scripts/apply_full_theme_colors.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html themes/men.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply full visual theme colors"
            git push origin main
          fi
