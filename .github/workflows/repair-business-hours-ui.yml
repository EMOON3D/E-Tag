name: Repair Business Hours UI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install final Business Hours UI
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("dashboard.html")
          text = path.read_text(encoding="utf-8")

          if 'id="etagBusinessHoursRepair"' in text:
              print("Business Hours repair already installed")
              raise SystemExit(0)

          css = r'''
<style id="etagBusinessHoursRepairStyle">
/* Final Business Hours builder */
.business-hours-field .business-hours-tools,
.business-hours-field .hours-note,
.business-hours-field #copyHoursToAll,
.business-hours-field #clearAllHours {
    display: none !important;
}
#businessHoursBuilder {
    display: block !important;
    width: 100% !important;
    border: 1px solid #e5e7eb !important;
    border-radius: 16px !important;
    background: #f9fafb !important;
    padding: 12px !important;
}
#hoursRows {
    display: grid !important;
    gap: 10px !important;
}
.etag-hours-row {
    border: 1px solid #e5e7eb;
    border-radius: 13px;
    background: #fff;
    padding: 12px;
}
.etag-hours-day {
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 9px;
}
.etag-hours-status,
.etag-hours-times,
.etag-hours-second-times {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}
.etag-hours-status {
    margin-bottom: 8px;
}
.etag-hours-row select,
.etag-hours-row input[type="time"] {
    width: 100%;
    min-width: 0;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 10px 11px;
    background: #fff;
    color: #111827;
    font: inherit;
    font-size: 13px;
}
.etag-hours-label {
    color: #6b7280;
    font-size: 11px;
    margin: 2px 0 4px;
}
.etag-hours-extra {
    margin-top: 8px;
}
.etag-hours-second {
    display: none;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #eef0f3;
}
.etag-hours-row.has-second .etag-hours-second {
    display: block;
}
.etag-hours-add-second {
    border: 1px solid #d1d5db;
    background: #fff;
    color: #374151;
    border-radius: 10px;
    padding: 8px 10px;
    font: inherit;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
}
.etag-hours-add-second:disabled {
    opacity: .5;
    cursor: not-allowed;
}
#openingHours {
    display: none !important;
}
@media (max-width: 600px) {
    .etag-hours-status,
    .etag-hours-times,
    .etag-hours-second-times {
        grid-template-columns: 1fr 1fr;
    }
}
</style>
'''

          js = r'''
<script id="etagBusinessHoursRepair">
(function () {
    "use strict";

    function boot() {
        const legacy = document.getElementById("openingHours");
        const builder = document.getElementById("businessHoursBuilder");
        if (!legacy || !builder) return;

        document.querySelectorAll(
            ".business-hours-field .business-hours-tools, " +
            ".business-hours-field .hours-note, " +
            "#copyHoursToAll, #clearAllHours"
        ).forEach(function (el) { el.remove(); });

        let rows = document.getElementById("hoursRows");
        if (!rows) {
            rows = document.createElement("div");
            rows.id = "hoursRows";
            rows.className = "hours-rows";
            builder.appendChild(rows);
        }

        const days = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
        let state = {};
        days.forEach(function (day) {
            state[day] = {
                status: "closed",
                open: "09:00",
                close: "17:00",
                second: false,
                secondOpen: "14:00",
                secondClose: "18:00"
            };
        });

        function to24(value) {
            const m = String(value || "").trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?$/i);
            if (!m) return "";
            let h = Number(m[1]);
            const min = m[2] || "00";
            const ap = m[3] ? m[3].toUpperCase() : "";
            if (ap === "AM") h = h === 12 ? 0 : h;
            if (ap === "PM") h = h === 12 ? 12 : h + 12;
            if (h < 0 || h > 23 || Number(min) < 0 || Number(min) > 59) return "";
            return String(h).padStart(2,"0") + ":" + String(min).padStart(2,"0");
        }

        function from24(value) {
            const m = String(value || "").match(/^(\d{2}):(\d{2})$/);
            if (!m) return "";
            let h = Number(m[1]);
            const ap = h >= 12 ? "PM" : "AM";
            h = h % 12 || 12;
            return String(h) + ":" + m[2] + " " + ap;
        }

        function parse(value) {
            const next = {};
            days.forEach(function (day) {
                next[day] = {
                    status: "closed",
                    open: "09:00",
                    close: "17:00",
                    second: false,
                    secondOpen: "14:00",
                    secondClose: "18:00"
                };
            });

            String(value || "").split(/\r?\n/).forEach(function (line) {
                const match = line.match(/^\s*(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\s*:\s*(.*?)\s*$/i);
                if (!match) return;
                const day = days.find(function (d) { return d.toLowerCase() === match[1].toLowerCase(); });
                if (!day) return;
                const valuePart = match[2].trim();
                const target = next[day];

                if (/^closed$/i.test(valuePart)) {
                    target.status = "closed";
                    return;
                }
                if (/^24\s*hours?$/i.test(valuePart)) {
                    target.status = "24";
                    return;
                }

                const ranges = valuePart.split(/\s*\|\s*|\s*,\s*/);
                const first = ranges[0].match(/^(.+?)\s*-\s*(.+)$/);
                if (!first) return;
                const firstOpen = to24(first[1]);
                const firstClose = to24(first[2]);
                if (!firstOpen || !firstClose) return;
                target.status = "open";
                target.open = firstOpen;
                target.close = firstClose;

                if (ranges[1]) {
                    const second = ranges[1].match(/^(.+?)\s*-\s*(.+)$/);
                    if (second) {
                        const so = to24(second[1]);
                        const sc = to24(second[2]);
                        if (so && sc) {
                            target.second = true;
                            target.secondOpen = so;
                            target.secondClose = sc;
                        }
                    }
                }
            });
            return next;
        }

        function serialize() {
            return days.map(function (day) {
                const d = state[day];
                if (d.status === "closed") return day + ": Closed";
                if (d.status === "24") return day + ": 24 Hours";
                let result = day + ": " + from24(d.open) + " - " + from24(d.close);
                if (d.second && d.secondOpen && d.secondClose) {
                    result += " | " + from24(d.secondOpen) + " - " + from24(d.secondClose);
                }
                return result;
            }).join("\n");
        }

        function syncLegacy() {
            legacy.value = serialize();
        }

        function build(day) {
            const d = state[day];
            const row = document.createElement("div");
            row.className = "etag-hours-row" + (d.second ? " has-second" : "");

            row.innerHTML =
                '<div class="etag-hours-day">' + day + '</div>' +
                '<div class="etag-hours-status">' +
                    '<select class="etag-status" aria-label="' + day + ' status">' +
                        '<option value="open">Open</option>' +
                        '<option value="closed">Closed</option>' +
                        '<option value="24">24 Hours</option>' +
                    '</select>' +
                    '<div></div>' +
                '</div>' +
                '<div class="etag-hours-label">Opening time — Closing time</div>' +
                '<div class="etag-hours-times">' +
                    '<input type="time" class="etag-open" aria-label="' + day + ' opening time">' +
                    '<input type="time" class="etag-close" aria-label="' + day + ' closing time">' +
                '</div>' +
                '<div class="etag-hours-extra">' +
                    '<button type="button" class="etag-hours-add-second"></button>' +
                '</div>' +
                '<div class="etag-hours-second">' +
                    '<div class="etag-hours-label">Second period</div>' +
                    '<div class="etag-hours-second-times">' +
                        '<input type="time" class="etag-second-open" aria-label="' + day + ' second opening time">' +
                        '<input type="time" class="etag-second-close" aria-label="' + day + ' second closing time">' +
                    '</div>' +
                '</div>';

            const status = row.querySelector(".etag-status");
            const open = row.querySelector(".etag-open");
            const close = row.querySelector(".etag-close");
            const addSecond = row.querySelector(".etag-hours-add-second");
            const secondOpen = row.querySelector(".etag-second-open");
            const secondClose = row.querySelector(".etag-second-close");

            status.value = d.status;
            open.value = d.open;
            close.value = d.close;
            secondOpen.value = d.secondOpen;
            secondClose.value = d.secondClose;
            addSecond.textContent = d.second ? "Remove second period" : "Add second period";

            function refresh() {
                const isOpen = status.value === "open";
                open.disabled = !isOpen;
                close.disabled = !isOpen;
                addSecond.disabled = !isOpen;
                const hasSecond = row.classList.contains("has-second");
                secondOpen.disabled = !isOpen || !hasSecond;
                secondClose.disabled = !isOpen || !hasSecond;
            }

            function changed() {
                d.status = status.value;
                d.open = open.value;
                d.close = close.value;
                d.second = row.classList.contains("has-second");
                d.secondOpen = secondOpen.value;
                d.secondClose = secondClose.value;
                refresh();
                syncLegacy();
            }

            status.addEventListener("change", changed);
            open.addEventListener("change", changed);
            close.addEventListener("change", changed);
            secondOpen.addEventListener("change", changed);
            secondClose.addEventListener("change", changed);

            addSecond.addEventListener("click", function () {
                const hasSecond = row.classList.toggle("has-second");
                addSecond.textContent = hasSecond ? "Remove second period" : "Add second period";
                changed();
            });

            refresh();
            return row;
        }

        function render() {
            rows.innerHTML = "";
            days.forEach(function (day) {
                rows.appendChild(build(day));
            });
            syncLegacy();
        }

        state = parse(legacy.value);
        render();

        let initialValue = legacy.value;
        let userChanged = false;
        rows.addEventListener("change", function () { userChanged = true; }, true);

        // The dashboard may populate the legacy textarea asynchronously after profile load.
        let tries = 0;
        const watcher = setInterval(function () {
            tries += 1;
            if (!userChanged && legacy.value !== initialValue && String(legacy.value).trim() !== "") {
                state = parse(legacy.value);
                render();
                initialValue = legacy.value;
            }
            if (tries >= 30) clearInterval(watcher);
        }, 500);

        // Keep existing save logic intact by synchronizing immediately before save buttons execute.
        document.addEventListener("click", function (event) {
            const button = event.target.closest && event.target.closest("button");
            if (!button) return;
            const label = (button.textContent || "").trim().toLowerCase();
            if (label.includes("save")) syncLegacy();
        }, true);
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot, { once: true });
    } else {
        boot();
    }
})();
</script>
'''

          if "</head>" not in text or "</body>" not in text:
              raise SystemExit("dashboard.html missing document closing tags")

          text = text.replace("</head>", css + "</head>", 1)
          text = text.replace("</body>", js + "</body>", 1)
          path.write_text(text, encoding="utf-8")
          print("Final Business Hours UI installed")

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: repair business hours builder UI"
          git push
