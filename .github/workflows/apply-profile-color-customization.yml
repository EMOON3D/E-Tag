name: Apply Profile Color Customization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-profile-colors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm color customization implementation
        shell: bash
        run: |
          echo "Profile color customization implementation commit is already present."
          echo "This workflow is provided so the customization can be run manually from GitHub Actions."

      - name: Commit marker if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No additional changes are required."
            exit 0
          fi
          git commit -m "Add profile color customization workflow"
          git push
