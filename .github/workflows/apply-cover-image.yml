name: Apply Cover Image Support

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-cover-image:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch dashboard and Men theme
        shell: python
        run: |
          from pathlib import Path

          dashboard = Path('dashboard.html')
          men = Path('themes/men.html')

          d = dashboard.read_text(encoding='utf-8')
          m = men.read_text(encoding='utf-8')

          if 'id="coverFile"' not in d:
              needle = '''                <div\n                    id="uploadSection"\n                    class="field"\n                >'''

              cover_block = '''                <div\n                    id="coverSection"\n                    class="field"\n                >\n\n                    <div class="subsection" style="margin-top:0;">\n\n                        <h3>\n                            Cover Image\n                        </h3>\n\n                        <div\n                            id="coverPreview"\n                            style="\n                                width:100%;\n                                aspect-ratio:16 / 6;\n                                border-radius:14px;\n                                overflow:hidden;\n                                background:linear-gradient(135deg,#eef2f7,#d9e0d4);\n                                border:1px solid #e5e7eb;\n                                display:flex;\n                                align-items:center;\n                                justify-content:center;\n                                color:#6b7280;\n                                margin-bottom:10px;\n                                font-size:12px;\n                                font-weight:700;\n                            "\n                        >\n                            No cover image\n                        </div>\n\n                        <label\n                            for="coverFile"\n                            class="upload-label"\n                        >\n                            Upload Cover Image\n                        </label>\n\n                        <input\n                            id="coverFile"\n                            class="file-input"\n                            type="file"\n                            accept="image/jpeg,image/png,image/webp"\n                        >\n\n                        <div class="upload-help">\n                            JPG, PNG or WEBP. Maximum 1 MB.\n                        </div>\n\n                        <div\n                            id="coverUploadStatus"\n                            class="upload-status"\n                        ></div>\n\n                    </div>\n\n                </div>\n\n\n'''
              if needle not in d:
                  raise SystemExit('Dashboard uploadSection marker not found')
              d = d.replace(needle, cover_block + needle, 1)

              d = d.replace(
                  '    const uploadStatus =\n        document.getElementById(\n            "uploadStatus"\n        );',
                  '    const uploadStatus =\n        document.getElementById(\n            "uploadStatus"\n        );\n\n    const coverFile =\n        document.getElementById(\n            "coverFile"\n        );\n\n    const coverPreview =\n        document.getElementById(\n            "coverPreview"\n        );\n\n    const coverUploadStatus =\n        document.getElementById(\n            "coverUploadStatus"\n        );',
                  1
              )

              d = d.replace(
                  '    let currentAvatarUrl =\n        "";',
                  '    let currentAvatarUrl =\n        "";\n\n    let currentCoverImageUrl =\n        "";',
                  1
              )

              d = d.replace(
                  '    function renderAll() {\n\n        renderProfileType();',
                  '    function renderCoverPreview() {\n\n        if (!coverPreview) {\n            return;\n        }\n\n        if (currentCoverImageUrl) {\n            coverPreview.style.backgroundImage = `url("${currentCoverImageUrl}")`;\n            coverPreview.style.backgroundSize = "cover";\n            coverPreview.style.backgroundPosition = "center";\n            coverPreview.textContent = "";\n        } else {\n            coverPreview.style.backgroundImage = "";\n            coverPreview.textContent = "No cover image";\n        }\n    }\n\n\n    function renderAll() {\n\n        renderProfileType();',
                  1
              )

              d = d.replace(
                  '        renderAvatarMode();\n\n        renderCharacters();',
                  '        renderAvatarMode();\n\n        renderCharacters();\n\n        renderCoverPreview();',
                  1
              )

              d = d.replace(
                  '            updated_at:\n                new Date()\n                    .toISOString()\n\n        };',
                  '            updated_at:\n                new Date()\n                    .toISOString(),\n\n            cover_image_url:\n                currentCoverImageUrl ||\n                null\n\n        };',
                  1
              )

              d = d.replace(
                  '        currentAvatarUrl =\n            profile.avatar_url ||\n            "";',
                  '        currentAvatarUrl =\n            profile.avatar_url ||\n            "";\n\n        currentCoverImageUrl =\n            profile.cover_image_url ||\n            "";',
                  1
              )

              cover_function = '''\n\n    async function uploadCoverImage(file) {\n\n        if (!file) {\n            return;\n        }\n\n        if (!ALLOWED_TYPES.has(file.type)) {\n            throw new Error("Only JPG, PNG and WEBP images are allowed.");\n        }\n\n        if (file.size > MAX_FILE_SIZE) {\n            throw new Error("Image must be 1 MB or smaller.");\n        }\n\n        const { data: sessionData, error: sessionError } =\n            await supabase.auth.getSession();\n\n        if (sessionError) {\n            throw new Error(`Session error: ${sessionError.message}`);\n        }\n\n        if (!sessionData?.session) {\n            throw new Error("Your login session has expired.");\n        }\n\n        coverUploadStatus.textContent = "Preparing cover upload...";\n\n        const response = await fetch(\n            AVATAR_UPLOAD_FUNCTION,\n            {\n                method: "POST",\n                headers: {\n                    "Authorization": `Bearer ${sessionData.session.access_token}`,\n                    "apikey": SUPABASE_PUBLISHABLE_KEY,\n                    "Content-Type": "application/json"\n                },\n                body: JSON.stringify({\n                    fileName: `cover-${file.name}`,\n                    contentType: file.type,\n                    fileSize: file.size\n                })\n            }\n        );\n\n        let result;\n        try {\n            result = await response.json();\n        } catch {\n            result = null;\n        }\n\n        if (!response.ok || !result?.success) {\n            throw new Error(\n                result?.message ||\n                `Upload URL request failed: ${response.status}`\n            );\n        }\n\n        coverUploadStatus.textContent = "Uploading cover image...";\n\n        const uploadResponse = await fetch(\n            result.uploadUrl,\n            {\n                method: "PUT",\n                headers: {\n                    "Content-Type": file.type\n                },\n                body: file\n            }\n        );\n\n        if (!uploadResponse.ok) {\n            throw new Error(`R2 upload failed: ${uploadResponse.status}`);\n        }\n\n        currentCoverImageUrl =\n            `${R2_PUBLIC_URL}/${result.objectKey}`;\n\n        renderCoverPreview();\n        updatePreview();\n\n        coverUploadStatus.textContent =\n            "Cover image uploaded. Click Save Profile.";\n\n        coverUploadStatus.style.color = "#065f46";\n    }\n'''
              marker = '\n\n    async function loadDashboard() {'
              if marker not in d:
                  raise SystemExit('loadDashboard marker not found')
              d = d.replace(marker, cover_function + marker, 1)

              upload_listener = '''\n\n    coverFile.addEventListener(\n        "change",\n        async () => {\n\n            const file = coverFile.files?.[0];\n\n            if (!file) {\n                return;\n            }\n\n            try {\n                coverUploadStatus.style.color = "#6b7280";\n                await uploadCoverImage(file);\n            } catch (error) {\n                console.error("COVER IMAGE ERROR:", error);\n                coverUploadStatus.textContent =\n                    error.message || "Cover upload failed.";\n                coverUploadStatus.style.color = "#991b1b";\n                coverFile.value = "";\n            }\n        }\n    );\n'''
              marker2 = '\n\n    /*\n     * LIVE PREVIEW\n     */'
              if marker2 not in d:
                  raise SystemExit('live preview marker not found')
              d = d.replace(marker2, upload_listener + marker2, 1)

          if 'id="coverImage"' not in m:
              hero_marker = '''        <section class="hero">'''
              cover_html = '''        <section class="hero">\n\n            <div\n                id="coverImage"\n                class="cover-image hidden"\n            ></div>'''
              if hero_marker not in m:
                  raise SystemExit('Men hero marker not found')
              m = m.replace(hero_marker, cover_html, 1)

              css_marker = '        .avatar {\n'
              css = '''        .cover-image {\n            position: relative;\n            width: 100%;\n            height: clamp(90px, 16vh, 150px);\n            margin: -34px 0 14px;\n            border-radius: 0 0 22px 22px;\n            background-position: center;\n            background-size: cover;\n            background-repeat: no-repeat;\n            box-shadow: 0 10px 24px rgba(60,74,62,.12);\n        }\n\n        .cover-image::after {\n            content: "";\n            position: absolute;\n            inset: 0;\n            background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.14));\n            pointer-events: none;\n        }\n\n'''
              if css_marker not in m:
                  raise SystemExit('Men avatar CSS marker not found')
              m = m.replace(css_marker, css + css_marker, 1)

              var_marker = '    const editButton = document.getElementById("editButton");'
              var_add = '    const coverImage = document.getElementById("coverImage");\n'
              if var_marker not in m:
                  raise SystemExit('Men editButton marker not found')
              m = m.replace(var_marker, var_add + var_marker, 1)

              render_marker = '        renderAvatar(avatar, previewData);\n'
              render_add = '''        if (previewData.cover_image_url) {\n            coverImage.style.backgroundImage = `url("${previewData.cover_image_url}")`;\n            coverImage.classList.remove("hidden");\n        } else {\n            coverImage.style.backgroundImage = "";\n            coverImage.classList.add("hidden");\n        }\n\n'''
              if render_marker not in m:
                  raise SystemExit('Men preview render marker not found')
              m = m.replace(render_marker, render_add + render_marker, 1)

              normal_render_marker = '            renderAvatar(avatar, profileData);'
              if normal_render_marker in m:
                  m = m.replace(
                      normal_render_marker,
                      normal_render_marker + '''\n\n            if (profileData.cover_image_url) {\n                coverImage.style.backgroundImage = `url("${profileData.cover_image_url}")`;\n                coverImage.classList.remove("hidden");\n            } else {\n                coverImage.style.backgroundImage = "";\n                coverImage.classList.add("hidden");\n            }''',
                      1
                  )

          dashboard.write_text(d, encoding='utf-8')
          men.write_text(m, encoding='utf-8')
          print('Patched dashboard.html and themes/men.html')

      - name: Add two-color theme customization
        shell: python
        run: |
          from pathlib import Path

          dashboard = Path('dashboard.html')
          men = Path('themes/men.html')

          d = dashboard.read_text(encoding='utf-8')
          m = men.read_text(encoding='utf-8')

          if 'id="themeColorSection"' not in d:
              marker = '''                <div class="button-row">'''
              panel = '''                <div\n                    id="themeColorSection"\n                    class="subsection"\n                >\n\n                    <h3>\n                        Theme Appearance\n                    </h3>\n\n                    <p\n                        class="field-help"\n                        style="margin-bottom:16px;"\n                    >\n                        Customize only your profile background and background glow.\n                    </p>\n\n                    <div\n                        class="field"\n                    >\n\n                        <label>\n                            Background Color\n                        </label>\n\n                        <div\n                            style="display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;"\n                        >\n\n                            <input\n                                id="themeBackgroundHex"\n                                class="input"\n                                type="text"\n                                value="#D3DBC8"\n                                maxlength="7"\n                                spellcheck="false"\n                            >\n\n                            <input\n                                id="themeBackgroundPicker"\n                                type="color"\n                                value="#D3DBC8"\n                                style="width:100%;height:48px;padding:4px;border:1px solid #d1d5db;border-radius:11px;background:#fff;cursor:pointer;"\n                            >\n\n                        </div>\n\n                    </div>\n\n\n                    <div\n                        class="field"\n                    >\n\n                        <label>\n                            Background Glow\n                        </label>\n\n                        <div\n                            style="display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;"\n                        >\n\n                            <input\n                                id="themeGlowHex"\n                                class="input"\n                                type="text"\n                                value="#FFFFFF"\n                                maxlength="7"\n                                spellcheck="false"\n                            >\n\n                            <input\n                                id="themeGlowPicker"\n                                type="color"\n                                value="#FFFFFF"\n                                style="width:100%;height:48px;padding:4px;border:1px solid #d1d5db;border-radius:11px;background:#fff;cursor:pointer;"\n                            >\n\n                        </div>\n\n                    </div>\n\n                    <div\n                        style="display:flex;gap:10px;flex-wrap:wrap;"\n                    >\n\n                        <button\n                            id="themeColorSave"\n                            class="button primary"\n                            type="button"\n                        >\n                            Save Theme Colors\n                        </button>\n\n                        <button\n                            id="themeColorReset"\n                            class="button secondary"\n                            type="button"\n                        >\n                            Reset Colors\n                        </button>\n\n                    </div>\n\n                </div>\n\n\n'''
              if marker not in d:
                  raise SystemExit('Dashboard button row marker not found')
              d = d.replace(marker, panel + marker, 1)

              script_marker = '''    /*\n     * SAVE\n     */'''
              script = r'''    /*
     * THEME COLORS
     * Only background + glow are customizable.
     */

    const themeBackgroundHex =
        document.getElementById("themeBackgroundHex");

    const themeBackgroundPicker =
        document.getElementById("themeBackgroundPicker");

    const themeGlowHex =
        document.getElementById("themeGlowHex");

    const themeGlowPicker =
        document.getElementById("themeGlowPicker");

    const themeColorSave =
        document.getElementById("themeColorSave");

    const themeColorReset =
        document.getElementById("themeColorReset");


    const DEFAULT_THEME_COLORS = {
        background: "#D3DBC8",
        glow: "#FFFFFF"
    };


    let themeColors = {
        ...DEFAULT_THEME_COLORS
    };


    function normalizeThemeHex(value, fallback) {

        const text =
            String(value || "")
                .trim()
                .toUpperCase();

        if (
            /^#[0-9A-F]{6}$/.test(text)
        ) {
            return text;
        }

        return fallback;
    }


    function refreshThemeInputs() {

        if (themeBackgroundHex) {
            themeBackgroundHex.value =
                themeColors.background;
        }

        if (themeBackgroundPicker) {
            themeBackgroundPicker.value =
                themeColors.background;
        }

        if (themeGlowHex) {
            themeGlowHex.value =
                themeColors.glow;
        }

        if (themeGlowPicker) {
            themeGlowPicker.value =
                themeColors.glow;
        }

    }


    function sendThemeColorsToPreview() {

        const frame =
            document.getElementById(
                "themePreviewFrame"
            );

        if (!frame?.contentWindow) {
            return;
        }

        frame.contentWindow.postMessage(
            {
                type:
                    "etag-theme-colors",
                colors:
                    {
                        ...themeColors
                    }
            },
            window.location.origin
        );

    }


    function updateThemeColor(
        key,
        value
    ) {

        themeColors[key] =
            normalizeThemeHex(
                value,
                themeColors[key]
            );

        refreshThemeInputs();
        sendThemeColorsToPreview();

    }


    themeBackgroundPicker?.addEventListener(
        "input",
        () => {
            updateThemeColor(
                "background",
                themeBackgroundPicker.value
            );
        }
    );


    themeGlowPicker?.addEventListener(
        "input",
        () => {
            updateThemeColor(
                "glow",
                themeGlowPicker.value
            );
        }
    );


    themeBackgroundHex?.addEventListener(
        "change",
        () => {
            updateThemeColor(
                "background",
                themeBackgroundHex.value
            );
        }
    );


    themeGlowHex?.addEventListener(
        "change",
        () => {
            updateThemeColor(
                "glow",
                themeGlowHex.value
            );
        }
    );


    async function loadThemeColors() {

        try {

            const {
                data:
                    sessionData,
                error:
                    sessionError
            } =
                await supabase.auth.getSession();

            if (sessionError || !sessionData?.session?.user) {
                return;
            }

            const {
                data,
                error
            } =
                await supabase
                    .from("profiles")
                    .select("theme_colors")
                    .eq(
                        "id",
                        sessionData.session.user.id
                    )
                    .maybeSingle();

            if (error) {
                console.error(
                    "Theme color load error:",
                    error
                );
                return;
            }

            if (
                data?.theme_colors &&
                typeof data.theme_colors === "object"
            ) {

                themeColors = {
                    ...DEFAULT_THEME_COLORS,
                    ...data.theme_colors
                };

            }

            refreshThemeInputs();
            sendThemeColorsToPreview();

        } catch (error) {

            console.error(
                "Theme color loading failed:",
                error
            );

        }

    }


    async function saveThemeColors() {

        if (!currentUser) {
            showMessage(
                "No logged-in user found.",
                "error"
            );
            return;
        }

        themeColorSave.disabled = true;
        themeColorSave.textContent =
            "Saving...";

        try {

            const {
                data:
                    savedProfile,
                error
            } =
                await supabase
                    .from("profiles")
                    .update({
                        theme_colors: {
                            ...themeColors
                        },
                        updated_at:
                            new Date()
                                .toISOString()
                    })
                    .eq(
                        "id",
                        currentUser.id
                    )
                    .select("theme_colors")
                    .maybeSingle();

            if (error) {
                throw error;
            }

            if (savedProfile?.theme_colors) {
                themeColors = {
                    ...DEFAULT_THEME_COLORS,
                    ...savedProfile.theme_colors
                };
            }

            refreshThemeInputs();
            sendThemeColorsToPreview();

            showMessage(
                "Theme colors saved successfully.",
                "success"
            );

        } catch (error) {

            console.error(
                "Theme color save error:",
                error
            );

            showMessage(
                error.message ||
                "Failed to save theme colors.",
                "error"
            );

        } finally {

            themeColorSave.disabled = false;
            themeColorSave.textContent =
                "Save Theme Colors";

        }

    }


    themeColorSave?.addEventListener(
        "click",
        saveThemeColors
    );


    themeColorReset?.addEventListener(
        "click",
        () => {

            themeColors = {
                ...DEFAULT_THEME_COLORS
            };

            refreshThemeInputs();
            sendThemeColorsToPreview();

        }
    );


    window.addEventListener(
        "message",
        event => {

            if (
                event.origin !==
                window.location.origin
            ) {
                return;
            }

            if (
                event.data?.type ===
                "etag-men-preview-ready"
            ) {
                sendThemeColorsToPreview();
            }

        }
    );

'''
              if script_marker not in d:
                  raise SystemExit('Dashboard SAVE marker not found')
              d = d.replace(script_marker, script + script_marker, 1)

              save_hook = '''        saveButton.textContent =
            "Save Profile";'''
              if save_hook in d and 'themeColorSave' in d:
                  pass

              d = d.replace(
                  '            showMessage(\n                "Profile saved successfully.",\n                "success"\n            );',
                  '            showMessage(\n                "Profile saved successfully.",\n                "success"\n            );\n\n            loadThemeColors();',
                  1
              )

          if 'type === "etag-theme-colors"' not in m:
              style_marker = '        :root {\n'
              style = '''        :root {\n            --theme-profile-background: #D3DBC8;\n            --theme-profile-glow: #FFFFFF;\n'''
              if style_marker in m:
                  m = m.replace(style_marker, style, 1)
              else:
                  raise SystemExit('Men root CSS marker not found')

              background_marker = '        body {\n'
              background_css = '''        body {\n            background:\n                radial-gradient(\n                    ellipse at 70% 18%,\n                    var(--theme-profile-glow) 0%,\n                    color-mix(in srgb, var(--theme-profile-glow) 55%, transparent) 27%,\n                    transparent 57%\n                ),\n                radial-gradient(\n                    ellipse at 15% 75%,\n                    color-mix(in srgb, var(--theme-profile-background) 55%, transparent) 0%,\n                    transparent 70%\n                ),\n                linear-gradient(\n                    135deg,\n                    color-mix(in srgb, var(--theme-profile-background) 72%, #ffffff) 0%,\n                    color-mix(in srgb, var(--theme-profile-background) 88%, #ffffff) 38%,\n                    color-mix(in srgb, var(--theme-profile-background) 62%, #ffffff) 68%,\n                    color-mix(in srgb, var(--theme-profile-background) 78%, #ffffff) 100%\n                );\n'''
              if background_marker in m:
                  m = m.replace(background_marker, background_css, 1)
              else:
                  raise SystemExit('Men body marker not found')

              message_marker = '''    import {\n        createClient\n    } from\n        "https://esm.sh/@supabase/supabase-js@2";'''
              message_add = message_marker + '''\n\n\n    const DEFAULT_THEME_COLORS = {\n        background: "#D3DBC8",\n        glow: "#FFFFFF"\n    };\n\n\n    function applyThemeColors(colors) {\n\n        const next = {\n            ...DEFAULT_THEME_COLORS,\n            ...(colors && typeof colors === "object" ? colors : {})\n        };\n\n        const background =\n            /^#[0-9A-F]{6}$/i.test(String(next.background || ""))\n                ? String(next.background).toUpperCase()\n                : DEFAULT_THEME_COLORS.background;\n\n        const glow =\n            /^#[0-9A-F]{6}$/i.test(String(next.glow || ""))\n                ? String(next.glow).toUpperCase()\n                : DEFAULT_THEME_COLORS.glow;\n\n        document.documentElement.style.setProperty(\n            "--theme-profile-background",\n            background\n        );\n\n        document.documentElement.style.setProperty(\n            "--theme-profile-glow",\n            glow\n        );\n\n    }\n'''
              if message_marker in m:
                  m = m.replace(message_marker, message_add, 1)
              else:
                  raise SystemExit('Men supabase import marker not found')

              listener_marker = '''    const supabase =\n        createClient(\n            SUPABASE_URL,\n            SUPABASE_PUBLISHABLE_KEY\n        );'''
              listener_add = listener_marker + '''\n\n\n    window.addEventListener(\n        "message",\n        event => {\n\n            if (event.origin !== window.location.origin) {\n                return;\n            }\n\n            if (event.data?.type === "etag-theme-colors") {\n                applyThemeColors(event.data.colors);\n            }\n\n        }\n    );\n'''
              if listener_marker in m:
                  m = m.replace(listener_marker, listener_add, 1)
              else:
                  raise SystemExit('Men supabase client marker not found')

              load_marker = '''    async function load() {'''
              theme_load = '''    async function loadSavedThemeColors(ownerId) {\n\n        try {\n\n            const {\n                data,\n                error\n            } =\n                await supabase\n                    .from("profiles")\n                    .select("theme_colors")\n                    .eq("id", ownerId)\n                    .maybeSingle();\n\n            if (!error && data?.theme_colors) {\n                applyThemeColors(data.theme_colors);\n            }\n\n        } catch (error) {\n            console.error(\n                "Theme color load error:",\n                error\n            );\n        }\n\n    }\n\n\n'''
              if load_marker in m:
                  m = m.replace(load_marker, theme_load + load_marker, 1)
              else:
                  raise SystemExit('Men load marker not found')

              owner_marker = '''            const displayName ='''
              owner_add = '''            await loadSavedThemeColors(\n                tag.owner_id\n            );\n\n\n'''
              if owner_marker in m:
                  m = m.replace(owner_marker, owner_add + owner_marker, 1)
              else:
                  raise SystemExit('Men displayName marker not found')

          dashboard.write_text(d, encoding='utf-8')
          men.write_text(m, encoding='utf-8')
          print('Two-color theme customization patched.')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html themes/men.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add background and glow theme customization"
          git push