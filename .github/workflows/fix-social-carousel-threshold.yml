name: Fix Social Carousel Threshold

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Round Business profile card
        shell: python
        run: |
          from pathlib import Path
          path = Path("themes/business.html")
          text = path.read_text(encoding="utf-8")
          marker = "/* ETAG BUSINESS ROUNDED CARD */"

          if marker in text:
              print("Business rounded-card patch already installed.")
          else:
              css = r'''<style>
              /* ETAG BUSINESS ROUNDED CARD */
              .profile {
                  border-radius: 42px !important;
                  overflow: hidden !important;
              }

              @media (max-width: 600px) {
                  .profile {
                      border-radius: 28px !important;
                  }
              }
              </style>'''

              if "</style>" not in text:
                  raise SystemExit("Could not locate closing style tag in themes/business.html")

              text = text.replace("</style>", "</style>\n" + css, 1)
              path.write_text(text, encoding="utf-8")
              print("Applied rounded Business profile corners.")

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes/business.html

          if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
          fi

          git commit -m "fix: round business profile card corners"
          git push
