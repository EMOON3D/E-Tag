    </style>
'''
              if '</head>' not in m:
                  raise SystemExit('men head marker not found')
              m = m.replace('</head>', css + '\n</head>', 1)

              script = r'''

<script type="module" id="etagThemeRuntimeScript">

    import {
        createClient
    } from
        "https://esm.sh/@supabase/supabase-js@2";

    const etagThemeRuntimeSupabase =
        createClient(
            "https://zuptxhcjzhqynrquyray.supabase.co",
            "sb_publishable_1sa0MtE83MZXETR5JLakJA_fRVrjDJI"
        );

    const etagThemeDefaults = {
        background: "#D3DBC8",
        glow: "#FFFFFF"
    };

    function applyEtagThemeColors(colors) {
        const next = {
            ...etagThemeDefaults,
            ...(colors && typeof colors === "object" ? colors : {})
        };

        const background =
            /^#[0-9A-F]{6}$/i.test(String(next.background || ""))
                ? String(next.background).toUpperCase()
                : etagThemeDefaults.background;

        const glow =
            /^#[0-9A-F]{6}$/i.test(String(next.glow || ""))
                ? String(next.glow).toUpperCase()
                : etagThemeDefaults.glow;

        document.documentElement.style.setProperty(
            "--etag-theme-background",
            background
        );

        document.documentElement.style.setProperty(
            "--etag-theme-glow",
            glow
        );
    }

    window.addEventListener("message", event => {
        if (event.origin !== window.location.origin) return;
        if (event.data?.type !== "etag-theme-colors") return;
        applyEtagThemeColors(event.data.colors);
    });

    const params =
        new URLSearchParams(window.location.search);

    const isPreview =
        params.get("preview") === "1";

    if (isPreview) {
        window.parent.postMessage(
            {
                type: "etag-men-preview-ready"
            },
            window.location.origin
        );
    } else {
        (async () => {
            try {
                const tagCode =
                    params.get("tag")?.trim().toUpperCase();

                if (!tagCode) return;

                const { data: tag } =
                    await etagThemeRuntimeSupabase
                        .from("nfc_tags")
                        .select("owner_id,active")
                        .eq("tag_code", tagCode)
                        .maybeSingle();

                if (!tag?.active || !tag.owner_id) return;

                const { data: profile } =
                    await etagThemeRuntimeSupabase
                        .from("profiles")
                        .select("theme_colors")
                        .eq("id", tag.owner_id)
                        .maybeSingle();

                if (profile?.theme_colors) {
                    applyEtagThemeColors(profile.theme_colors);
                }
            } catch (error) {
                console.error("E-Tag theme colors load error:", error);
            }
        })();
    }

</script>
'''
              m = m.replace('</body>', script + '\n</body>', 1)

