name: Enforce Theme Colors Only

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  theme-colors-only:
    if: >-
      !contains(github.event.head_commit.message, 'Enforce theme colors only') &&
      !contains(github.event.head_commit.message, 'Fix theme colors only automation')
    runs-on: ubuntu-latest

    steps:
      - name: Wait for existing profile-color workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          for i in {1..60}; do
            RUN_ID=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/workflows/apply-profile-colors.yml/runs?head_sha=${COMMIT_SHA}&per_page=10" \
              | python -c 'import json,sys; d=json.load(sys.stdin); r=d.get("workflow_runs",[]); print(r[0]["id"] if r else "")')

            if [ -z "$RUN_ID" ]; then
              echo "Waiting for Apply Profile Color Customization to start..."
              sleep 2
              continue
            fi

            STATUS=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}" \
              | python -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))')

            CONCLUSION=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}" \
              | python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion", ""))')

            if [ "$STATUS" = "completed" ]; then
              echo "Apply Profile Color Customization finished with: $CONCLUSION"
              break
            fi

            echo "Existing customization workflow is still running..."
            sleep 2
          done

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Keep only theme palette customization
        shell: python
        run: |
          from pathlib import Path

          dashboard = Path("dashboard.html")
          men = Path("themes/men.html")

          d = dashboard.read_text(encoding="utf-8")
          m = men.read_text(encoding="utf-8")

          # Dashboard: rename the existing color editor to Theme Colors.
          d = d.replace(
              "                        Profile Colors\n",
              "                        Theme Colors\n"
          )

          # Hide ONLY Text Color. Main/Secondary/Accent/Surface stay visible.
          if "#etag-theme-colors-only-css" not in d:
              css = r'''

        /* #etag-theme-colors-only-css */
        .profile-color-row:has(#colorText),
        .profile-color-control:has(#colorText) {
            display: none !important;
        }
'''
              marker = "    </style>"
              if marker in d:
                  d = d.replace(marker, css + "\n" + marker, 1)

          d = d.replace(
              "Customize your profile colors. The Men theme stays bright and light even when you choose darker colors.",
              "Customize the Men theme palette. Text and icon colors stay unchanged, and the light/glass design remains."
          )

          # Keep text color fixed to the original Men theme color.
          if "#etag-theme-colors-only-js" not in d:
              js = r'''

    /* #etag-theme-colors-only-js */
    if (typeof currentThemeColors === "object") {
        currentThemeColors.text = "#253027";
    }

    saveButton?.addEventListener(
        "click",
        () => {
            if (typeof currentThemeColors === "object") {
                currentThemeColors.text = "#253027";
            }
        },
        true
    );

    colorText?.setAttribute("disabled", "disabled");
    colorTextHex?.setAttribute("disabled", "disabled");
    if (colorText?.closest(".profile-color-row")) {
        colorText.closest(".profile-color-row").style.display = "none";
    }
'''
              marker = "</script>"
              if marker in d:
                  d = d.replace(marker, js + "\n\n</script>", 1)

          # Men theme: preserve theme/background/surface palette customization.
          # Text and icon colors remain the original design values.
          if "#etag-theme-colors-only-men-css" not in m:
              css = r'''

        /* #etag-theme-colors-only-men-css */
        .custom-theme-colors h1,
        .custom-theme-colors .section-title,
        .custom-theme-colors .contact-value,
        .custom-theme-colors .social-name,
        .custom-theme-colors .age,
        .custom-theme-colors .bio,
        .custom-theme-colors .section-subtitle,
        .custom-theme-colors .contact-label,
        .custom-theme-colors .social-username,
        .custom-theme-colors .swipe-hint {
            color: #253027 !important;
        }
'''
              marker = "    </style>"
              if marker in m:
                  m = m.replace(marker, css + "\n" + marker, 1)

          if "#etag-theme-colors-only-men-js" not in m:
              js = r'''

    /* #etag-theme-colors-only-men-js */
    function keepOriginalTextColor() {
        document.documentElement.style.setProperty(
            "--theme-text",
            "#253027"
        );

        document.documentElement.style.setProperty(
            "--text",
            "#253027"
        );
    }

    window.addEventListener(
        "message",
        event => {
            if (
                event.data?.type === "etag-dashboard-preview" ||
                event.data?.type === "etag-dashboard-theme-colors"
            ) {
                keepOriginalTextColor();
            }
        }
    );

    window.setInterval(
        keepOriginalTextColor,
        250
    );
'''
              marker = "</script>"
              if marker in m:
                  m = m.replace(marker, js + "\n\n</script>", 1)

          dashboard.write_text(d, encoding="utf-8")
          men.write_text(m, encoding="utf-8")
          print("Theme-colors-only cleanup applied.")

      - name: Commit theme-only result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html themes/men.html
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Enforce theme colors only"
          git push origin main
