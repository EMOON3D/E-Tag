name: Add Business Hours Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace Opening Hours textarea with visual builder
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("dashboard.html")
          text = path.read_text(encoding="utf-8")
          original = text

          old = '''<div class="field">\n\n                            <label>\n                                Opening Hours\n                            </label>\n\n                            <textarea\n                                id="openingHours"\n                                class="textarea"\n                                placeholder="Mon-Fri: 9 AM - 6 PM"\n                            ></textarea>\n\n                        </div>'''

          new = '''<div class="field business-hours-field">\n\n                            <label>\n                                Opening Hours\n                            </label>\n\n                            <div id="businessHoursBuilder" class="business-hours-builder">\n                                <div class="business-hours-tools">\n                                    <button type="button" class="hours-tool" id="copyHoursToAll">Copy Monday to all days</button>\n                                    <button type="button" class="hours-tool" id="clearAllHours">Clear all</button>\n                                </div>\n                                <div id="hoursRows" class="hours-rows"></div>\n                            </div>\n\n                            <textarea\n                                id="openingHours"\n                                class="textarea"\n                                aria-hidden="true"\n                                tabindex="-1"\n                                style="display:none !important;"\n                            ></textarea>\n\n                        </div>'''

          if old not in text:
              if 'id="businessHoursBuilder"' in text:
                  print("Business Hours builder already installed.")
                  raise SystemExit(0)
              raise SystemExit("Could not find existing Opening Hours textarea block")

          text = text.replace(old, new, 1)

          css = r'''\n<style id="etagBusinessHoursBuilderStyle">\n.business-hours-builder{\n    border:1px solid #e5e7eb;\n    border-radius:16px;\n    background:#f9fafb;\n    padding:12px;\n}\n.business-hours-tools{\n    display:flex;\n    gap:8px;\n    flex-wrap:wrap;\n    margin-bottom:10px;\n}\n.hours-tool{\n    border:1px solid #d1d5db;\n    background:#fff;\n    color:#111827;\n    border-radius:10px;\n    padding:8px 10px;\n    font:700 12px inherit;\n    cursor:pointer;\n}\n.hours-rows{\n    display:grid;\n    gap:8px;\n}\n.hours-row{\n    display:grid;\n    grid-template-columns:110px 1fr;\n    gap:10px;\n    align-items:start;\n    padding:10px;\n    border:1px solid #e5e7eb;\n    border-radius:12px;\n    background:#fff;\n}\n.hours-day{\n    font-weight:800;\n    font-size:13px;\n    padding-top:8px;\n}\n.hours-controls{\n    display:grid;\n    gap:8px;\n}\n.hours-status{\n    width:100%;\n    border:1px solid #d1d5db;\n    border-radius:10px;\n    padding:9px 10px;\n    background:#fff;\n    font:500 13px inherit;\n}\n.hours-times{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:8px;\n}\n.hours-time{\n    width:100%;\n    border:1px solid #d1d5db;\n    border-radius:10px;\n    padding:9px 10px;\n    background:#fff;\n    font:500 13px inherit;\n}\n.hours-second{\n    display:none;\n    grid-template-columns:1fr 1fr auto;\n    gap:8px;\n    align-items:center;\n}\n.hours-row.has-second .hours-second{display:grid}\n.hours-break-btn{\n    border:1px solid #d1d5db;\n    background:#fff;\n    color:#374151;\n    border-radius:10px;\n    padding:8px 10px;\n    font:700 11px inherit;\n    cursor:pointer;\n}\n.hours-remove-second{\n    border:0;\n    background:transparent;\n    color:#6b7280;\n    cursor:pointer;\n    font-size:18px;\n    line-height:1;\n}\n.hours-note{\n    color:#6b7280;\n    font-size:11px;\n    margin-top:8px;\n    line-height:1.45;\n}\n@media(max-width:600px){\n    .hours-row{grid-template-columns:1fr;gap:7px}\n    .hours-day{padding-top:0}\n    .hours-times{grid-template-columns:1fr 1fr}\n    .hours-second{grid-template-columns:1fr 1fr auto}\n}\n</style>\n'''
          text = text.replace('</head>', css + '</head>', 1)

          js = r'''\n<script id="etagBusinessHoursBuilderScript">\n(function(){\n    const openingHours = document.getElementById('openingHours');\n    const rowsEl = document.getElementById('hoursRows');\n    const copyBtn = document.getElementById('copyHoursToAll');\n    const clearBtn = document.getElementById('clearAllHours');\n    if(!openingHours || !rowsEl) return;\n\n    const days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];\n\n    const pad = n => String(n).padStart(2,'0');\n\n    function defaultTimeRows(){\n        return {\n            status:'closed',\n            open:'09:00',\n            close:'17:00',\n            secondOpen:'14:00',\n            secondClose:'18:00',\n            second:false\n        };\n    }\n\n    function parseExisting(value){\n        const state = {};\n        days.forEach(d=>state[d]=defaultTimeRows());\n        const lines = String(value || '').split(/\\r?\\n/).map(s=>s.trim()).filter(Boolean);\n        const map = {};\n        days.forEach(d=>map[d.toLowerCase()]=d);\n        for(const line of lines){\n            const m = line.match(/^([A-Za-z]+)\\s*:\\s*(.*)$/);\n            if(!m) continue;\n            const day = map[m[1].toLowerCase()];\n            if(!day) continue;\n            const v = m[2].trim();\n            if(/^closed$/i.test(v)){ state[day].status='closed'; continue; }\n            if(/24\\s*hours?/i.test(v)){ state[day].status='24'; continue; }\n            const pairs = v.split(/\\s*,\\s*|\\s*\\|\\s*|\\s*and\\s*/i);\n            const first = pairs[0].match(/([0-9]{1,2}:[0-9]{2})\\s*-\\s*([0-9]{1,2}:[0-9]{2})/);\n            if(first){\n                state[day].status='open';\n                state[day].open=first[1];\n                state[day].close=first[2];\n            }\n            const second = pairs[1] && pairs[1].match(/([0-9]{1,2}:[0-9]{2})\\s*-\\s*([0-9]{1,2}:[0-9]{2})/);\n            if(second){\n                state[day].second=true;\n                state[day].secondOpen=second[1];\n                state[day].secondClose=second[2];\n            }\n        }\n        return state;\n    }\n\n    let state = parseExisting(openingHours.value);\n\n    function rowTemplate(day){\n        const s = state[day];\n        const row = document.createElement('div');\n        row.className = 'hours-row' + (s.second ? ' has-second' : '');\n        row.dataset.day = day;\n        row.innerHTML = `\n            <div class="hours-day">${day}</div>\n            <div class="hours-controls">\n                <select class="hours-status" aria-label="${day} status">\n                    <option value="open">Open</option>\n                    <option value="closed">Closed</option>\n                    <option value="24">24 Hours</option>\n                </select>\n                <div class="hours-times">\n                    <input class="hours-time hours-open" type="time" aria-label="${day} opening time">\n                    <input class="hours-time hours-close" type="time" aria-label="${day} closing time">\n                </div>\n                <button type="button" class="hours-break-btn">Add second period</button>\n                <div class="hours-second">\n                    <input class="hours-time hours-second-open" type="time" aria-label="${day} second opening time">\n                    <input class="hours-time hours-second-close" type="time" aria-label="${day} second closing time">\n                    <button type="button" class="hours-remove-second" aria-label="Remove second period">×</button>\n                </div>\n            </div>`;\n\n        const status=row.querySelector('.hours-status');\n        const open=row.querySelector('.hours-open');\n        const close=row.querySelector('.hours-close');\n        const add=row.querySelector('.hours-break-btn');\n        const sopen=row.querySelector('.hours-second-open');\n        const sclose=row.querySelector('.hours-second-close');\n        const remove=row.querySelector('.hours-remove-second');\n\n        status.value=s.status;\n        open.value=s.open;\n        close.value=s.close;\n        sopen.value=s.secondOpen;\n        sclose.value=s.secondClose;\n        add.textContent=s.second ? 'Remove second period' : 'Add second period';\n\n        function sync(){\n            s.status=status.value;\n            s.open=open.value;\n            s.close=close.value;\n            s.secondOpen=sopen.value;\n            s.secondClose=sclose.value;\n            s.second=row.classList.contains('has-second');\n            if(s.status !== 'open'){\n                open.disabled=true; close.disabled=true; sopen.disabled=true; sclose.disabled=true; add.disabled=true;\n            } else {\n                open.disabled=false; close.disabled=false; add.disabled=false;\n                const has=row.classList.contains('has-second');\n                sopen.disabled=!has; sclose.disabled=!has;\n            }\n            openingHours.value = serialize();\n        }\n\n        status.addEventListener('change',sync);\n        open.addEventListener('input',sync);\n        close.addEventListener('input',sync);\n        sopen.addEventListener('input',sync);\n        sclose.addEventListener('input',sync);\n\n        add.addEventListener('click',()=>{\n            if(row.classList.contains('has-second')){\n                row.classList.remove('has-second');\n            }else{\n                row.classList.add('has-second');\n            }\n            add.textContent=row.classList.contains('has-second') ? 'Remove second period' : 'Add second period';\n            sync();\n        });\n\n        remove.addEventListener('click',()=>{\n            row.classList.remove('has-second');\n            add.textContent='Add second period';\n            sync();\n        });\n\n        sync();\n        return row;\n    }\n\n    function render(){\n        rowsEl.innerHTML='';\n        days.forEach(d=>rowsEl.appendChild(rowTemplate(d)));\n        openingHours.value=serialize();\n    }\n\n    function serialize(){\n        return days.map(day=>{\n            const s=state[day];\n            if(s.status==='closed') return `${day}: Closed`;\n            if(s.status==='24') return `${day}: 24 Hours`;\n            const first=(s.open && s.close) ? `${s.open} - ${s.close}` : 'Set hours';\n            const second=(s.second && s.secondOpen && s.secondClose) ? `, ${s.secondOpen} - ${s.secondClose}` : '';\n            return `${day}: ${first}${second}`;\n        }).join('\\n');\n    }\n\n    copyBtn && copyBtn.addEventListener('click',()=>{\n        const source={...state.Monday};\n        days.slice(1).forEach(d=>state[d]={...source});\n        render();\n    });\n\n    clearBtn && clearBtn.addEventListener('click',()=>{\n        days.forEach(d=>state[d]=defaultTimeRows());\n        render();\n    });\n\n    render();\n\n    // Keep hidden legacy field synchronized immediately before dashboard save.\n    const form = openingHours.closest('form');\n    if(form){\n        form.addEventListener('submit',()=>{ openingHours.value=serialize(); });\n    }\n\n    // Also synchronize before common save buttons are clicked.\n    document.addEventListener('click', function(e){\n        const el=e.target.closest && e.target.closest('button');\n        if(!el) return;\n        const txt=(el.textContent||'').trim().toLowerCase();\n        if(txt.includes('save')) openingHours.value=serialize();\n    }, true);\n})();\n</script>\n'''
          text = text.replace('</body>', js + '</body>', 1)

          # Add a concise hint below the builder.
          marker = '</div>\n\n                        </div>\n\n                        <div class="field">'
          hint = '</div>\n                            <div class="hours-note">Choose each day individually. Use Closed for days off, 24 Hours for all-day businesses, or Add second period for split shifts.</div>\n\n                        </div>\n\n                        <div class="field">'
          text = text.replace(marker, hint, 1)

          path.write_text(text, encoding='utf-8')
          print('Business Hours builder installed.')

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: add friendly business opening hours builder"
          git push
