name: Fix Business Hours Rows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure full Business Hours day controls render
        shell: python
        run: |
          from pathlib import Path

          path = Path("dashboard.html")
          text = path.read_text(encoding="utf-8")

          marker = '<div id="hoursRows" class="hours-rows"></div>'
          if marker not in text:
              raise SystemExit("hoursRows container not found")

          style = r'''
<style id="etagBusinessHoursRowsFixStyle">
.hours-rows-fallback{display:grid;gap:8px;margin-top:8px}
.hours-row-fallback{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start;padding:10px;border:1px solid #e5e7eb;border-radius:12px;background:#fff}
.hours-day-fallback{font-size:13px;font-weight:800;padding-top:9px}
.hours-controls-fallback{display:grid;gap:8px}
.hours-status-fallback,.hours-time-fallback{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:9px 10px;background:#fff;font:inherit;font-size:13px}
.hours-times-fallback{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hours-second-fallback{display:none;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.hours-row-fallback.has-second .hours-second-fallback{display:grid}
.hours-break-fallback{border:1px solid #d1d5db;background:#fff;color:#374151;border-radius:10px;padding:8px 10px;font:700 11px inherit;cursor:pointer}
.hours-remove-fallback{border:0;background:transparent;color:#6b7280;cursor:pointer;font-size:18px}
@media(max-width:600px){.hours-row-fallback{grid-template-columns:1fr}.hours-day-fallback{padding-top:0}.hours-times-fallback{grid-template-columns:1fr 1fr}.hours-second-fallback{grid-template-columns:1fr 1fr auto}}
</style>
'''
          if 'id="etagBusinessHoursRowsFixStyle"' not in text:
              text = text.replace('</head>', style + '</head>', 1)

          script = r'''
<script id="etagBusinessHoursRowsFixScript">
(function(){
  function initBusinessHoursRows(){
    const container=document.getElementById('hoursRows');
    const legacy=document.getElementById('openingHours');
    const copy=document.getElementById('copyHoursToAll');
    const clear=document.getElementById('clearAllHours');
    if(!container || container.dataset.rowsReady==='1') return;

    const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
    const state={};
    days.forEach(d=>state[d]={status:'closed',open:'09:00',close:'17:00',second:false,secondOpen:'14:00',secondClose:'18:00'});

    function serialize(){
      if(!legacy) return;
      legacy.value=days.map(d=>{
        const s=state[d];
        if(s.status==='24') return d+': 24 Hours';
        if(s.status==='closed') return d+': Closed';
        let v=(s.open||'09:00')+' - '+(s.close||'17:00');
        if(s.second && s.secondOpen && s.secondClose) v += ', '+s.secondOpen+' - '+s.secondClose;
        return d+': '+v;
      }).join('\n');
    }

    function makeRow(day){
      const s=state[day];
      const row=document.createElement('div');
      row.className='hours-row-fallback';
      row.dataset.day=day;
      row.innerHTML='<div class="hours-day-fallback">'+day+'</div>'+
        '<div class="hours-controls-fallback">'+
          '<select class="hours-status-fallback">'+
            '<option value="open">Open</option>'+
            '<option value="closed">Closed</option>'+
            '<option value="24">24 Hours</option>'+
          '</select>'+
          '<div class="hours-times-fallback">'+
            '<input class="hours-time-fallback hours-open-fallback" type="time">'+
            '<input class="hours-time-fallback hours-close-fallback" type="time">'+
          '</div>'+
          '<button type="button" class="hours-break-fallback">Add second period</button>'+
          '<div class="hours-second-fallback">'+
            '<input class="hours-time-fallback hours-second-open-fallback" type="time">'+
            '<input class="hours-time-fallback hours-second-close-fallback" type="time">'+
            '<button type="button" class="hours-remove-fallback">×</button>'+
          '</div>'+
        '</div>';

      const status=row.querySelector('.hours-status-fallback');
      const open=row.querySelector('.hours-open-fallback');
      const close=row.querySelector('.hours-close-fallback');
      const secondOpen=row.querySelector('.hours-second-open-fallback');
      const secondClose=row.querySelector('.hours-second-close-fallback');
      const add=row.querySelector('.hours-break-fallback');
      const remove=row.querySelector('.hours-remove-fallback');

      status.value=s.status; open.value=s.open; close.value=s.close; secondOpen.value=s.secondOpen; secondClose.value=s.secondClose;

      function sync(){
        s.status=status.value; s.open=open.value; s.close=close.value; s.secondOpen=secondOpen.value; s.secondClose=secondClose.value;
        s.second=row.classList.contains('has-second');
        const enabled=s.status==='open';
        open.disabled=!enabled; close.disabled=!enabled; add.disabled=!enabled;
        secondOpen.disabled=!enabled || !s.second; secondClose.disabled=!enabled || !s.second;
        add.textContent=s.second?'Remove second period':'Add second period';
        serialize();
      }

      status.addEventListener('change',sync); open.addEventListener('input',sync); close.addEventListener('input',sync); secondOpen.addEventListener('input',sync); secondClose.addEventListener('input',sync);
      add.addEventListener('click',function(){ if(row.classList.contains('has-second')) row.classList.remove('has-second'); else row.classList.add('has-second'); sync(); });
      remove.addEventListener('click',function(){ row.classList.remove('has-second'); sync(); });
      sync();
      return row;
    }

    container.innerHTML='';
    days.forEach(d=>container.appendChild(makeRow(d)));
    container.className='hours-rows-fallback';
    container.dataset.rowsReady='1';
    serialize();

    if(copy) copy.onclick=function(){ const src=JSON.parse(JSON.stringify(state.Monday)); days.slice(1).forEach(d=>state[d]=JSON.parse(JSON.stringify(src))); initBusinessHoursRowsReset(); };
    if(clear) clear.onclick=function(){ days.forEach(d=>state[d]={status:'closed',open:'09:00',close:'17:00',second:false,secondOpen:'14:00',secondClose:'18:00'}); initBusinessHoursRowsReset(); };

    function initBusinessHoursRowsReset(){
      container.dataset.rowsReady='';
      container.innerHTML='';
      days.forEach(d=>container.appendChild(makeRow(d)));
      container.dataset.rowsReady='1';
      serialize();
      if(copy) copy.onclick=function(){ const src=JSON.parse(JSON.stringify(state.Monday)); days.slice(1).forEach(d=>state[d]=JSON.parse(JSON.stringify(src))); initBusinessHoursRowsReset(); };
      if(clear) clear.onclick=function(){ days.forEach(d=>state[d]={status:'closed',open:'09:00',close:'17:00',second:false,secondOpen:'14:00',secondClose:'18:00'}); initBusinessHoursRowsReset(); };
    }
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initBusinessHoursRows);
  else initBusinessHoursRows();
  window.addEventListener('load',initBusinessHoursRows);
})();
</script>
'''
          if 'id="etagBusinessHoursRowsFixScript"' not in text:
              text = text.replace('</body>', script + '</body>', 1)
          path.write_text(text, encoding='utf-8')
          print('Business Hours rows fix installed.')

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: render all business hours day controls"
          git push
