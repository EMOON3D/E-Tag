<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>E-Tag</title>

    <script>

        (function () {

            const path =
                window.location.pathname;

            const base =
                "/E-Tag/";


            /*
             * Allow normal static files to load.
             */

            const allowedFiles = [
                "index.html",
                "admin.html",
                "dashboard.html",
                "auth-callback.html"
            ];


            const filename =
                path
                    .split("/")
                    .filter(Boolean)
                    .pop();


            if (
                filename &&
                allowedFiles.includes(
                    filename.toLowerCase()
                )
            ) {

                return;
            }


            /*
             * Handle public E-Tag routes.
             *
             * Example:
             *
             * /E-Tag/id/DFG
             *
             * becomes:
             *
             * /E-Tag/?tag=DFG
             */

            const idPrefix =
                `${base}id/`;


            if (
                path.startsWith(
                    idPrefix
                )
            ) {

                const tagCode =
                    path.substring(
                        idPrefix.length
                    )
                    .split("/")
                    .filter(Boolean)[0];


                if (
                    tagCode
                ) {

                    window.location.replace(
                        `${base}?tag=${encodeURIComponent(
                            tagCode
                        )}`
                    );

                    return;
                }
            }


            /*
             * Unknown route.
             */

            window.location.replace(
                base
            );

        })();

    </script>

</head>

<body>

    Loading E-Tag...

</body>
</html>
