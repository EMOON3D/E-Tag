<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>E-Tag</title>

    <script>
        (function () {

            const path =
                window.location.pathname;

            const base =
                "/E-Tag/";

            if (
                path.startsWith(
                    base + "id/"
                )
            ) {

                const tag =
                    path.substring(
                        (base + "id/").length
                    );

                const target =
                    `${base}?tag=${encodeURIComponent(
                        tag
                    )}`;

                window.location.replace(
                    target
                );

                return;
            }


            window.location.replace(
                base
            );

        })();
    </script>
</head>

<body>
    Loading E-Tag...
</body>
</html>
