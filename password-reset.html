<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - E-Tag</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f7fb;
            color: #111827;
        }

        .card {
            width: min(100%, 480px);
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 22px;
            padding: 26px;
            box-shadow:
                0 12px 40px rgba(
                    0,
                    0,
                    0,
                    0.06
                );
        }

        .center {
            text-align: center;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
            line-height: 1.2;
        }

        p {
            margin: 0;
            color: #6b7280;
            line-height: 1.6;
        }

        .section {
            margin-top: 24px;
        }

        .field {
            margin-top: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 11px;
            padding: 13px 14px;
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }

        input:focus {
            border-color: #111827;
            box-shadow:
                0 0 0 3px rgba(
                    17,
                    24,
                    39,
                    0.08
                );
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 14px 16px;
            margin-top: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .primary {
            background: #111827;
            color: #ffffff;
        }

        .secondary {
            background: #eef2f7;
            color: #111827;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 13px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .message.success {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .hidden {
            display: none !important;
        }

        .success-box {
            margin-top: 20px;
            padding: 18px;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-radius: 14px;
            color: #065f46;
            line-height: 1.6;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="center">

        <h1>
            Reset Password
        </h1>

        <p>
            Create a new password for your E-Tag account.
        </p>

    </div>


    <div
        id="formSection"
        class="section"
    >

        <div class="field">

            <label for="newPassword">
                New Password
            </label>

            <input
                id="newPassword"
                type="password"
                autocomplete="new-password"
                placeholder="Enter new password"
            >

        </div>


        <div class="field">

            <label for="confirmPassword">
                Confirm New Password
            </label>

            <input
                id="confirmPassword"
                type="password"
                autocomplete="new-password"
                placeholder="Confirm new password"
            >

        </div>


        <button
            id="updateButton"
            class="primary"
            type="button"
        >
            Update Password
        </button>


        <button
            id="backButton"
            class="secondary"
            type="button"
        >
            Back to E-Tag
        </button>


        <div
            id="message"
            class="message"
        ></div>

    </div>


    <div
        id="successSection"
        class="success-box hidden"
    >
        Password updated successfully.

        <button
            id="continueButton"
            class="primary"
            type="button"
        >
            Continue to E-Tag
        </button>
    </div>

</div>


<script type="module">

    import {
        createClient
    } from
        "https://esm.sh/@supabase/supabase-js@2";


    const SUPABASE_URL =
        "https://zuptxhcjzhqynrquyray.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_1sa0MtE83MZXETR5JLakJA_fRVrjDJI";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY,
            {
                auth: {
                    detectSessionInUrl: true,
                    persistSession: true,
                    autoRefreshToken: true
                }
            }
        );


    const formSection =
        document.getElementById(
            "formSection"
        );


    const successSection =
        document.getElementById(
            "successSection"
        );


    const newPassword =
        document.getElementById(
            "newPassword"
        );


    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        );


    const updateButton =
        document.getElementById(
            "updateButton"
        );


    const backButton =
        document.getElementById(
            "backButton"
        );


    const continueButton =
        document.getElementById(
            "continueButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            `message show ${type}`;
    }


    async function checkSession() {

        const {
            data,
            error
        } =
            await supabase.auth.getSession();


        if (
            error ||
            !data.session
        ) {

            showMessage(
                "This password reset link is invalid or has expired. Request a new reset email.",
                "error"
            );

            updateButton.disabled =
                true;

            return false;
        }


        return true;
    }


    async function updatePassword() {

        const password =
            newPassword.value;


        const confirmation =
            confirmPassword.value;


        if (
            !password
        ) {

            showMessage(
                "Please enter a new password.",
                "error"
            );

            return;
        }


        if (
            password.length <
            6
        ) {

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;
        }


        if (
            password !==
            confirmation
        ) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        updateButton.disabled =
            true;

        updateButton.textContent =
            "Updating...";


        try {

            const {
                error
            } =
                await supabase.auth.updateUser(
                    {
                        password
                    }
                );


            if (
                error
            ) {

                showMessage(
                    error.message,
                    "error"
                );

                return;
            }


            formSection.classList.add(
                "hidden"
            );

            successSection.classList.remove(
                "hidden"
            );

        } catch (
            error
        ) {

            showMessage(
                error.message ||
                    "Unable to update password.",
                "error"
            );

        } finally {

            updateButton.disabled =
                false;

            updateButton.textContent =
                "Update Password";
        }
    }


    updateButton.addEventListener(
        "click",
        updatePassword
    );


    backButton.addEventListener(
        "click",
        () => {

            window.location.href =
                "/E-Tag/";
        }
    );


    continueButton.addEventListener(
        "click",
        async () => {

            await supabase.auth.signOut();

            window.location.href =
                "/E-Tag/";
        }
    );


    supabase.auth.onAuthStateChange(
        (
            event,
            session
        ) => {

            if (
                event ===
                "PASSWORD_RECOVERY"
            ) {

                updateButton.disabled =
                    false;
            }

            if (
                event ===
                "SIGNED_IN" &&
                session
            ) {

                updateButton.disabled =
                    false;
            }
        }
    );


    await checkSession();

</script>

</body>
</html>
