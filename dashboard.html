<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>E-Tag Dashboard</title>

</head>

<body>

<script>

const ORIGINAL_DASHBOARD =
    "https://raw.githubusercontent.com/EMOON3D/E-Tag/ba3d4f1d06e91cf150402ab5ec32914d82bdaab9/dashboard.html";


fetch(
    ORIGINAL_DASHBOARD,
    {
        cache: "no-store"
    }
)
.then(
    response => {

        if (
            !response.ok
        ) {

            throw new Error(
                "Unable to load the E-Tag dashboard."
            );

        }

        return response.text();

    }
)
.then(
    html => {

        const extraScript = `

<script type="module">

import {
    createClient
}
from
    "https://esm.sh/@supabase/supabase-js@2";


const SUPABASE_URL =
    "https://zuptxhcjzhqynrquyray.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_1sa0MtE83MZXETR5JLakJA_fRVrjDJI";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


const DEFAULT_THEME =
{

    background1:
        "#C3CDB8",

    background2:
        "#D3DBC8",

    background3:
        "#E1E7DA",

    main:
        "#D3DBC8",

    secondary:
        "#E5EADF",

    glass:
        "#D3DBC8",

    surface:
        "#FFFFFF",

    border:
        "#FFFFFF",

    accent:
        "#B8C9A8",

    shadow:
        "#374539"

};


let themeColors =
{
    ...DEFAULT_THEME
};


const CONTROL_DEFINITIONS =
[

    [
        "background1",
        "Background 1"
    ],

    [
        "background2",
        "Background 2"
    ],

    [
        "background3",
        "Background 3"
    ],

    [
        "main",
        "Main Theme"
    ],

    [
        "secondary",
        "Secondary Theme"
    ],

    [
        "glass",
        "Glass Tint"
    ],

    [
        "surface",
        "Surface"
    ],

    [
        "border",
        "Glass Border"
    ],

    [
        "accent",
        "Accent"
    ],

    [
        "shadow",
        "Shadow Tint"
    ]

];


function normalizeHex(
    value,
    fallback
)
{

    const text =
        String(
            value ||
            ""
        )
        .trim()
        .toUpperCase();


    if (
        /^#[0-9A-F]{6}$/.test(
            text
        )
    )
    {

        return text;

    }


    return fallback;

}


function createPanel()
{

    if (
        document.getElementById(
            "etagThemeCustomizer"
        )
    )
    {

        return;

    }


    const style =
        document.createElement(
            "style"
        );


    style.textContent = `

        #etagThemeCustomizer
        {

            margin-top: 26px;

            padding-top: 20px;

            border-top:
                1px solid #e5e7eb;

        }


        #etagThemeCustomizer h3
        {

            margin:
                0 0 7px;

            font-size: 17px;

        }


        #etagThemeCustomizer .theme-help
        {

            margin:
                0 0 16px;

            color: #6b7280;

            font-size: 12px;

            line-height: 1.5;

        }


        #etagThemeGrid
        {

            display:
                grid;

            grid-template-columns:
                1fr;

            gap: 11px;

        }


        .etag-theme-row
        {

            display:
                grid;

            grid-template-columns:
                1fr 70px 105px;

            gap: 8px;

            align-items:
                center;

        }


        .etag-theme-label
        {

            font-size: 13px;

            font-weight: 700;

        }


        .etag-theme-color
        {

            width:
                70px;

            height:
                42px;

            padding:
                3px;

            border:
                1px solid #d1d5db;

            border-radius:
                10px;

            background:
                #ffffff;

            cursor:
                pointer;

        }


        .etag-theme-hex
        {

            width:
                100%;

            min-width:
                0;

            padding:
                10px;

            border:
                1px solid #d1d5db;

            border-radius:
                10px;

            font:
                inherit;

            font-size:
                12px;

            outline:
                none;

            text-transform:
                uppercase;

        }


        .etag-theme-actions
        {

            display:
                flex;

            gap:
                8px;

            margin-top:
                14px;

        }


        .etag-theme-button
        {

            border:
                0;

            border-radius:
                10px;

            padding:
                11px 14px;

            font:
                inherit;

            font-size:
                13px;

            font-weight:
                700;

            cursor:
                pointer;

        }


        .etag-theme-save
        {

            background:
                #111827;

            color:
                #ffffff;

        }


        .etag-theme-reset
        {

            background:
                #eef2f7;

            color:
                #111827;

        }


        @media
        (max-width: 600px)
        {

            .etag-theme-row
            {

                grid-template-columns:
                    1fr 58px;

            }


            .etag-theme-hex
            {

                grid-column:
                    1 / -1;

            }


            .etag-theme-color
            {

                width:
                    58px;

            }

        }

    `;


    document.head.appendChild(
        style
    );


    const panel =
        document.createElement(
            "div"
        );


    panel.id =
        "etagThemeCustomizer";


    panel.innerHTML = `

        <h3>
            Theme Colors
        </h3>


        <p class="theme-help">
            Customize the visual colors of your profile.
            Text colors and social PNG icons are not changed.
            The bright/light glass design stays intact.
        </p>


        <div
            id="etagThemeGrid"
        ></div>


        <div
            class="etag-theme-actions"
        >

            <button
                id="etagThemeSave"
                class="etag-theme-button etag-theme-save"
                type="button"
            >
                Save Theme
            </button>


            <button
                id="etagThemeReset"
                class="etag-theme-button etag-theme-reset"
                type="button"
            >
                Reset
            </button>

        </div>

    `;


    const editor =
        document.querySelector(
            ".layout > .card:first-child"
        );


    if (
        editor
    )
    {

        const buttonRow =
            editor.querySelector(
                ".button-row"
            );


        if (
            buttonRow
        )
        {

            editor.insertBefore(
                panel,
                buttonRow
            );

        }
        else
        {

            editor.appendChild(
                panel
            );

        }

    }
    else
    {

        document.body.appendChild(
            panel
        );

    }


    const grid =
        document.getElementById(
            "etagThemeGrid"
        );


    CONTROL_DEFINITIONS.forEach(
        (
            [
                key,
                label
            ]
        ) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "etag-theme-row";


            row.innerHTML = `

                <div
                    class="etag-theme-label"
                >
                    ${label}
                </div>


                <input
                    class="etag-theme-color"
                    type="color"
                    data-theme-picker="${key}"
                    value="${themeColors[key]}"
                >


                <input
                    class="etag-theme-hex"
                    type="text"
                    maxlength="7"
                    spellcheck="false"
                    data-theme-hex="${key}"
                    value="${themeColors[key]}"
                >

            `;


            grid.appendChild(
                row
            );

        }
    );


    const pickers =
        panel.querySelectorAll(
            "[data-theme-picker]"
        );


    const hexInputs =
        panel.querySelectorAll(
            "[data-theme-hex]"
        );


    function refreshControls()
    {

        pickers.forEach(
            picker => {

                const key =
                    picker.dataset.themePicker;


                picker.value =
                    themeColors[key];

            }
        );


        hexInputs.forEach(
            input => {

                const key =
                    input.dataset.themeHex;


                input.value =
                    themeColors[key];

            }
        );

    }


    function sendThemeToPreview()
    {

        const frame =
            document.getElementById(
                "themePreviewFrame"
            );


        if (
            !frame?.contentWindow
        )
        {

            return;

        }


        frame.contentWindow.postMessage(
            {

                type:
                    "etag-theme-colors",

                colors:
                    {
                        ...themeColors
                    }

            },
            window.location.origin
        );

    }


    pickers.forEach(
        picker => {

            picker.addEventListener(
                "input",
                () => {

                    const key =
                        picker.dataset.themePicker;


                    themeColors[key] =
                        picker.value
                            .toUpperCase();


                    refreshControls();

                    sendThemeToPreview();

                }
            );

        }
    );


    hexInputs.forEach(
        input => {

            input.addEventListener(
                "change",
                () => {

                    const key =
                        input.dataset.themeHex;


                    themeColors[key] =
                        normalizeHex(
                            input.value,
                            themeColors[key]
                        );


                    refreshControls();

                    sendThemeToPreview();

                }
            );

        }
    );


    async function getCurrentUser()
    {

        const {
            data,
            error
        } =
            await supabase.auth.getSession();


        if (
            error
        )
        {

            throw error;

        }


        return (
            data?.session?.user ||
            null
        );

    }


    async function loadSavedTheme()
    {

        try
        {

            const user =
                await getCurrentUser();


            if (
                !user
            )
            {

                return;

            }


            const {
                data,
                error
            } =
                await supabase
                    .from(
                        "profiles"
                    )
                    .select(
                        "theme_colors"
                    )
                    .eq(
                        "id",
                        user.id
                    )
                    .maybeSingle();


            if (
                error
            )
            {

                console.error(
                    "Theme color load error:",
                    error
                );

                return;

            }


            if (
                data?.theme_colors &&
                typeof data.theme_colors ===
                    "object"
            )
            {

                themeColors =
                {

                    ...DEFAULT_THEME,

                    ...data.theme_colors

                };

            }


            refreshControls();

            sendThemeToPreview();

        }
        catch (
            error
        )
        {

            console.error(
                "Theme color loading failed:",
                error
            );

        }

    }


    async function saveTheme()
    {

        const saveButton =
            document.getElementById(
                "etagThemeSave"
            );


        if (
            saveButton
        )
        {

            saveButton.disabled =
                true;

            saveButton.textContent =
                "Saving...";

        }


        try
        {

            const user =
                await getCurrentUser();


            if (
                !user
            )
            {

                throw new Error(
                    "You must be logged in."
                );

            }


            const {
                error
            } =
                await supabase
                    .from(
                        "profiles"
                    )
                    .update(
                        {

                            theme_colors:
                                {
                                    ...themeColors
                                },

                            updated_at:
                                new Date()
                                    .toISOString()

                        }
                    )
                    .eq(
                        "id",
                        user.id
                    );


            if (
                error
            )
            {

                throw error;

            }


            if (
                saveButton
            )
            {

                saveButton.textContent =
                    "Saved";

            }


            setTimeout(
                () => {

                    if (
                        saveButton
                    )
                    {

                        saveButton.textContent =
                            "Save Theme";

                    }

                },
                1300
            );

        }
        catch (
            error
        )
        {

            console.error(
                "Theme color save error:",
                error
            );


            if (
                saveButton
            )
            {

                saveButton.disabled =
                    false;

                saveButton.textContent =
                    "Save Theme";

            }

            alert(
                error?.message ||
                "Failed to save theme colors."
            );


            return;

        }


        if (
            saveButton
        )
        {

            saveButton.disabled =
                false;

        }

    }


    document
        .getElementById(
            "etagThemeSave"
        )
        ?.addEventListener(
            "click",
            saveTheme
        );


    document
        .getElementById(
            "etagThemeReset"
        )
        ?.addEventListener(
            "click",
            () => {

                themeColors =
                {

                    ...DEFAULT_THEME

                };


                refreshControls();

                sendThemeToPreview();

            }
        );


    const originalSave =
        document.getElementById(
            "saveButton"
        );


    if (
        originalSave
    )
    {

        originalSave.addEventListener(
            "click",
            () => {

                setTimeout(
                    saveTheme,
                    700
                );

            }
        );

    }


    window.addEventListener(
        "message",
        event => {

            if (
                event.origin !==
                window.location.origin
            )
            {

                return;

            }


            if (
                event.data?.type ===
                "etag-men-preview-ready"
            )
            {

                sendThemeToPreview();

            }

        }
    );


    window.addEventListener(
        "load",
        () => {

            setTimeout(
                () => {

                    createPanel();

                    loadSavedTheme();

                },
                700
            );

        }
    );

    if (
        document.readyState !==
        "loading"
    )
    {

        setTimeout(
            () => {

                createPanel();

                loadSavedTheme();

            },
            700
        );

    }

</script>

`;


        const insertBefore =
            "</body>";


        html =
            html.replace(
                insertBefore,
                extraScript +
                insertBefore
            );


        document.open();

        document.write(
            html
        );

        document.close();

    }
)
.catch(
    error => {

        document.body.innerHTML = `

            <div
                style="
                    min-height:100vh;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    padding:24px;
                    font-family:system-ui,sans-serif;
                    color:#253027;
                    background:#d3dbc8;
                    text-align:center;
                "
            >

                Unable to load dashboard.

                <br>

                ${String(error?.message || "")}

            </div>

        `;

    }
);

</script>

</body>

</html>
