<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>E-Tag Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .app {
            width: min(100% - 24px, 1100px);
            margin: 0 auto;
            padding: 24px 0 50px;
        }

        .header {
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 6px;
            font-size: 30px;
        }

        .header p {
            margin: 0;
            color: #6b7280;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 22px;
            box-shadow:
                0 10px 35px rgba(
                    0,
                    0,
                    0,
                    0.05
                );
        }

        .card h2 {
            margin: 0 0 18px;
            font-size: 21px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 700;
        }

        .input,
        .textarea,
        .select {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 11px;
            padding: 12px 13px;
            font-size: 15px;
            outline: none;
            font-family: inherit;
            background: #ffffff;
        }

        .textarea {
            min-height: 110px;
            resize: vertical;
        }

        .input:focus,
        .textarea:focus,
        .select:focus {
            border-color: #111827;
            box-shadow:
                0 0 0 3px rgba(
                    17,
                    24,
                    39,
                    0.08
                );
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .button {
            border: 0;
            border-radius: 11px;
            padding: 13px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .primary {
            background: #111827;
            color: #ffffff;
        }

        .secondary {
            background: #eef2f7;
            color: #111827;
        }

        .message {
            display: none;
            margin-bottom: 16px;
            padding: 12px 14px;
            border-radius: 11px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .message.error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .tag-info {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .tag-badge {
            display: inline-flex;
            align-items: center;
            padding: 7px 10px;
            border-radius: 999px;
            background: #eef2f7;
            color: #374151;
            font-size: 12px;
            font-weight: 700;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .theme-option {
            position: relative;
        }

        .theme-option input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .theme-card {
            display: block;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            padding: 14px;
            cursor: pointer;
            transition:
                transform 0.15s ease,
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .theme-card:hover {
            transform: translateY(-2px);
        }

        .theme-option input:checked + .theme-card {
            border-color: #111827;
            box-shadow:
                0 8px 24px rgba(
                    0,
                    0,
                    0,
                    0.08
                );
        }

        .theme-icon {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .theme-name {
            font-weight: 800;
            font-size: 15px;
        }

        .theme-description {
            margin-top: 4px;
            font-size: 12px;
            color: #6b7280;
            line-height: 1.4;
        }

        .avatar-section {
            display: flex;
            align-items: flex-start;
            gap: 18px;
            margin-bottom: 22px;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            overflow: hidden;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            font-size: 28px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-tools {
            flex: 1;
            min-width: 0;
        }

        .file-input {
            display: none;
        }

        .upload-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 11px 14px;
            background: #eef2f7;
            color: #111827;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .upload-help {
            margin-top: 8px;
            font-size: 12px;
            line-height: 1.5;
            color: #6b7280;
        }

        .upload-status {
            margin-top: 8px;
            font-size: 12px;
            line-height: 1.5;
        }

        .preview-shell {
            background: #f5f7fb;
            border-radius: 18px;
            padding: 14px;
            min-height: 520px;
        }

        .preview-theme {
            max-width: 430px;
            margin: 0 auto;
            border-radius: 26px;
            padding: 28px 22px;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .preview-avatar {
            width: 96px;
            height: 96px;
            margin: 0 auto 16px;
            border-radius: 50%;
            overflow: hidden;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            font-size: 30px;
            font-weight: 800;
        }

        .preview-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-name {
            margin: 0;
            font-size: 28px;
            line-height: 1.2;
        }

        .preview-bio {
            margin: 10px 0 0;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .preview-type {
            display: inline-flex;
            margin-top: 12px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
        }

        .preview-actions {
            display: grid;
            gap: 10px;
            margin-top: 24px;
        }

        .preview-button {
            display: block;
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 700;
        }

        .preview-button.hidden {
            display: none;
        }

        .theme-men {
            background:
                linear-gradient(
                    160deg,
                    #111827 0%,
                    #1f2937 55%,
                    #374151 100%
                );
            color: #ffffff;
        }

        .theme-men .preview-avatar {
            border: 4px solid rgba(
                255,
                255,
                255,
                0.18
            );
        }

        .theme-men .preview-bio {
            color: #d1d5db;
        }

        .theme-men .preview-type {
            background: rgba(
                255,
                255,
                255,
                0.12
            );
            color: #f9fafb;
        }

        .theme-men .preview-button {
            background: #ffffff;
            color: #111827;
        }

        .theme-women {
            background:
                linear-gradient(
                    160deg,
                    #fff1f2 0%,
                    #fce7f3 55%,
                    #fdf2f8 100%
                );
            color: #831843;
        }

        .theme-women .preview-avatar {
            border: 4px solid rgba(
                190,
                24,
                93,
                0.12
            );
        }

        .theme-women .preview-bio {
            color: #9d174d;
        }

        .theme-women .preview-type {
            background: #fbcfe8;
            color: #9d174d;
        }

        .theme-women .preview-button {
            background: #9d174d;
            color: #ffffff;
        }

        .theme-couple {
            background:
                linear-gradient(
                    160deg,
                    #fff7ed 0%,
                    #ffe4e6 50%,
                    #fef2f2 100%
                );
            color: #7f1d1d;
        }

        .theme-couple .preview-avatar {
            border: 4px solid rgba(
                190,
                24,
                93,
                0.12
            );
        }

        .theme-couple .preview-bio {
            color: #991b1b;
        }

        .theme-couple .preview-type {
            background: #fecdd3;
            color: #9f1239;
        }

        .theme-couple .preview-button {
            background: #9f1239;
            color: #ffffff;
        }

        .theme-business {
            background:
                linear-gradient(
                    160deg,
                    #eff6ff 0%,
                    #e0f2fe 55%,
                    #f8fafc 100%
                );
            color: #0f172a;
        }

        .theme-business .preview-avatar {
            border-radius: 20px;
            border: 4px solid rgba(
                15,
                23,
                42,
                0.08
            );
        }

        .theme-business .preview-bio {
            color: #334155;
        }

        .theme-business .preview-type {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .theme-business .preview-button {
            background: #1d4ed8;
            color: #ffffff;
        }

        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #6b7280;
        }

        .hidden {
            display: none !important;
        }

        .top-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .top-actions h2 {
            margin: 0;
        }

        @media (max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .app {
                width: min(100% - 16px, 1100px);
                padding-top: 16px;
            }

            .card {
                padding: 18px;
            }

            .button-row {
                flex-direction: column;
            }

            .avatar-section {
                flex-direction: column;
            }

            .avatar-tools {
                width: 100%;
            }

            .theme-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div
        id="loadingCard"
        class="card loading"
    >
        Loading your E-Tag dashboard...
    </div>

    <div
        id="dashboard"
        class="hidden"
    >

        <header class="header">

            <h1>
                E-Tag Dashboard
            </h1>

            <p>
                Customize your public E-Tag profile.
            </p>

        </header>


        <div class="tag-info">

            <span
                id="tagBadge"
                class="tag-badge"
            >
                E-Tag
            </span>

            <span
                id="statusBadge"
                class="tag-badge"
            >
                Active
            </span>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <div class="layout">


            <section class="card">

                <h2>
                    Profile Theme
                </h2>


                <div class="field">

                    <label for="profileType">
                        Profile Type
                    </label>

                    <select
                        id="profileType"
                        class="select"
                    >

                        <option value="personal">
                            Personal
                        </option>

                        <option value="couple">
                            Couple
                        </option>

                        <option value="business">
                            Business
                        </option>

                    </select>

                </div>


                <div
                    id="themeGrid"
                    class="theme-grid"
                ></div>


                <div
                    id="avatarEditor"
                    class="field"
                    style="margin-top: 22px;"
                >

                    <label>
                        Profile Photo
                    </label>


                    <div class="avatar-section">

                        <div
                            id="avatarPreview"
                            class="avatar"
                        ></div>


                        <div class="avatar-tools">

                            <label
                                for="avatarFile"
                                class="upload-label"
                            >
                                Upload Photo
                            </label>


                            <input
                                id="avatarFile"
                                class="file-input"
                                type="file"
                                accept="image/jpeg,image/png,image/webp"
                            >


                            <div class="upload-help">
                                JPG, PNG or WEBP.
                                Maximum file size: 1 MB.
                            </div>


                            <div
                                id="uploadStatus"
                                class="upload-status"
                            ></div>

                        </div>

                    </div>

                </div>


                <div class="field">

                    <label for="displayName">
                        Name
                    </label>

                    <input
                        id="displayName"
                        class="input"
                        type="text"
                        maxlength="100"
                        placeholder="Your name"
                    >

                </div>


                <div class="field">

                    <label for="bio">
                        Short Bio
                    </label>

                    <textarea
                        id="bio"
                        class="textarea"
                        maxlength="500"
                        placeholder="Tell people about yourself..."
                    ></textarea>

                </div>


                <div class="field">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                        id="phone"
                        class="input"
                        type="tel"
                        maxlength="30"
                        placeholder="+94..."
                    >

                </div>


                <div class="field">

                    <label for="whatsapp">
                        WhatsApp
                    </label>

                    <input
                        id="whatsapp"
                        class="input"
                        type="tel"
                        maxlength="30"
                        placeholder="+94..."
                    >

                </div>


                <div class="field">

                    <label for="publicEmail">
                        Public Email
                    </label>

                    <input
                        id="publicEmail"
                        class="input"
                        type="email"
                        maxlength="150"
                        placeholder="you@example.com"
                    >

                </div>


                <div class="button-row">

                    <button
                        id="saveButton"
                        type="button"
                        class="button primary"
                    >
                        Save Profile
                    </button>

                    <button
                        id="logoutButton"
                        type="button"
                        class="button secondary"
                    >
                        Logout
                    </button>

                </div>

            </section>


            <section class="card">

                <div class="top-actions">

                    <h2>
                        Live Preview
                    </h2>

                    <button
                        id="openPublicButton"
                        type="button"
                        class="button secondary"
                    >
                        Open Public
                    </button>

                </div>


                <div class="preview-shell">

                    <div
                        id="previewTheme"
                        class="preview-theme theme-men"
                    >

                        <div
                            id="previewAvatar"
                            class="preview-avatar"
                        ></div>


                        <h1
                            id="previewName"
                            class="preview-name"
                        >
                            E-Tag User
                        </h1>


                        <div
                            id="previewType"
                            class="preview-type"
                        >
                            Personal
                        </div>


                        <p
                            id="previewBio"
                            class="preview-bio"
                        ></p>


                        <div class="preview-actions">

                            <a
                                id="previewPhone"
                                class="preview-button hidden"
                            >
                                Call
                            </a>


                            <a
                                id="previewWhatsapp"
                                class="preview-button hidden"
                                target="_blank"
                                rel="noopener"
                            >
                                WhatsApp
                            </a>


                            <a
                                id="previewEmail"
                                class="preview-button hidden"
                            >
                                Email
                            </a>

                        </div>

                    </div>

                </div>

            </section>

        </div>

    </div>

</div>

    const tagBadge =

    let currentUser =

    let selectedTemplate =

    const THEME_OPTIONS = {

        personal: [

                name:

                icon:
                    "👤",

                description:
                    "Clean modern personal style."
            },

                description:

        ],

                    "❤️",

                description:

            }
        ],

            }
        ]
    };


    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            `message show ${type}`;
    }


    function clearMessage() {

        message.textContent =
            "";

        message.className =
            "message";
    }


    function setUploadStatus(
        text,
        success = false
    ) {

        uploadStatus.textContent =
            text;

        uploadStatus.style.color =
            success
                ? "#065f46"
                : "#6b7280";
    }


    function getInitials(
        name
    ) {

        const words =
            String(
                name || ""
            )
                .trim()
                .split(
                    /\s+/
                )
                .filter(
                    Boolean
                );


        if (
            words.length === 0
        ) {

            return "?";
        }


        if (
            words.length === 1
        ) {

            return words[0]
                .substring(
                    0,
                    2
                )
                .toUpperCase();
        }


        return (
            words[0][0] +
            words[
                words.length - 1
            ][0]
        ).toUpperCase();
    }


    function escapeAttribute(
        value
    ) {

        return String(value)
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            );
    }


    function updateAvatar(
        element,
        name,
        imageUrl
    ) {

        if (
            imageUrl
        ) {

            element.innerHTML =
                `
                    <img
                        src="${escapeAttribute(
                            imageUrl
                        )}"
                        alt="${escapeAttribute(
                            name ||
                            "Profile"
                        )}"
                    >
                `;

        } else {

            element.textContent =
                getInitials(
                    name
                );
        }
    }


    function normalizeTemplate(
        value
    ) {

        const normalized =
            String(
                value || ""
            )
                .trim()
                .toLowerCase();


        if (
            normalized === "boy"
        ) {

            return "men";
        }


        if (
            normalized === "girl"
        ) {

            return "women";
        }


        if (
            [
                "men",
                "women",
                "couple",
                "business"
            ].includes(
                normalized
            )
        ) {

            return normalized;
        }


        return "men";
    }


    function renderThemeOptions() {

        const type =
            profileType.value;


        const options =
            THEME_OPTIONS[
                type
            ] ||
            THEME_OPTIONS.personal;


        themeGrid.innerHTML =
            "";


        options.forEach(
            (
                option
            ) => {

                const wrapper =
                    document.createElement(
                        "div"
                    );


                wrapper.className =
                    "theme-option";


                const input =
                    document.createElement(
                        "input"
                    );


                input.type =
                    "radio";

                input.name =
                    "theme";

                input.value =
                    option.id;

                input.id =
                    `theme-${option.id}`;


                const current =
                    normalizeTemplate(
                        selectedTemplate
                    );


                input.checked =
                    current ===
                    option.id;


                input.addEventListener(
                    "change",
                    () => {

                        selectedTemplate =
                            input.value;

                        updatePreview();
                    }
                );


                const label =
                    document.createElement(
                        "label"
                    );


                label.className =
                    "theme-card";

                label.htmlFor =
                    input.id;


                label.innerHTML =
                    `
                        <div class="theme-icon">
                            ${option.icon}
                        </div>

                        <div class="theme-name">
                            ${option.name}
                        </div>

                        <div class="theme-description">
                            ${option.description}
                        </div>
                    `;


                wrapper.appendChild(
                    input
                );

                wrapper.appendChild(
                    label
                );

                themeGrid.appendChild(
                    wrapper
                );
            }
        );
    }


    function updatePreview() {

        const theme =
            normalizeTemplate(
                selectedTemplate
            );


        previewTheme.classList.remove(
            "theme-men",
            "theme-women",
            "theme-couple",
            "theme-business"
        );


        previewTheme.classList.add(
            `theme-${theme}`
        );


        const name =
            displayName.value.trim() ||
            "E-Tag User";


        previewName.textContent =
            name;


        previewBio.textContent =
            bio.value.trim();


        const typeLabel =
            profileType.value ===
            "business"
                ? "Business"
                : profileType.value ===
                    "couple"
                    ? "Couple"
                    : theme ===
                        "women"
                        ? "Personal · Women"
                        : "Personal · Men";


        previewType.textContent =
            typeLabel;


        updateAvatar(
            previewAvatar,
            name,
            currentAvatarUrl
        );


        const phoneValue =
            phone.value.trim();


        if (
            phoneValue
        ) {

            previewPhone.href =
                `tel:${encodeURIComponent(
                    phoneValue
                )}`;

            previewPhone.classList.remove(
                "hidden"
            );

        } else {

            previewPhone.classList.add(
                "hidden"
            );
        }


        const whatsappValue =
            whatsapp.value.trim();


        if (
            whatsappValue
        ) {

            const number =
                whatsappValue.replace(
                    /\D/g,
                    ""
                );


            if (
                number
            ) {

                previewWhatsapp.href =
                    `https://wa.me/${number}`;

                previewWhatsapp.classList.remove(
                    "hidden"
                );

            } else {

                previewWhatsapp.classList.add(
                    "hidden"
                );
            }

        } else {

            previewWhatsapp.classList.add(
                "hidden"
            );
        }


        const emailValue =
            publicEmail.value.trim();


        if (
            emailValue
        ) {

            previewEmail.href =
                `mailto:${encodeURIComponent(
                    emailValue
                )}`;

            previewEmail.classList.remove(
                "hidden"
            );

        } else {

            previewEmail.classList.add(
                "hidden"
            );
        }
    }


    function fillForm(
        profile
    ) {

        displayName.value =
            profile.display_name ||
            "";

        bio.value =
            profile.bio ||
            "";

        phone.value =
            profile.phone ||
            "";

        whatsapp.value =
            profile.whatsapp ||
            "";

        publicEmail.value =
            profile.email ||
            "";

        profileType.value =
            profile.profile_type ||
            "personal";


        selectedTemplate =
            normalizeTemplate(
                profile.template
            );


        currentAvatarUrl =
            profile.avatar_url ||
            "";


        renderThemeOptions();


        updateAvatar(
            avatarPreview,
            displayName.value,
            currentAvatarUrl
        );


        updatePreview();
    }


    async function loadDashboard() {

        const {
            data: sessionData,
            error: sessionError
        } =
            await supabase.auth.getSession();


        if (
            sessionError
        ) {

            loadingCard.textContent =
                "Unable to load your session.";

            return;
        }


        const user =
            sessionData?.session?.user;


        if (
            !user
        ) {

            window.location.replace(
                "/E-Tag/"
            );

            return;
        }


        currentUser =
            user;


        const {
            data: tag,
            error: tagError
        } =
            await supabase
                .from(
                    "nfc_tags"
                )
                .select(
                    "id,tag_code,owner_id,active"
                )
                .eq(
                    "owner_id",
                    user.id
                )
                .eq(
                    "active",
                    true
                )
                .limit(1)
                .maybeSingle();


        if (
            tagError
        ) {

            loadingCard.textContent =
                `Unable to load your E-Tag: ${tagError.message}`;

            return;
        }


        if (
            !tag
        ) {

            loadingCard.textContent =
                "No active E-Tag is connected to this account.";

            return;
        }


        currentTag =
            tag;


        tagBadge.textContent =
            tag.tag_code;


        statusBadge.textContent =
            "Active";


        const {
            data: profile,
            error: profileError
        } =
            await supabase
                .from(
                    "profiles"
                )
                .select(
                    "id,display_name,bio,phone,whatsapp,email,profile_type,avatar_url,created_at,updated_at,template"
                )
                .eq(
                    "id",
                    user.id
                )
                .maybeSingle();


        if (
            profileError
        ) {

            loadingCard.textContent =
                `Unable to load profile: ${profileError.message}`;

            return;
        }


        if (
            profile
        ) {

            profileExists =
                true;

            fillForm(
                profile
            );

        } else {

            profileExists =
                false;

            fillForm(
                {
                    display_name:
                        "",

                    bio:
                        "",

                    phone:
                        "",

                    whatsapp:
                        "",

                    email:
                        "",

                    profile_type:
                        "personal",

                    avatar_url:
                        "",

                    template:
                        "men"
                }
            );
        }


        openPublicButton.dataset.url =
            `${window.location.origin}/E-Tag/?tag=${encodeURIComponent(
                tag.tag_code
            )}`;


        loadingCard.classList.add(
            "hidden"
        );

        dashboard.classList.remove(
            "hidden"
        );
    }


    async function uploadAvatar(
        file
    ) {

        if (
            !file
        ) {

            return null;
        }


        if (
            !ALLOWED_TYPES.has(
                file.type
            )
        ) {

            throw new Error(
                "Only JPG, PNG and WEBP images are allowed."
            );
        }


        if (
            file.size >
            MAX_FILE_SIZE
        ) {

            throw new Error(
                "Image must be 1 MB or smaller."
            );
        }


        setUploadStatus(
            "Preparing upload..."
        );


        const {
            data: sessionData,
            error: sessionError
        } =
            await supabase.auth.getSession();


        if (
            sessionError ||
            !sessionData.session
        ) {

            throw new Error(
                "Your login session has expired."
            );
        }


        const accessToken =
            sessionData.session.access_token;


        const response =
            await fetch(
                AVATAR_UPLOAD_FUNCTION,
                {
                    method:
                        "POST",

                    headers: {
                        "Authorization":
                            `Bearer ${accessToken}`,

                        "apikey":
                            SUPABASE_PUBLISHABLE_KEY,

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            {
                                fileName:
                                    file.name,

                                contentType:
                                    file.type,

                                fileSize:
                                    file.size
                            }
                        )
                }
            );


        let result =
            null;


        try {

            result =
                await response.json();

        } catch {

            result =
                null;
        }


        if (
            !response.ok ||
            !result?.success
        ) {

            throw new Error(
                result?.message ||
                `Upload URL request failed (${response.status}).`
            );
        }


        const uploadUrl =
            result.uploadUrl;


        const objectKey =
            result.objectKey;


        if (
            !uploadUrl ||
            !objectKey
        ) {

            throw new Error(
                "Invalid upload URL returned by the Edge Function."
            );
        }


        setUploadStatus(
            "Uploading photo..."
        );


        const uploadResponse =
            await fetch(
                uploadUrl,
                {
                    method:
                        "PUT",

                    headers: {
                        "Content-Type":
                            file.type
                    },

                    body:
                        file
                }
            );


        if (
            !uploadResponse.ok
        ) {

            throw new Error(
                `R2 upload failed (${uploadResponse.status}).`
            );
        }


        currentAvatarUrl =
            `${R2_PUBLIC_URL}/${objectKey}`;


        updateAvatar(
            avatarPreview,
            displayName.value.trim() ||
                "E-Tag User",
            currentAvatarUrl
        );


        updatePreview();


        setUploadStatus(
            "Photo uploaded successfully. Click Save Profile.",
            true
        );


        return currentAvatarUrl;
    }


    async function reloadStoredProfile() {

        const {
            data,
            error
        } =
            await supabase
                .from(
                    "profiles"
                )
                .select(
                    "id,display_name,bio,phone,whatsapp,email,profile_type,avatar_url,created_at,updated_at,template"
                )
                .eq(
                    "id",
                    currentUser.id
                )
                .maybeSingle();


        if (
            error
        ) {

            throw error;
        }


        if (
            !data
        ) {

            throw new Error(
                "Profile was not found after saving."
            );
        }


        profileExists =
            true;


        fillForm(
            data
        );


        return data;
    }


    async function saveProfile() {

        if (
            !currentUser
        ) {

            return;
        }


        clearMessage();


        saveButton.disabled =
            true;

        saveButton.textContent =
            "Saving...";


        try {

            const now =
                new Date().toISOString();


            const profileData = {

                display_name:
                    displayName.value.trim(),

                bio:
                    bio.value.trim(),

                phone:
                    phone.value.trim(),

                whatsapp:
                    whatsapp.value.trim(),

                email:
                    publicEmail.value.trim(),

                profile_type:
                    profileType.value,

                avatar_url:
                    currentAvatarUrl ||
                    null,

                template:
                    normalizeTemplate(
                        selectedTemplate
                    ),

                updated_at:
                    now
            };


            if (
                profileExists
            ) {

                const {
                    error:
                        updateError
                } =
                    await supabase
                        .from(
                            "profiles"
                        )
                        .update(
                            profileData
                        )
                        .eq(
                            "id",
                            currentUser.id
                        );


                if (
                    updateError
                ) {

                    throw updateError;
                }

            } else {

                const {
                    error:
                        insertError
                } =
                    await supabase
                        .from(
                            "profiles"
                        )
                        .insert(
                            {
                                id:
                                    currentUser.id,

                                ...profileData,

                                created_at:
                                    now
                            }
                        );


                if (
                    insertError
                ) {

                    throw insertError;
                }
            }


            const stored =
                await reloadStoredProfile();


            if (
                normalizeTemplate(
                    stored.template
                ) !==
                normalizeTemplate(
                    selectedTemplate
                )
            ) {

                throw new Error(
                    "Theme was not stored correctly."
                );
            }


            showMessage(
                "Profile and theme saved successfully.",
                "success"
            );


            avatarFile.value =
                "";

        } catch (
            error
        ) {

            console.error(
                "Save profile error:",
                error
            );


            showMessage(
                `Failed to save profile: ${error.message}${
                    error.code
                        ? ` (code: ${error.code})`
                        : ""
                }`,
                "error"
            );

        } finally {

            saveButton.disabled =
                false;

            saveButton.textContent =
                "Save Profile";
        }
    }


    profileType.addEventListener(
        "change",
        () => {

            const available =
                THEME_OPTIONS[
                    profileType.value
                ] ||
                THEME_OPTIONS.personal;


            const exists =
                available.some(
                    (
                        option
                    ) =>
                        option.id ===
                        normalizeTemplate(
                            selectedTemplate
                        )
                );


            if (
                !exists
            ) {

                selectedTemplate =
                    available[0].id;
            }


            renderThemeOptions();

            updatePreview();
        }
    );


    avatarFile.addEventListener(
        "change",
        async () => {

            const file =
                avatarFile.files?.[0];


            if (
                !file
            ) {

                return;
            }


            try {

                await uploadAvatar(
                    file
                );

            } catch (
                error
            ) {

                console.error(
                    "Avatar upload error:",
                    error
                );


                setUploadStatus(
                    error.message
                );


                avatarFile.value =
                    "";

                await reloadStoredProfile();
            }
        }
    );


    [
        displayName,
        bio,
        phone,
        whatsapp,
        publicEmail
    ].forEach(
        (
            element
        ) => {

            element.addEventListener(
                "input",
                updatePreview
            );
        }
    );


    saveButton.addEventListener(
        "click",
        saveProfile
    );


    logoutButton.addEventListener(
        "click",
        async () => {

            const tagCode =
                currentTag?.tag_code;


            await supabase.auth.signOut();


            if (
                tagCode
            ) {

                window.location.replace(
                    `/E-Tag/?tag=${encodeURIComponent(
                        tagCode
                    )}`
                );

            } else {

                window.location.replace(
                    "/E-Tag/"
                );
            }
        }
    );


    openPublicButton.addEventListener(
        "click",
        () => {

            const url =
                openPublicButton.dataset.url;


            if (
                url
            ) {

                window.open(
                    url,
                    "_blank",
                    "noopener,noreferrer"
                );
            }
        }
    );


    supabase.auth.onAuthStateChange(
        (
            event,
            session
        ) => {

            if (
                event ===
                "SIGNED_OUT"
            ) {

                const tagCode =
                    currentTag?.tag_code;


                if (
                    tagCode
                ) {

                    window.location.replace(
                        `/E-Tag/?tag=${encodeURIComponent(
                            tagCode
                        )}`
                    );

                } else {

                    window.location.replace(
                        "/E-Tag/"
                    );
                }
            }
        }
    );


    loadDashboard();

</script>
