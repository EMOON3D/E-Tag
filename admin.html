<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>E-Tag Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f7fb;
            color: #111827;
        }

        .container {
            width: min(100% - 32px, 900px);
            margin: 0 auto;
            padding: 40px 0;
        }

        .header {
            margin-bottom: 28px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 32px;
            line-height: 1.2;
        }

        .header p {
            margin: 0;
            color: #6b7280;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.04);
        }

        .card h2 {
            margin: 0 0 18px;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input {
            width: 100%;
            min-width: 0;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #111827;
            box-shadow:
                0 0 0 3px
                rgba(17, 24, 39, 0.08);
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .primary-btn {
            background: #111827;
            color: #ffffff;
        }

        .secondary-btn {
            background: #eef2f7;
            color: #111827;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .result {
            display: none;
            margin-top: 20px;
            padding: 18px;
            border: 1px solid #dbeafe;
            background: #eff6ff;
            border-radius: 14px;
        }

        .result.show {
            display: block;
        }

        .result-row {
            margin-bottom: 14px;
        }

        .result-row:last-child {
            margin-bottom: 0;
        }

        .result-label {
            display: block;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .result-value {
            font-weight: 600;
            word-break: break-word;
        }

        .url-box {
            display: flex;
            gap: 8px;
        }

        .url-box input {
            background: #ffffff;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th,
        td {
            padding: 13px 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        th {
            font-size: 12px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            background: #f9fafb;
        }

        .status {
            display: inline-flex;
            align-items: center;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .status.active {
            background: #dcfce7;
            color: #166534;
        }

        .status.inactive {
            background: #fef3c7;
            color: #92400e;
        }

        .table-actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .small-btn {
            padding: 8px 10px;
            font-size: 12px;
        }

        .empty {
            text-align: center;
            padding: 30px 15px;
            color: #6b7280;
        }

        .top-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        @media (max-width: 640px) {

            .container {
                width: min(100% - 20px, 900px);
                padding: 24px 0;
            }

            .card {
                padding: 18px;
            }

            .header h1 {
                font-size: 27px;
            }

            .input-row {
                flex-direction: column;
            }

            .url-box {
                flex-direction: column;
            }

            .top-actions {
                align-items: stretch;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header class="header">
        <h1>E-Tag Admin</h1>
        <p>Create and manage physical E-Tags.</p>
    </header>


    <section class="card">

        <h2>Generate E-Tag</h2>

        <div class="form-group">

            <label for="tagCode">
                Tag ID
            </label>

            <div class="input-row">

                <input
                    id="tagCode"
                    type="text"
                    placeholder="ETAG-000002"
                    maxlength="30"
                    autocomplete="off"
                    spellcheck="false"
                >

                <button
                    id="generateBtn"
                    class="primary-btn"
                    type="button"
                >
                    Generate E-Tag
                </button>

            </div>

        </div>

        <div
            id="message"
            class="message"
            role="alert"
        ></div>


        <div
            id="result"
            class="result"
        >

            <div class="result-row">

                <span class="result-label">
                    Tag ID
                </span>

                <div
                    id="resultTagCode"
                    class="result-value"
                ></div>

            </div>


            <div class="result-row">

                <span class="result-label">
                    Status
                </span>

                <div
                    id="resultStatus"
                    class="result-value"
                ></div>

            </div>


            <div class="result-row">

                <span class="result-label">
                    Public URL
                </span>

                <div class="url-box">

                    <input
                        id="resultUrl"
                        type="text"
                        readonly
                    >

                    <button
                        id="copyBtn"
                        type="button"
                        class="secondary-btn"
                    >
                        Copy
                    </button>

                    <button
                        id="openBtn"
                        type="button"
                        class="secondary-btn"
                    >
                        Open
                    </button>

                </div>

            </div>

        </div>

    </section>


    <section class="card">

        <div class="top-actions">

            <h2 style="margin: 0;">
                Existing E-Tags
            </h2>

            <button
                id="refreshBtn"
                type="button"
                class="secondary-btn"
            >
                Refresh
            </button>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>Tag ID</th>
                        <th>Status</th>
                        <th>Owner</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="tagsTableBody">

                    <tr>
                        <td
                            colspan="5"
                            class="empty"
                        >
                            Loading E-Tags...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</div>


<script type="module">

    import {
        createClient
    } from
        "https://esm.sh/@supabase/supabase-js@2";


    const SUPABASE_URL =
        "https://zuptxhcjzhqynrquyray.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_1sa0MtE83MZXETR5JLakJA_fRVrjDJI";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    const tagCodeInput =
        document.getElementById(
            "tagCode"
        );

    const generateBtn =
        document.getElementById(
            "generateBtn"
        );

    const refreshBtn =
        document.getElementById(
            "refreshBtn"
        );

    const message =
        document.getElementById(
            "message"
        );

    const result =
        document.getElementById(
            "result"
        );

    const resultTagCode =
        document.getElementById(
            "resultTagCode"
        );

    const resultStatus =
        document.getElementById(
            "resultStatus"
        );

    const resultUrl =
        document.getElementById(
            "resultUrl"
        );

    const copyBtn =
        document.getElementById(
            "copyBtn"
        );

    const openBtn =
        document.getElementById(
            "openBtn"
        );

    const tagsTableBody =
        document.getElementById(
            "tagsTableBody"
        );


    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            `message ${type}`;
    }


    function clearMessage() {

        message.textContent =
            "";

        message.className =
            "message";
    }


    function normalizeTagCode(
        value
    ) {

        return value
            .trim()
            .toUpperCase();
    }


    function validateTagCode(
        tagCode
    ) {

        if (!tagCode) {

            return "Please enter an E-Tag ID.";
        }


        if (
            tagCode.length >
            30
        ) {

            return
                "Tag ID cannot be longer than 30 characters.";
        }


        if (
            !/^[A-Z0-9_-]+$/.test(
                tagCode
            )
        ) {

            return
                "Only A-Z, 0-9, underscore (_) and hyphen (-) are allowed.";
        }


        return null;
    }


    async function createETag() {

        clearMessage();


        const tagCode =
            normalizeTagCode(
                tagCodeInput.value
            );


        const validationError =
            validateTagCode(
                tagCode
            );


        if (
            validationError
        ) {

            showMessage(
                validationError,
                "error"
            );

            return;
        }


        generateBtn.disabled =
            true;

        generateBtn.textContent =
            "Creating...";


        try {

            const {
                data,
                error
            } =
                await supabase.functions.invoke(
                    "create-etag",
                    {
                        body: {
                            tag_code:
                                tagCode
                        }
                    }
                );


            if (error) {

                console.error(
                    "create-etag error:",
                    error
                );

                throw error;
            }


            if (
                !data ||
                !data.success
            ) {

                throw new Error(
                    data?.message ||
                    "Failed to create E-Tag."
                );
            }


            resultTagCode.textContent =
                data.tag?.tag_code ||
                tagCode;


            resultStatus.textContent =
                data.tag?.active
                    ? "Active"
                    : "Unactivated";


            resultUrl.value =
                data.url ||
                "";


            result.classList.add(
                "show"
            );


            showMessage(
                data.message ||
                "E-Tag created successfully.",
                "success"
            );


            tagCodeInput.value =
                "";


            await loadTags();

        } catch (error) {

            console.error(
                "Generate E-Tag failed:",
                error
            );


            showMessage(
                error?.message ||
                "Unable to connect to the create-etag function.",
                "error"
            );

        } finally {

            generateBtn.disabled =
                false;

            generateBtn.textContent =
                "Generate E-Tag";
        }
    }


    async function loadTags() {

        refreshBtn.disabled =
            true;

        refreshBtn.textContent =
            "Loading...";


        try {

            const {
                data,
                error
            } =
                await supabase
                    .from("nfc_tags")
                    .select(
                        "id,tag_code,owner_id,active,created_at"
                    )
                    .order(
                        "created_at",
                        {
                            ascending:
                                false
                        }
                    );


            if (error) {

                throw error;
            }


            renderTags(
                data || []
            );

        } catch (error) {

            console.error(
                "loadTags error:",
                error
            );


            tagsTableBody.innerHTML = `
                <tr>
                    <td
                        colspan="5"
                        class="empty"
                    >
                        Failed to load E-Tags.
                    </td>
                </tr>
            `;

        } finally {

            refreshBtn.disabled =
                false;

            refreshBtn.textContent =
                "Refresh";
        }
    }


    function renderTags(
        tags
    ) {

        if (
            !tags ||
            tags.length === 0
        ) {

            tagsTableBody.innerHTML = `
                <tr>
                    <td
                        colspan="5"
                        class="empty"
                    >
                        No E-Tags found.
                    </td>
                </tr>
            `;

            return;
        }


        tagsTableBody.innerHTML =
            tags.map(
                (tag) => {

                    const publicUrl =
                        `https://emoon3d.github.io/E-Tag/id/${encodeURIComponent(
                            tag.tag_code
                        )}`;


                    const statusClass =
                        tag.active
                            ? "active"
                            : "inactive";


                    const statusText =
                        tag.active
                            ? "Active"
                            : "Unactivated";


                    const ownerText =
                        tag.owner_id
                            ? tag.owner_id
                            : "Unassigned";


                    const createdDate =
                        tag.created_at
                            ? new Date(
                                tag.created_at
                            ).toLocaleString()
                            : "-";


                    return `
                        <tr>

                            <td>
                                <strong>
                                    ${escapeHtml(
                                        tag.tag_code
                                    )}
                                </strong>
                            </td>

                            <td>

                                <span
                                    class="status ${statusClass}"
                                >
                                    ${statusText}
                                </span>

                            </td>

                            <td>
                                ${escapeHtml(
                                    ownerText
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    createdDate
                                )}
                            </td>

                            <td>

                                <div
                                    class="table-actions"
                                >

                                    <button
                                        type="button"
                                        class="secondary-btn small-btn"
                                        data-copy-url="${escapeAttribute(
                                            publicUrl
                                        )}"
                                    >
                                        Copy
                                    </button>

                                    <button
                                        type="button"
                                        class="secondary-btn small-btn"
                                        data-open-url="${escapeAttribute(
                                            publicUrl
                                        )}"
                                    >
                                        Open
                                    </button>

                                </div>

                            </td>

                        </tr>
                    `;
                }
            ).join("");
    }


    function escapeHtml(
        value
    ) {

        return String(value)
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );
    }


    function escapeAttribute(
        value
    ) {

        return escapeHtml(
            value
        );
    }


    async function copyText(
        text
    ) {

        if (!text) {
            return;
        }


        try {

            await navigator.clipboard.writeText(
                text
            );

            showMessage(
                "URL copied to clipboard.",
                "success"
            );

        } catch {

            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.value =
                text;


            textarea.style.position =
                "fixed";

            textarea.style.left =
                "-9999px";


            document.body.appendChild(
                textarea
            );


            textarea.select();


            document.execCommand(
                "copy"
            );


            textarea.remove();


            showMessage(
                "URL copied to clipboard.",
                "success"
            );
        }
    }


    copyBtn.addEventListener(
        "click",
        async () => {

            await copyText(
                resultUrl.value.trim()
            );
        }
    );


    openBtn.addEventListener(
        "click",
        () => {

            const url =
                resultUrl.value.trim();


            if (!url) {
                return;
            }


            window.open(
                url,
                "_blank",
                "noopener,noreferrer"
            );
        }
    );


    generateBtn.addEventListener(
        "click",
        createETag
    );


    tagCodeInput.addEventListener(
        "keydown",
        (event) => {

            if (
                event.key ===
                "Enter"
            ) {

                event.preventDefault();

                createETag();
            }
        }
    );


    refreshBtn.addEventListener(
        "click",
        loadTags
    );


    tagsTableBody.addEventListener(
        "click",
        async (event) => {

            const target =
                event.target;


            if (
                !(target instanceof
                    HTMLElement)
            ) {

                return;
            }


            const copyUrl =
                target.getAttribute(
                    "data-copy-url"
                );


            if (copyUrl) {

                await copyText(
                    copyUrl
                );

                return;
            }


            const openUrl =
                target.getAttribute(
                    "data-open-url"
                );


            if (openUrl) {

                window.open(
                    openUrl,
                    "_blank",
                    "noopener,noreferrer"
                );
            }
        }
    );


    loadTags();

</script>

</body>
</html>
