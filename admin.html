<div class="container">

     CREATE TAG

<section class="card">


<h2>

<p

"

<!-- =====================================================

<section class="card">


<h2>
All E-Tags
</h2>

id="tagCount"
class="count"
>
Loading...
</div>

id="refreshButton"
class="secondary refresh"
>
Refresh
</button>

id="tagsContainer"
class="tag-list"
>
Loading...
</div>


</section>


</div>



<script type="module">


/* =====================================================
   SUPABASE
===================================================== */

import {
  createClient
} from
"https://esm.sh/@supabase/supabase-js@2";



/*
   IMPORTANT

   Use the SAME Supabase URL and ANON KEY
   that you use inside supabase.js.

   If your existing supabase.js already contains
   these values, you can also import from "./supabase.js".
*/


import {
  supabase
} from "./supabase.js";



/* =====================================================
   CONFIG
===================================================== */

const CREATE_FUNCTION =
"create-etag";


const SITE_URL =
"https://emoon3d.github.io/E-Tag/";



/* =====================================================
   ELEMENTS
===================================================== */

const tagCodeInput =
document.getElementById(
  "tagCode"
);


const createButton =
document.getElementById(
  "createButton"
);


const createMessage =
document.getElementById(
  "createMessage"
);


const generatedBox =
document.getElementById(
  "generatedBox"
);


const generatedUrl =
document.getElementById(
  "generatedUrl"
);


const copyButton =
document.getElementById(
  "copyButton"
);


const openButton =
document.getElementById(
  "openButton"
);


const tagsContainer =
document.getElementById(
  "tagsContainer"
);


const tagCount =
document.getElementById(
  "tagCount"
);


const refreshButton =
document.getElementById(
  "refreshButton"
);



let lastGeneratedUrl = "";



/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  element,
  text,
  type
) {

  element.textContent =
    text;

  element.className =
    "message " + type;

}



function hideMessage(
  element
) {

  element.textContent =
    "";

  element.className =
    "message";

}



/* =====================================================
   NORMALIZE TAG
===================================================== */

function normalizeTagCode(
  value
) {

  return String(
    value || ""
  )
    .trim()
    .toUpperCase();

}



/* =====================================================
   VALIDATE TAG
===================================================== */

function validateTagCode(
  tagCode
) {


  if (!tagCode) {

    return "Tag ID is required.";

  }


  if (
    !/^[A-Z0-9_-]+$/.test(
      tagCode
    )
  ) {

    return
      "Use only A-Z, 0-9, - or _.";

  }


  if (
    tagCode.length > 30
  ) {

    return
      "Tag ID cannot be longer than 30 characters.";

  }


  return null;

}



/* =====================================================
   CREATE TAG
===================================================== */

createButton.addEventListener(
  "click",
  async () => {


    hideMessage(
      createMessage
    );


    generatedBox
      .classList
      .add("hidden");


    const tagCode =
      normalizeTagCode(
        tagCodeInput.value
      );


    const validation =
      validateTagCode(
        tagCode
      );


    if (validation) {

      showMessage(
        createMessage,
        validation,
        "error"
      );

      return;

    }


    createButton.disabled =
      true;


    createButton.textContent =
      "Creating E-Tag...";


    try {


      /*
         IMPORTANT:

         No admin key.
         No password.
         No login.

         The Edge Function itself creates
         the tag using the Supabase service role.
      */


      const {
        data,
        error
      } =
        await supabase
          .functions
          .invoke(
            CREATE_FUNCTION,
            {
              body: {
                tag_code:
                  tagCode
              }
            }
          );



      /* ===============================================
         EDGE FUNCTION ERROR
      =============================================== */

      if (error) {

        console.error(
          "CREATE ETAG ERROR:",
          error
        );


        let message =
          error.message ||
          "Could not create E-Tag.";


        /*
           Supabase sometimes returns
           "Failed to send a request to the Edge Function"
           when the function is not deployed correctly,
           has a runtime error, or is not reachable.
        */


        showMessage(
          createMessage,
          message,
          "error"
        );


        return;

      }



      /* ===============================================
         FUNCTION RESPONSE ERROR
      =============================================== */

      if (
        !data ||
        data.success !== true
      ) {


        showMessage(
          createMessage,
          data?.error ||
            "Could not create E-Tag.",
          "error"
        );


        return;

      }



      /* ===============================================
         SUCCESS
      =============================================== */

      const url =
        data.url ||
        (
          SITE_URL +
          "id/" +
          encodeURIComponent(
            tagCode
          )
        );


      lastGeneratedUrl =
        url;


      generatedUrl.textContent =
        url;


      generatedBox
        .classList
        .remove(
          "hidden"
        );


      showMessage(
        createMessage,
        "E-Tag created successfully.",
        "success"
      );


      tagCodeInput.value =
        "";


      await loadTags();


    } catch (error) {


      console.error(
        "CREATE ETAG ERROR:",
        error
      );


      showMessage(
        createMessage,
        error?.message ||
          "Could not create E-Tag.",
        "error"
      );


    } finally {


      createButton.disabled =
        false;


      createButton.textContent =
        "Generate E-Tag";

    }

  }
);



/* =====================================================
   ENTER KEY
===================================================== */

tagCodeInput.addEventListener(
  "keydown",
  event => {


    if (
      event.key ===
      "Enter"
    ) {


      event.preventDefault();


      createButton.click();

    }

  }
);



/* =====================================================
   COPY GENERATED URL
===================================================== */

copyButton.addEventListener(
  "click",
  async () => {


    if (
      !lastGeneratedUrl
    ) {

      return;

    }


    await copyText(
      lastGeneratedUrl
    );


    copyButton.textContent =
      "Copied!";


    setTimeout(
      () => {

        copyButton.textContent =
          "Copy URL";

      },
      1500
    );

  }
);



/* =====================================================
   OPEN GENERATED URL
===================================================== */

openButton.addEventListener(
  "click",
  () => {


    if (
      !lastGeneratedUrl
    ) {

      return;

    }


    window.open(
      lastGeneratedUrl,
      "_blank"
    );

  }
);



/* =====================================================
   REFRESH
===================================================== */

refreshButton.addEventListener(
  "click",
  async () => {


    refreshButton.disabled =
      true;


    refreshButton.textContent =
      "Loading...";


    await loadTags();


    refreshButton.disabled =
      false;


    refreshButton.textContent =
      "Refresh";

  }
);



/* =====================================================
   LOAD TAGS
===================================================== */

async function loadTags() {


  tagsContainer.innerHTML =
    `
      <div class="loading">
        Loading E-Tags...
      </div>
    `;


  tagCount.textContent =
    "Loading...";


  try {


    const {
      data,
      error
    } =
      await supabase
        .from("nfc_tags")
        .select(
          "id,tag_code,owner_id,active,created_at"
        )
        .order(
          "created_at",
          {
            ascending:
              false
          }
        );


    if (error) {


      console.error(
        "LOAD TAGS ERROR:",
        error
      );


      tagsContainer.innerHTML =
        `
          <div class="empty">
            Unable to load E-Tags.
          </div>
        `;


      tagCount.textContent =
        "";


      return;

    }



    /* ===============================================
       NO TAGS
    =============================================== */

    if (
      !data ||
      data.length === 0
    ) {


      tagsContainer.innerHTML =
        `
          <div class="empty">
            No E-Tags created yet.
          </div>
        `;


      tagCount.textContent =
        "0 E-Tags";


      return;

    }



    /* ===============================================
       COUNT
    =============================================== */

    tagCount.textContent =
      `${data.length} E-Tag${
        data.length === 1
          ? ""
          : "s"
      }`;



    tagsContainer.innerHTML =
      "";



    /* ===============================================
       CREATE TAG CARDS
    =============================================== */

    data.forEach(
      tag => {


        const div =
          document.createElement(
            "div"
          );


        div.className =
          "tag";



        const code =
          escapeHtml(
            tag.tag_code
          );



        const url =
          SITE_URL +
          "id/" +
          encodeURIComponent(
            tag.tag_code
          );



        const statusClass =
          tag.active
            ? "active"
            : "inactive";


        const ownerClass =
          tag.owner_id
            ? "assigned"
            : "unassigned";


        const statusText =
          tag.active
            ? "Active"
            : "Inactive";


        const ownerText =
          tag.owner_id
            ? "Assigned"
            : "Unassigned";



        div.innerHTML = `

          <div class="tag-code">
            ${code}
          </div>

          <div
            class="tag-status ${statusClass}"
          >
            ${statusText}
          </div>

          <div
            class="tag-status ${ownerClass}"
            style="margin-top:4px;"
          >
            ${ownerText}
          </div>

          <div class="tag-url">
            ${escapeHtml(url)}
          </div>

          <div class="row">

            <button
              class="copy-existing secondary"
              data-url="${escapeHtml(url)}"
            >
              Copy URL
            </button>

            <button
              class="open-existing"
              data-url="${escapeHtml(url)}"
            >
              Open
            </button>

          </div>

        `;


        tagsContainer.appendChild(
          div
        );

      }
    );



    /* ===============================================
       COPY BUTTONS
    =============================================== */

    document
      .querySelectorAll(
        ".copy-existing"
      )
      .forEach(
        button => {


          button.addEventListener(
            "click",
            async () => {


              const url =
                button.dataset.url;


              await copyText(
                url
              );


              button.textContent =
                "Copied!";


              setTimeout(
                () => {

                  button.textContent =
                    "Copy URL";

                },
                1500
              );

            }
          );

        }
      );



    /* ===============================================
       OPEN BUTTONS
    =============================================== */

    document
      .querySelectorAll(
        ".open-existing"
      )
      .forEach(
        button => {


          button.addEventListener(
            "click",
            () => {


              const url =
                button.dataset.url;


              window.open(
                url,
                "_blank"
              );

            }
          );

        }
      );


  } catch (error) {


    console.error(
      "LOAD TAGS ERROR:",
      error
    );


    tagsContainer.innerHTML =
      `
        <div class="empty">
          Unable to load E-Tags.
        </div>
      `;


    tagCount.textContent =
      "";

  }

}



/* =====================================================
   COPY TEXT
===================================================== */

async function copyText(
  text
) {


  try {


    await navigator
      .clipboard
      .writeText(
        text
      );


  } catch {


    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      text;


    textarea.style.position =
      "fixed";


    textarea.style.opacity =
      "0";


    document.body.appendChild(
      textarea
    );


    textarea.select();


    document.execCommand(
      "copy"
    );


    textarea.remove();

  }

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
) {


  return String(
    value
  )


    .replaceAll(
      "&",
      "&amp;"
    )


    .replaceAll(
      "<",
      "&lt;"
    )


    .replaceAll(
      ">",
      "&gt;"
    )


    .replaceAll(
      '"',
      "&quot;"
    )


    .replaceAll(
      "'",
      "&#039;"
    );

}



/* =====================================================
   START
===================================================== */

async function start() {

  await loadTags();

}


start();


</script>

</body>

</html>
