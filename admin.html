<html lang="en">

<body>

<div class="container">

  <div class="logo">E-Tag</div>

  <div class="tagline">
    Admin Tag Generator
  </div>


  <!-- ADMIN LOGIN -->

  <section id="loginSection" class="card">

    <h2>Admin Login</h2>

    <label>Email</label>

    <input
      id="email"
      type="email"
      placeholder="Admin email"
      autocomplete="email"
    >

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginButton">
      Login
    </button>

    <div id="loginMessage" class="message"></div>

  </section>


  <!-- ADMIN PANEL -->

  <section id="adminSection" class="hidden">

    <!-- CREATE TAG -->

    <div class="card">

      <h2>Create New E-Tag</h2>

      <p style="color:#6b7280;font-size:14px;">
        Enter a unique Tag ID. The public E-Tag URL will be generated automatically.
      </p>

      <label>Unique Tag ID</label>

      <input
        id="tagCode"
        type="text"
        placeholder="Example: ETAG-000001"
        maxlength="30"
        autocomplete="off"
      >

      <button id="createButton">
        Generate E-Tag
      </button>

      <div id="createMessage" class="message"></div>

      <div id="generatedBox" class="url-box hidden">

        <strong>E-Tag URL</strong>

        <div id="generatedUrl" class="url"></div>

        <div class="row">

          <button
            id="copyButton"
            class="secondary"
          >
            Copy URL
          </button>

          <button
            id="openButton"
          >
            Open
          </button>

        </div>

      </div>

    </div>


    <!-- TAGS -->

    <div class="card">

      <h2>My E-Tags</h2>

      <div
        id="tagCount"
        class="count"
      >
        Loading...
      </div>

      <div
        id="tagsContainer"
        class="tag-list"
      >
        Loading...
      </div>

    </div>


    <!-- LOGOUT -->

    <div class="card">

      <button
        id="logoutButton"
        class="danger"
      >
        Logout
      </button>

    </div>

  </section>

</div>


<script type="module">

import { supabase } from "./supabase.js";


/* =====================================================
   CONFIG
===================================================== */

const CREATE_FUNCTION =
  "create-etag";

const SITE_URL =
  "https://emoon3d.github.io/E-Tag/";


/* =====================================================
   ELEMENTS
===================================================== */

const loginSection =
  document.getElementById("loginSection");

const adminSection =
  document.getElementById("adminSection");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("loginButton");

const loginMessage =
  document.getElementById("loginMessage");

const tagCodeInput =
  document.getElementById("tagCode");

const createButton =
  document.getElementById("createButton");

const createMessage =
  document.getElementById("createMessage");

const generatedBox =
  document.getElementById("generatedBox");

const generatedUrl =
  document.getElementById("generatedUrl");

const copyButton =
  document.getElementById("copyButton");

const openButton =
  document.getElementById("openButton");

const tagsContainer =
  document.getElementById("tagsContainer");

const tagCount =
  document.getElementById("tagCount");

const logoutButton =
  document.getElementById("logoutButton");


let lastGeneratedUrl = "";


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  element,
  text,
  type
) {

  element.textContent = text;

  element.className =
    "message " + type;

}


/* =====================================================
   HIDE MESSAGE
===================================================== */

function hideMessage(element) {

  element.textContent = "";

  element.className =
    "message";

}


/* =====================================================
   NORMALIZE TAG
===================================================== */

function normalizeTagCode(value) {

  return String(value || "")
    .trim()
    .toUpperCase();

}


/* =====================================================
   VALIDATE TAG
===================================================== */

function validateTagCode(tagCode) {

  if (!tagCode) {

    return "Tag ID is required.";

  }

  if (!/^[A-Z0-9_-]+$/.test(tagCode)) {

    return "Use only A-Z, 0-9, _ or -.";

  }

  if (tagCode.length > 30) {

    return "Tag ID cannot be longer than 30 characters.";

  }

  return null;

}


/* =====================================================
   LOGIN
===================================================== */

loginButton.addEventListener(
  "click",
  async () => {

    const email =
      emailInput.value
        .trim()
        .toLowerCase();

    const password =
      passwordInput.value;

    hideMessage(loginMessage);

    if (!email || !password) {

      showMessage(
        loginMessage,
        "Enter email and password.",
        "error"
      );

      return;

    }

    loginButton.disabled = true;

    loginButton.textContent =
      "Logging in...";

    try {

      const {
        data,
        error
      } =
      await supabase.auth.signInWithPassword({

        email,
        password

      });


      if (error) {

        showMessage(
          loginMessage,
          error.message,
          "error"
        );

        return;

      }


      if (!data.session) {

        showMessage(
          loginMessage,
          "Login session was not created.",
          "error"
        );

        return;

      }


      await showAdmin();

    } catch (error) {

      showMessage(
        loginMessage,
        error?.message ||
          "Login failed.",
        "error"
      );

    } finally {

      loginButton.disabled = false;

      loginButton.textContent =
        "Login";

    }

  }
);


/* =====================================================
   CREATE TAG
===================================================== */

createButton.addEventListener(
  "click",
  async () => {

    hideMessage(createMessage);

    generatedBox.classList.add("hidden");

    const tagCode =
      normalizeTagCode(
        tagCodeInput.value
      );


    const validation =
      validateTagCode(tagCode);


    if (validation) {

      showMessage(
        createMessage,
        validation,
        "error"
      );

      return;

    }


    createButton.disabled = true;

    createButton.textContent =
      "Creating E-Tag...";


    try {

      /*
       * IMPORTANT:
       *
       * The SERVICE ROLE KEY is NEVER
       * placed in this HTML file.
       *
       * The Edge Function handles
       * the database insert.
       */

      const {
        data,
        error
      } =
      await supabase.functions.invoke(
        CREATE_FUNCTION,
        {
          body: {
            tag_code: tagCode
          }
        }
      );


      if (error) {

        console.error(
          "CREATE ETAG ERROR:",
          error
        );

        showMessage(
          createMessage,
          error.message ||
            "Could not create E-Tag.",
          "error"
        );

        return;

      }


      if (
        !data ||
        data.success !== true
      ) {

        showMessage(
          createMessage,
          data?.error ||
            "Could not create E-Tag.",
          "error"
        );

        return;

      }


      /*
       * Prefer URL returned by
       * Edge Function.
       */

      const url =
        data.url ||
        (
          SITE_URL +
          "id/" +
          encodeURIComponent(tagCode)
        );


      lastGeneratedUrl =
        url;


      generatedUrl.textContent =
        url;


      generatedBox.classList.remove(
        "hidden"
      );


      showMessage(
        createMessage,
        "E-Tag created successfully.",
        "success"
      );


      tagCodeInput.value = "";


      await loadTags();


    } catch (error) {

      console.error(
        error
      );

      showMessage(
        createMessage,
        error?.message ||
          "Could not create E-Tag.",
        "error"
      );

    } finally {

      createButton.disabled = false;

      createButton.textContent =
        "Generate E-Tag";

    }

  }
);


/* =====================================================
   ENTER KEY
===================================================== */

tagCodeInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      event.preventDefault();

      createButton.click();

    }

  }
);


/* =====================================================
   COPY URL
===================================================== */

copyButton.addEventListener(
  "click",
  async () => {

    if (!lastGeneratedUrl) {

      return;

    }

    try {

      await navigator.clipboard.writeText(
        lastGeneratedUrl
      );

      copyButton.textContent =
        "Copied!";

      setTimeout(
        () => {

          copyButton.textContent =
            "Copy URL";

        },
        1500
      );

    } catch {

      /*
       * Fallback for browsers where
       * Clipboard API is unavailable.
       */

      const textarea =
        document.createElement("textarea");

      textarea.value =
        lastGeneratedUrl;

      document.body.appendChild(
        textarea
      );

      textarea.select();

      document.execCommand("copy");

      textarea.remove();

      copyButton.textContent =
        "Copied!";

      setTimeout(
        () => {

          copyButton.textContent =
            "Copy URL";

        },
        1500
      );

    }

  }
);


/* =====================================================
   OPEN GENERATED URL
===================================================== */

openButton.addEventListener(
  "click",
  () => {

    if (!lastGeneratedUrl) {

      return;

    }

    window.open(
      lastGeneratedUrl,
      "_blank",
      "noopener,noreferrer"
    );

  }
);


/* =====================================================
   LOAD TAGS
===================================================== */

async function loadTags() {

  tagsContainer.textContent =
    "Loading...";

  tagCount.textContent =
    "Loading...";


  /*
   * Admin page should normally
   * only be accessible after login.
   */

  const {
    data: {
      user
    }
  } =
  await supabase.auth.getUser();


  if (!user) {

    showLogin();

    return;

  }


  /*
   * Load all tags.
   *
   * This requires an RLS policy
   * allowing the logged-in admin
   * to SELECT the tags.
   */

  const {
    data,
    error
  } =
  await supabase
    .from("nfc_tags")
    .select(
      "id,tag_code,owner_id,active,created_at"
    )
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (error) {

    console.error(
      "LOAD TAGS ERROR:",
      error
    );

    tagsContainer.textContent =
      "Unable to load E-Tags.";

    tagCount.textContent =
      "";

    return;

  }


  if (!data || data.length === 0) {

    tagsContainer.textContent =
      "No E-Tags created yet.";

    tagCount.textContent =
      "0 E-Tags";

    return;

  }


  tagCount.textContent =
    `${data.length} E-Tag${data.length === 1 ? "" : "s"}`;


  tagsContainer.innerHTML = "";


  data.forEach(
    tag => {

      const div =
        document.createElement("div");

      div.className =
        "tag";


      const code =
        escapeHtml(
          tag.tag_code
        );


      const url =
        SITE_URL +
        "id/" +
        encodeURIComponent(
          tag.tag_code
        );


      const ownerStatus =
        tag.owner_id
          ? "Assigned"
          : "Unassigned";


      const statusClass =
        tag.active
          ? "active"
          : "inactive";


      div.innerHTML = `

        <div class="tag-code">
          ${code}
        </div>

        <div class="tag-status ${statusClass}">
          ${tag.active ? "Active" : "Inactive"}
          · ${ownerStatus}
        </div>

        <div class="tag-url">
          ${escapeHtml(url)}
        </div>

        <button
          class="copy-existing"
          data-url="${escapeHtml(url)}"
        >
          Copy URL
        </button>

      `;


      tagsContainer.appendChild(
        div
      );

    }
  );


  document
    .querySelectorAll(".copy-existing")
    .forEach(
      button => {

        button.addEventListener(
          "click",
          async () => {

            const url =
              button.dataset.url;

            try {

              await navigator.clipboard.writeText(
                url
              );

            } catch {

              const textarea =
                document.createElement(
                  "textarea"
                );

              textarea.value =
                url;

              document.body.appendChild(
                textarea
              );

              textarea.select();

              document.execCommand(
                "copy"
              );

              textarea.remove();

            }


            button.textContent =
              "Copied!";


            setTimeout(
              () => {

                button.textContent =
                  "Copy URL";

              },
              1500
            );

          }
        );

      }
    );

}


/* =====================================================
   SHOW ADMIN
===================================================== */

async function showAdmin() {

  loginSection.classList.add(
    "hidden"
  );

  adminSection.classList.remove(
    "hidden"
  );


  await loadTags();

}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin() {

  adminSection.classList.add(
    "hidden"
  );

  loginSection.classList.remove(
    "hidden"
  );

}


/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
  "click",
  async () => {

    await supabase.auth.signOut();

    showLogin();

    emailInput.value = "";

    passwordInput.value = "";

  }
);


/* =====================================================
   AUTH STATE
===================================================== */

supabase.auth.onAuthStateChange(
  async (
    event,
    session
  ) => {

    if (
      event === "SIGNED_OUT"
    ) {

      showLogin();

      return;

    }


    if (
      session &&
      (
        event === "SIGNED_IN" ||
        event === "INITIAL_SESSION"
      )
    ) {

      await showAdmin();

    }

  }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   START
===================================================== */

async function start() {

  const {
    data: {
      session
    }
  } =
  await supabase.auth.getSession();


  if (session) {

    await showAdmin();

  } else {

    showLogin();

  }

}


start();

</script>

</body>
</html>
