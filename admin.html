<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Tag Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      margin-top: 20px;
    }

    .tagline {
      text-align: center;
      color: #6b7280;
      margin: 6px 0 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,.06);
    }

    h2 {
      margin: 0 0 18px;
    }

    label {
      display: block;
      margin: 15px 0 6px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #111827;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin-top: 16px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .secondary {
      background: #6b7280;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      word-break: break-word;
    }

    .success {
      display: block;
      background: #ecfdf5;
      color: #166534;
    }

    .error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
    }

    .hidden {
      display: none !important;
    }

    .tag-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tag {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 15px;
    }

    .tag-code {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .tag-url {
      color: #2563eb;
      font-size: 13px;
      word-break: break-all;
      margin: 8px 0;
    }

    .tag-status {
      font-size: 13px;
      font-weight: 700;
    }

    .active {
      color: #16a34a;
    }

    .inactive {
      color: #dc2626;
    }

    .url-box {
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      background: #f3f4f6;
    }

    .url-box strong {
      display: block;
      margin-bottom: 7px;
    }

    .url {
      font-size: 13px;
      color: #2563eb;
      word-break: break-all;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row button {
      flex: 1;
    }

    .count {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .loading {
      text-align: center;
      color: #6b7280;
      padding: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    E-Tag
  </div>

  <div class="tagline">
    Admin Tag Generator
  </div>


  <!-- =====================================================
       CREATE TAG
  ====================================================== -->

  <section class="card">

    <h2>
      Create New E-Tag
    </h2>

    <p style="color:#6b7280;font-size:14px;">
      Enter a unique Tag ID. The public E-Tag URL will be
      generated automatically.
    </p>

    <label>
      Unique Tag ID
    </label>

    <input
      id="tagCode"
      type="text"
      placeholder="Example: ETAG-000001"
      maxlength="30"
      autocomplete="off"
    >

    <button id="createButton">
      Generate E-Tag
    </button>

    <div
      id="createMessage"
      class="message"
    ></div>


    <!-- GENERATED URL -->

    <div
      id="generatedBox"
      class="url-box hidden"
    >

      <strong>
        E-Tag URL
      </strong>

      <div
        id="generatedUrl"
        class="url"
      ></div>

      <div class="row">

        <button
          id="copyButton"
          class="secondary"
        >
          Copy URL
        </button>

        <button
          id="openButton"
        >
          Open
        </button>

      </div>

    </div>

  </section>


  <!-- =====================================================
       ALL TAGS
  ====================================================== -->

  <section class="card">

    <h2>
      My E-Tags
    </h2>

    <div
      id="tagCount"
      class="count"
    >
      Loading...
    </div>

    <div
      id="tagsContainer"
      class="tag-list"
    >
      <div class="loading">
        Loading...
      </div>
    </div>

  </section>

</div>


<script type="module">

import {
  supabase
} from "./supabase.js";


/* =====================================================
   CONFIG
===================================================== */

const CREATE_FUNCTION =
  "create-etag";

const SITE_URL =
  "https://emoon3d.github.io/E-Tag/";


/* =====================================================
   ELEMENTS
===================================================== */

const tagCodeInput =
  document.getElementById(
    "tagCode"
  );

const createButton =
  document.getElementById(
    "createButton"
  );

const createMessage =
  document.getElementById(
    "createMessage"
  );

const generatedBox =
  document.getElementById(
    "generatedBox"
  );

const generatedUrl =
  document.getElementById(
    "generatedUrl"
  );

const copyButton =
  document.getElementById(
    "copyButton"
  );

const openButton =
  document.getElementById(
    "openButton"
  );

const tagsContainer =
  document.getElementById(
    "tagsContainer"
  );

const tagCount =
  document.getElementById(
    "tagCount"
  );


let lastGeneratedUrl = "";


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  element,
  text,
  type
) {

  element.textContent =
    text;

  element.className =
    "message " + type;

}


function hideMessage(
  element
) {

  element.textContent =
    "";

  element.className =
    "message";

}


/* =====================================================
   NORMALIZE TAG CODE
===================================================== */

function normalizeTagCode(
  value
) {

  return String(
    value || ""
  )
    .trim()
    .toUpperCase();

}


/* =====================================================
   VALIDATE TAG CODE
===================================================== */

function validateTagCode(
  tagCode
) {

  if (!tagCode) {

    return "Tag ID is required.";

  }

  if (
    !/^[A-Z0-9_-]+$/.test(
      tagCode
    )
  ) {

    return (
      "Use only A-Z, 0-9, _ or -."
    );

  }

  if (
    tagCode.length > 30
  ) {

    return (
      "Tag ID cannot be longer than 30 characters."
    );

  }

  return null;

}


/* =====================================================
   CREATE TAG
===================================================== */

createButton.addEventListener(
  "click",
  async () => {

    hideMessage(
      createMessage
    );

    generatedBox.classList.add(
      "hidden"
    );


    const tagCode =
      normalizeTagCode(
        tagCodeInput.value
      );


    const validation =
      validateTagCode(
        tagCode
      );


    if (validation) {

      showMessage(
        createMessage,
        validation,
        "error"
      );

      return;

    }


    createButton.disabled =
      true;

    createButton.textContent =
      "Creating E-Tag...";


    try {

      /*
       * No login.
       * No password.
       * No secret key.
       */

      const {
        data,
        error
      } =
      await supabase.functions.invoke(
        CREATE_FUNCTION,
        {
          body: {
            tag_code: tagCode
          }
        }
      );


      if (error) {

        console.error(
          "CREATE ETAG ERROR:",
          error
        );

        showMessage(
          createMessage,
          error.message ||
            "Could not create E-Tag.",
          "error"
        );

        return;

      }


      if (
        !data ||
        data.success !== true
      ) {

        showMessage(
          createMessage,
          data?.error ||
            "Could not create E-Tag.",
          "error"
        );

        return;

      }


      const url =
        data.url ||
        (
          SITE_URL +
          "id/" +
          encodeURIComponent(
            tagCode
          )
        );


      lastGeneratedUrl =
        url;


      generatedUrl.textContent =
        url;


      generatedBox.classList.remove(
        "hidden"
      );


      showMessage(
        createMessage,
        "E-Tag created successfully.",
        "success"
      );


      tagCodeInput.value =
        "";


      await loadTags();


    } catch (error) {

      console.error(
        "CREATE ETAG ERROR:",
        error
      );

      showMessage(
        createMessage,
        error?.message ||
          "Could not create E-Tag.",
        "error"
      );

    } finally {

      createButton.disabled =
        false;

      createButton.textContent =
        "Generate E-Tag";

    }

  }
);


/* =====================================================
   ENTER KEY
===================================================== */

tagCodeInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      createButton.click();

    }

  }
);


/* =====================================================
   COPY GENERATED URL
===================================================== */

copyButton.addEventListener(
  "click",
  async () => {

    if (
      !lastGeneratedUrl
    ) {

      return;

    }


    await copyText(
      lastGeneratedUrl
    );


    copyButton.textContent =
      "Copied!";


    setTimeout(
      () => {

        copyButton.textContent =
          "Copy URL";

      },
      1500
    );

  }
);


/* =====================================================
   OPEN GENERATED URL
===================================================== */

openButton.addEventListener(
  "click",
  () => {

    if (
      !lastGeneratedUrl
    ) {

      return;

    }


    window.open(
      lastGeneratedUrl,
      "_blank",
      "noopener,noreferrer"
    );

  }
);


/* =====================================================
   COPY TEXT
===================================================== */

async function copyText(
  text
) {

  try {

    await navigator.clipboard.writeText(
      text
    );

  } catch {

    const textarea =
      document.createElement(
        "textarea"
      );

    textarea.value =
      text;

    document.body.appendChild(
      textarea
    );

    textarea.select();

    document.execCommand(
      "copy"
    );

    textarea.remove();

  }

}


/* =====================================================
   LOAD TAGS
===================================================== */

async function loadTags() {

  tagsContainer.innerHTML =
    `
      <div class="loading">
        Loading...
      </div>
    `;

  tagCount.textContent =
    "Loading...";


  const {
    data,
    error
  } =
  await supabase
    .from("nfc_tags")
    .select(
      "id,tag_code,owner_id,active,created_at"
    )
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (error) {

    console.error(
      "LOAD TAGS ERROR:",
      error
    );


    tagsContainer.innerHTML =
      `
        <div class="loading">
          Unable to load E-Tags.
        </div>
      `;

    tagCount.textContent =
      "";

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    tagsContainer.innerHTML =
      `
        <div class="loading">
          No E-Tags created yet.
        </div>
      `;

    tagCount.textContent =
      "0 E-Tags";

    return;

  }


  tagCount.textContent =
    `${data.length} E-Tag${
      data.length === 1
        ? ""
        : "s"
    }`;


  tagsContainer.innerHTML =
    "";


  data.forEach(
    tag => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "tag";


      const code =
        escapeHtml(
          tag.tag_code
        );


      const url =
        SITE_URL +
        "id/" +
        encodeURIComponent(
          tag.tag_code
        );


      const ownerStatus =
        tag.owner_id
          ? "Assigned"
          : "Unassigned";


      const statusClass =
        tag.active
          ? "active"
          : "inactive";


      div.innerHTML =
        `

        <div class="tag-code">
          ${code}
        </div>

        <div
          class="tag-status ${statusClass}"
        >
          ${
            tag.active
              ? "Active"
              : "Inactive"
          }
          ·
          ${ownerStatus}
        </div>

        <div class="tag-url">
          ${escapeHtml(url)}
        </div>

        <button
          class="copy-existing"
        >
          Copy URL
        </button>

        `;


      const copyExisting =
        div.querySelector(
          ".copy-existing"
        );


      copyExisting.addEventListener(
        "click",
        async () => {

          await copyText(
            url
          );


          copyExisting.textContent =
            "Copied!";


          setTimeout(
            () => {

              copyExisting.textContent =
                "Copy URL";

            },
            1500
          );

        }
      );


      tagsContainer.appendChild(
        div
      );

    }
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
) {

  return String(
    value
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   START
===================================================== */

async function start() {

  await loadTags();

}


start();

</script>

</body>
</html>
