/* =====================================================
   GET TAG CODE
===================================================== */

function getTagCode() {

  const marker = "/E-Tag/id/";

  const path =
    window.location.pathname;

  const position =
    path.indexOf(marker);

  if (position !== -1) {

    let code =
      path.substring(
        position + marker.length
      );

    code =
      code
        .split("/")[0]
        .split("?")[0]
        .trim();

    if (code) {

      try {
        return decodeURIComponent(code);
      } catch {
        return code;
      }

    }

  }


  const params =
    new URLSearchParams(
      window.location.search
    );

  const route =
    params.get("route");

  if (route) {

    let decoded = route;

    try {
      decoded =
        decodeURIComponent(route);
    } catch {}

    const routePosition =
      decoded.indexOf(marker);

    if (routePosition !== -1) {

      let code =
        decoded.substring(
          routePosition + marker.length
        );

      code =
        code
          .split("/")[0]
          .split("?")[0]
          .trim();

      if (code) {

        try {
          return decodeURIComponent(code);
        } catch {
          return code;
        }

      }

    }

  }


  return null;

}


/* =====================================================
   VALIDATE TAG CODE
===================================================== */

function normalizeTagCode(value) {

  const code =
    String(value || "")
      .trim()
      .toUpperCase();

  if (!code) {
    return null;
  }

  if (!/^[A-Z0-9_-]+$/.test(code)) {
    return null;
  }

  if (code.length > 30) {
    return null;
  }

  return code;

}

function setSelectedTemplate(template) {

  const validTemplates = [
    "boy",
    "girl",
    "business",
    "couple"
  ];

  if (!validTemplates.includes(template)) {
    template = "boy";
  }

  selectedTemplate =
    template;

  document
    .querySelectorAll(".template-option")
    .forEach(option => {

      option.classList.toggle(
        "selected",
        option.dataset.template === template
      );

    });

}

===================================================== */

async function activateTag(tagCode) {

  const normalized =
    normalizeTagCode(tagCode);

  if (!normalized) {

    return {
      success: false,
      error: "Invalid E-Tag code."
    };

  }


  const {
    data: {
      session
    }
  } =
    await supabase.auth.getSession();


  if (!session) {

    return {
      success: false,
      error: "You must be logged in."
    };

  }


  try {

    const {
      data,
      error
    } =
      await supabase.functions.invoke(
        ACTIVATE_FUNCTION,
        {
          body: {
            tag_code: normalized
          }
        }
      );


    if (error) {

      console.error(
        "ACTIVATE FUNCTION ERROR:",
        error
      );

      return {
        success: false,
        error:
          error.message ||
          "Activation failed."
      };

    }


    if (
      !data ||
      data.success !== true
    ) {

      return {
        success: false,
        error:
          data?.error ||
          "Activation failed."
      };

    }


    return {
      success: true,
      tag: data.tag
    };

  } catch (error) {

    console.error(
      "ACTIVATION ERROR:",
      error
    );

    return {
      success: false,
      error:
        error?.message ||
        "Activation failed."
    };

  }

}


/* =====================================================
   AUTHENTICATED USER
===================================================== */

async function handleAuthenticatedUser() {

  const {
    data: {
      user
    }
  } =
    await supabase.auth.getUser();


  if (!user) {

    showLogin();
    return;

  }


  /*
   * IMPORTANT:
   * Pending activation gets priority.
   */

  const storedTag =
    sessionStorage.getItem(
      "pendingTag"
    );


  if (storedTag) {

    const normalized =
      normalizeTagCode(storedTag);


    if (!normalized) {

      sessionStorage.removeItem(
        "pendingTag"
      );

      showLogin(
        "Invalid E-Tag code.",
        "error"
      );

      return;

    }


    pendingTagCode =
      normalized;


    hideAll();

    activatingSection.classList.remove(
      "hidden"
    );


    document
      .getElementById(
        "activatingText"
      )
      .textContent =
      "Connecting E-Tag " +
      normalized +
      " to your account...";


    const result =
      await activateTag(
        normalized
      );


    if (!result.success) {

      showMessage(
        "activatingMessage",
        result.error,
        "error"
      );

      return;

    }


    sessionStorage.removeItem(
      "pendingTag"
    );


    currentTag =
      result.tag;


    /*
     * Profile setup.
     */

    await showProfileSetup(
      user.id
    );

    return;

  }


  /*
   * Check edit request.
   */

  const edited =
    await checkPendingEdit();

  if (edited) {
    return;
  }


  /*
   * Normal dashboard.
   */

  await loadDashboard();

}

    return;

  document
    .getElementById("setupBio")

  setSelectedTemplate(

  );

/* =====================================================
   LOAD TAGS
===================================================== */

async function loadTags(userId) {

  const container =
    document.getElementById(
      "tagsContainer"
    );


  container.textContent =
    "Loading...";


  const {
    data,
    error
  } =
    await supabase
      .from("nfc_tags")
      .select(
        "id,tag_code,owner_id,active,created_at"
      )
      .eq(
        "owner_id",
        userId
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    container.textContent =
      "Unable to load E-Tags.";

    console.error(
      "TAGS ERROR:",
      error
    );

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    container.textContent =
      "No E-Tags assigned yet.";

    return;

  }


  container.innerHTML =
    "";


  data.forEach(tag => {

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "tag";


    const url =
      SITE_URL +
      "id/" +
      encodeURIComponent(
        tag.tag_code
      );


    div.innerHTML = `

      <div class="tag-code">
        ${escapeHtml(tag.tag_code)}
      </div>

      <div class="status"
        style="color:${
          tag.active
            ? "#16a34a"
            : "#dc2626"
        }"
      >
        ${
          tag.active
            ? "Active"
            : "Inactive"
        }
      </div>

      <div style="
        margin-top:8px;
        font-size:12px;
        word-break:break-all;
      ">
        ${escapeHtml(url)}
      </div>

    `;


    container.appendChild(
      div
    );

  });

}

async function loadPublicTag(tagCode) {

  const normalized =
    normalizeTagCode(tagCode);


  if (!normalized) {

    showNotFound(
      "Invalid E-Tag code."
    );

    return;

  }


  pendingTagCode =
    normalized;


  hideAll();

  publicTagSection.classList.remove(
    "hidden"
  );


  document
    .getElementById("publicLoading")
    .classList.remove("hidden");


  document
    .getElementById("activationBox")
    .classList.add("hidden");


  document
    .getElementById("publicProfileBox")
    .classList.add("hidden");


  const {
    data,
    error
  } =
    await supabase
      .from("nfc_tags")
      .select(
        "id,tag_code,owner_id,active,created_at"
      )
      .eq(
        "tag_code",
        normalized
      )
      .maybeSingle();


  document
    .getElementById("publicLoading")
    .classList.add("hidden");


  if (error) {

    console.error(
      "PUBLIC TAG ERROR:",
      error
    );

    showNotFound(
      "Database error: " +
      error.message
    );

    return;

  }


  if (!data) {

    showNotFound(
      "No E-Tag found: " +
      normalized
    );

    return;

  }


  currentTag =
    data;


  /*
   * UNUSED TAG
   */

  if (
    data.active === false &&
    data.owner_id === null
  ) {

    document
      .getElementById(
        "activationBox"
      )
      .classList.remove(
        "hidden"
      );


    document
      .getElementById(
        "activationTagId"
      )
      .textContent =
      "E-Tag: " +
      data.tag_code;


    return;

  }


  /*
   * ACTIVE TAG
   */

  if (
    data.active === true &&
    data.owner_id
  ) {

    await loadPublicProfile(
      data
    );

    return;

  }


  showNotFound(
    "Invalid E-Tag status."
  );

}


/* =====================================================
   ACTIVATE BUTTON
===================================================== */

document
  .getElementById("activateButton")
  ?.addEventListener(
    "click",
    async () => {

      if (!currentTag) {

        showMessage(
          "activationMessage",
          "E-Tag information is missing.",
          "error"
        );

        return;

      }


      pendingTagCode =
        currentTag.tag_code;


      const {
        data: {
          session
        }
      } =
        await supabase.auth.getSession();


      /*
       * Not logged in.
       * Go to signup.
       */

      if (!session) {

        sessionStorage.setItem(
          "pendingTag",
          currentTag.tag_code
        );


        hideAll();

        signupSection.classList.remove(
          "hidden"
        );


        document
          .getElementById(
            "signupTagText"
          )
          .textContent =
          "E-Tag: " +
          currentTag.tag_code;


        return;

      }


      /*
       * Already logged in.
       */

      hideAll();

      activatingSection.classList.remove(
        "hidden"
      );


      document
        .getElementById(
          "activatingText"
        )
        .textContent =
        "Connecting E-Tag " +
        currentTag.tag_code +
        " to your account...";


      const result =
        await activateTag(
          currentTag.tag_code
        );


      if (!result.success) {

        showMessage(
          "activatingMessage",
          result.error,
          "error"
        );

        return;

      }


      currentTag =
        result.tag;


      pendingTagCode = null;


      await showProfileSetup(
        session.user.id
      );

    }
  );


/* =====================================================
   LOAD PUBLIC PROFILE
===================================================== */

async function loadPublicProfile(tag) {

  if (!tag.owner_id) {

    showNotFound(
      "This E-Tag has no owner."
    );

    return;

  }


  const {
    data: profile,
    error
  } =
    await supabase
      .from("profiles")
      .select(
        "id,display_name,bio,phone,whatsapp,email,template"
      )
      .eq(
        "id",
        tag.owner_id
      )
      .maybeSingle();


  if (error) {

    showNotFound(
      "Profile error: " +
      error.message
    );

    return;

  }


  if (!profile) {

    showNotFound(
      "Owner profile not found."
    );

    return;

  }


  document
    .getElementById(
      "publicProfileBox"
    )
    .classList.remove(
      "hidden"
    );


  applyPublicTemplate(
    profile.template || "boy"
  );


  const name =
    profile.display_name ||
    "Unnamed E-Tag";


  const bio =
    profile.bio ||
    "Digital Identity";


  document
    .getElementById(
      "publicName"
    )
    .textContent =
    name;


  document
    .getElementById(
      "publicBio"
    )
    .textContent =
    bio;


  document
    .getElementById(
      "publicAvatar"
    )
    .textContent =
    name
      .charAt(0)
      .toUpperCase();


  const buttons =
    document.getElementById(
      "publicButtons"
    );


  buttons.innerHTML =
    "";


  if (profile.phone) {

    const a =
      document.createElement("a");

    a.className =
      "info-button";

    a.href =
      "tel:" +
      profile.phone;

    a.textContent =
      "📞 Call";

    buttons.appendChild(a);

  }


  if (profile.whatsapp) {

    const clean =
      profile.whatsapp.replace(
        /[^0-9]/g,
        ""
      );


    const a =
      document.createElement("a");

    a.className =
      "info-button";

    a.href =
      "https://wa.me/" +
      clean;

    a.target =
      "_blank";

    a.rel =
      "noopener noreferrer";

    a.textContent =
      "💬 WhatsApp";

    buttons.appendChild(a);

  }


  if (profile.email) {

    const a =
      document.createElement("a");

    a.className =
      "info-button";

    a.href =
      "mailto:" +
      profile.email;

    a.textContent =
      "✉️ Email";

    buttons.appendChild(a);

  }


  /*
   * IMPORTANT:
   * Edit button is only useful
   * for the actual owner.
   */

  const {
    data: {
      session
    }
  } =
    await supabase.auth.getSession();


  const editButton =
    document.getElementById(
      "ownerEditButton"
    );


  if (
    session &&
    session.user.id ===
    tag.owner_id
  ) {

    editButton.classList.remove(
      "hidden"
    );

  } else {

    editButton.classList.add(
      "hidden"
    );

  }

}


/* =====================================================
   EDIT PROFILE

document

      if (!currentTag) {

/* =====================================================
   CHECK PENDING EDIT
===================================================== */

async function checkPendingEdit() {

  const editTagCode =
    sessionStorage.getItem(
      "editTagCode"
    );


  if (!editTagCode) {
    return false;
  }


  const {
    data: {
      user
    }
  } =
    await supabase.auth.getUser();


  if (!user) {
    return false;
  }


  const normalized =
    normalizeTagCode(
      editTagCode
    );


  if (!normalized) {

    sessionStorage.removeItem(
      "editTagCode"
    );

    return false;

  }


  const {
    data: tag,
    error
  } =
    await supabase
      .from("nfc_tags")
      .select(
        "id,tag_code,owner_id,active"
      )
      .eq(
        "tag_code",
        normalized
      )
      .maybeSingle();


  sessionStorage.removeItem(
    "editTagCode"
  );


  if (error || !tag) {

    showMessage(
      "loginMessage",
      "E-Tag not found.",
      "error"
    );

    return false;

  }


  if (
    tag.owner_id !==
    user.id
  ) {

    showMessage(
      "loginMessage",
      "This account is not the owner of this E-Tag.",
      "error"
    );

    return false;

  }


  if (tag.active !== true) {

    showMessage(
      "loginMessage",
      "This E-Tag is not active.",
      "error"
    );

    return false;

  }


  currentTag =
    tag;


  await loadDashboard();


  return true;

}


/* =====================================================
   APPLY PUBLIC TEMPLATE
===================================================== */

function applyPublicTemplate(template) {

  const validTemplates = [
    "boy",
    "girl",
    "business",
    "couple"
  ];


  if (!validTemplates.includes(template)) {
    template = "boy";
  }


  const box =
    document.getElementById(
      "publicTemplate"
    );


  box.classList.remove(
    "template-boy",
    "template-girl",
    "template-business",
    "template-couple"
  );


  box.classList.add(
    "template-" +
    template
  );


  const names = {

    boy: "BOY",
    girl: "GIRL",
    business: "BUSINESS",
    couple: "COUPLE"

  };


  document
    .getElementById(
      "publicTemplateBadge"
    )
    .textContent =
    names[template];

}


/* =====================================================
   NOT FOUND
===================================================== */

function showNotFound(message) {

  hideAll();

  notFoundSection.classList.remove(
    "hidden"
  );


  document
    .getElementById(
      "notFoundMessage"
    )
    .textContent =
    message ||
    "This E-Tag does not exist.";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value)

    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

supabase.auth.onAuthStateChange(
  async (event, session) => {

    console.log(

    );


    /*

     */

    if (
      event ===

    ) {

      updatePasswordSection.classList.remove(

      );

    ) {

/* =====================================================
   START APP
===================================================== */

async function startApp() {

  console.log(
    "E-Tag app starting..."
  );


  /*
   * PASSWORD RECOVERY
   */

  if (
    window.location.hash.includes(
      "type=recovery"
    )
  ) {

    hideAll();

    updatePasswordSection.classList.remove(
      "hidden"
    );

    return;

  }


  const tagCode =
    getTagCode();


  /*
   * TAG URL
   */

  if (tagCode) {

    pendingTagCode =
      normalizeTagCode(
        tagCode
      );


    if (!pendingTagCode) {

      showNotFound(
        "Invalid E-Tag code."
      );

      return;

    }


    /*
     * Always load the tag first.
     *
     * This is important because
     * a logged-in user may still
     * be viewing a public tag.
     */

    await loadPublicTag(
      pendingTagCode
    );

    return;

  }


  /*
   * NO TAG URL
   */

  const {
    data: {
      session
    }
  } =
    await supabase.auth.getSession();


  if (!session) {

    showLogin();

    return;

  }


  /*
   * Check pending edit.
   */

  const edited =
    await checkPendingEdit();


  if (edited) {
    return;
  }


  /*
   * Check pending activation.
   */

  const pending =
    sessionStorage.getItem(
      "pendingTag"
    );


  if (pending) {

    pendingTagCode =
      normalizeTagCode(
        pending
      );


    if (!pendingTagCode) {

      sessionStorage.removeItem(
        "pendingTag"
      );

      await loadDashboard();
      return;

    }


    await handleAuthenticatedUser();

    return;

  }


  /*
   * Normal dashboard.
   */

  await loadDashboard();

}


/* =====================================================
   RUN
===================================================== */

startApp();

</script>
