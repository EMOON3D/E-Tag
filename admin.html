<!DOCTYPE html>
<html lang="en">

<head>

      content="width=device-width, initial-scale=1.0">

<title>E-Tag | Admin</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f6f8;

}

  width: 100%;
  max-width: 430px;
  margin: auto;

}

  text-align: center;

}

  background: white;
  border-radius: 18px;

<body>

<script type="module">

/* =========================================
   SUPABASE
========================================= */

import {
  supabase
} from "./supabase.js";


/* =========================================
   SITE
========================================= */

const SITE_URL =
"https://emoon3d.github.io/E-Tag/";


/* =========================================
   ELEMENTS
========================================= */

const tagCodeInput =
document.getElementById(
"tagCode"
);

const generateButton =
document.getElementById(
"generateButton"
);

const message =
document.getElementById(
"message"
);

const resultCard =
document.getElementById(
"resultCard"
);

const resultTagCode =
document.getElementById(
"resultTagCode"
);

const resultUsername =
document.getElementById(
"resultUsername"
);

const resultPassword =
document.getElementById(
"resultPassword"
);

const resultUrl =
document.getElementById(
"resultUrl"
);


/* =========================================
   MESSAGE
========================================= */

function showMessage(
text,
type
) {

message.textContent =
text;

message.className =
"message " + type;

}


/* =========================================
   RANDOM STRING
========================================= */

function randomString(
length
) {

const chars =
"ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";

let result = "";

const array =
new Uint32Array(
length
);

crypto.getRandomValues(
array
);

for (
let i = 0;
i < length;
i++
) {

result +=
chars[
array[i] %
chars.length
];

}

return result;

}


/* =========================================
   GENERATE USERNAME
========================================= */

function generateUsername() {

return "etag_" +
randomString(8);

}


/* =========================================
   GENERATE PASSWORD
========================================= */

function generatePassword() {

return (
randomString(5) +
"!" +
randomString(5)
);

}


/* =========================================
   GENERATE TAG
========================================= */

generateButton.addEventListener(
"click",
async () => {

const tagCode =
tagCodeInput
.value
.trim()
.toUpperCase();


/* VALIDATE */

if (!tagCode) {

showMessage(
"Enter a tag code first.",
"error"
);

return;

}


if (
!/^[A-Z0-9_-]+$/.test(
tagCode
)
) {

showMessage(
"Use only A-Z, 0-9, _ or - in the tag code.",
"error"
);

return;

}


/* DISABLE BUTTON */

generateButton.disabled =
true;

generateButton.textContent =
"Creating...";


try {


/* =========================================
   CHECK EXISTING TAG
========================================= */

const {
data: existing,
error: checkError
} =
await supabase
.from("nfc_tags")
.select(
"id,tag_code,owner_id,active"
)
.eq(
"tag_code",
tagCode
)
.maybeSingle();


if (checkError) {

throw checkError;

}


if (existing) {

showMessage(
"This tag code already exists.",
"error"
);

return;

}


/* =========================================
   GENERATE CREDENTIALS
========================================= */

const username =
generateUsername();

const password =
generatePassword();


/*
IMPORTANT:

The password is currently generated
for giving to the customer.

We do NOT save the password in
nfc_tags.
*/


/* =========================================
   CREATE TAG
========================================= */

const {
data,
error
} =
await supabase
.from("nfc_tags")
.insert({

tag_code:
tagCode,

tag_username:
username,

owner_id:
null,

active:
false

})
.select(
"id,tag_code,tag_username,owner_id,active"
)
.single();


if (error) {

throw error;

}


/* =========================================
   NFC URL
========================================= */

const nfcUrl =
SITE_URL +
"id/" +
encodeURIComponent(
data.tag_code
);


/* =========================================
   DISPLAY RESULT
========================================= */

resultTagCode.textContent =
data.tag_code;

resultUsername.textContent =
username;

resultPassword.textContent =
password;

resultUrl.textContent =
nfcUrl;

resultCard.classList.remove(
"hidden"
);


showMessage(
"E-Tag created successfully.",
"success"
);


/*
Clear input
*/

tagCodeInput.value = "";


/*
IMPORTANT:

Keep password only in this page's
current memory.
*/

window.currentCredentials = {

username:
username,

password:
password,

url:
nfcUrl

};


} catch (error) {

console.error(
error
);

showMessage(
"Error: " +
error.message,
"error"
);

} finally {

generateButton.disabled =
false;

generateButton.textContent =
"Generate E-Tag";

}

}
);


/* =========================================
   COPY URL
========================================= */

document
.getElementById(
"copyUrlButton"
)
.addEventListener(
"click",
async () => {

if (
!window.currentCredentials
) {

return;

}

await navigator.clipboard.writeText(
window.currentCredentials.url
);

showMessage(
"NFC URL copied.",
"success"
);

}
);


/* =========================================
   COPY CREDENTIALS
========================================= */

document
.getElementById(
"copyCredentialsButton"
)
.addEventListener(
"click",
async () => {

if (
!window.currentCredentials
) {

return;

}

const text =
"Username: " +
window.currentCredentials.username +
"\nPassword: " +
window.currentCredentials.password;

await navigator.clipboard.writeText(
text
);

showMessage(
"Username and password copied.",
"success"
);

}
);

</script>

</body>

</html>
